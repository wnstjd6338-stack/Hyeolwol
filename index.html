<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0c0d12"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="혈월야행">
</head><body>
<title>혈월야행</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=IBM+Plex+Mono:wght@500&family=Song+Myung&display=swap">
<style>
/* Layout: full-bleed ink-wash world on canvas; HUD sits at the corners like seals on a scroll; menus are dark paper sheets. Single dark look by design. */
:root{
  --ink:#0c0d12; --ink-2:#14161e; --sheet:rgba(16,17,24,.97);
  --bone:#e8e0cc; --mute:#968f7e; --gold:#c8a259; --blood:#b8283c; --jade:#5ed4b9;
  --line:rgba(200,162,89,.26); --pos:#7fd88f; --neg:#ff6b7d;
  --f-disp:'Song Myung','Nanum Myeongjo','Batang',serif;
  --f-body:'Gowun Dodum','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  --f-num:'IBM Plex Mono',ui-monospace,Menlo,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
button,.cell,.card{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
#game,#game img{-webkit-touch-callout:none}
html,body{overscroll-behavior:none}
.fsb{position:fixed;right:16px;top:calc(12px + env(safe-area-inset-top,0px));z-index:21}
.rot{display:none;font-size:12px;color:var(--gold);margin:0}
@media (pointer:coarse) and (orientation:portrait){.rot{display:block}}
@media (max-height:520px){
  .tr{grid-auto-flow:column;gap:5px}
  .mb{width:40px;height:40px}.mb span{font-size:16px}.mb small{font-size:8.5px}
  .tl{gap:4px;width:min(300px,calc(100vw - 360px))}
  .tl .cg{width:32px;height:32px;font-size:18px}
  .tq{padding:4px 8px}.tq span:not(.go){display:none}
  .sk{width:42px;height:42px;font-size:19px}
  .dash{width:64px;height:64px}
  .talk{bottom:calc(88px + env(safe-area-inset-bottom,0px))}
  .por{height:86vh}.box{min-height:96px;padding:18px 16px 20px}#vnT{font-size:15px;line-height:1.6}
  #bossBar,#gauge{top:auto!important;bottom:calc(70px + env(safe-area-inset-bottom,0px))!important;left:auto!important;right:96px!important;transform:none!important;width:min(380px,calc(100vw - 420px))!important}
  h1{font-size:56px}.ttl{gap:10px}.seal{display:none}
  #toasts{bottom:auto;top:calc(64px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);width:min(420px,calc(100vw - 380px));justify-items:center}
  .sheet{max-height:calc(100vh - 16px);max-height:calc(100dvh - 16px)}
  .pot{width:50px;height:50px;bottom:calc(86px + env(safe-area-inset-bottom,0px));right:23px}
  .tgt{bottom:calc(142px + env(safe-area-inset-bottom,0px))}
  .talk{bottom:calc(178px + env(safe-area-inset-bottom,0px))}.mbody{padding:10px 14px 14px}
}
html,body{height:100%;margin:0;overflow:hidden;background:var(--ink);color:var(--bone);font-family:var(--f-body)}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0}
button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--jade);outline-offset:2px}
button:disabled{opacity:.38;cursor:not-allowed}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
#game{position:fixed;inset:0;user-select:none;-webkit-user-select:none;touch-action:none}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block}

/* title & class select */
.screen{position:fixed;inset:0;display:grid;place-items:center;padding:24px 16px;overflow:auto;z-index:20;touch-action:pan-y}
.ttl{text-align:center;display:grid;gap:16px;justify-items:center;max-width:560px}
.seal{font-family:var(--f-disp);color:#fff2ea;background:var(--blood);width:58px;padding:8px 0;line-height:1.1;font-size:21px;border-radius:3px;box-shadow:0 0 0 3px rgba(0,0,0,.35) inset,0 0 50px rgba(184,40,60,.45)}
h1{font-family:var(--f-disp);font-weight:400;font-size:clamp(52px,13vw,104px);letter-spacing:.1em;margin:0;line-height:1;text-shadow:0 0 34px rgba(184,40,60,.5);text-wrap:balance}
.sub{color:var(--mute);margin:0;font-size:15px}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.btn{border:1px solid var(--line);background:rgba(12,13,18,.75);padding:12px 24px;border-radius:2px;font-size:15px;letter-spacing:.05em}
.btn.pri{background:var(--blood);border-color:#d8495c;color:#fff4ee}
.btn:hover:not(:disabled){border-color:var(--gold)}
.hint{font-size:12px;color:var(--mute);margin:0;line-height:1.6}
.cs{width:min(1000px,100%);display:grid;gap:18px}
.cs h2{font-family:var(--f-disp);font-weight:400;font-size:clamp(24px,5vw,32px);margin:0;text-align:center;letter-spacing:.06em}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px}
.card{border:1px solid var(--line);background:linear-gradient(180deg,rgba(255,255,255,.03),rgba(0,0,0,.3));padding:0 0 14px;text-align:left;display:grid;gap:6px;align-content:start;overflow:hidden;border-radius:2px;transition:border-color .2s,box-shadow .2s;min-width:0}
.card.on{border-color:var(--cc);box-shadow:0 0 0 1px var(--cc),0 14px 44px -14px var(--cc)}
.card .pv{height:150px;overflow:hidden;background:radial-gradient(circle at 50% 70%,color-mix(in srgb,var(--cc) 22%,transparent),transparent 70%)}
.card .pv svg{width:100%;height:auto;display:block;margin-top:-6px}
.card .pv img{width:100%;height:220px;object-fit:contain;object-position:50% 12%;display:block;margin-top:6px}
.card .pv{height:170px}
.cp{display:flex;gap:10px;align-items:baseline;font-size:12px;color:var(--mute);flex-wrap:wrap}
.cp b{font-family:var(--f-num);font-size:15px;color:var(--gold);font-weight:500}
.cp .rec{font-family:var(--f-num)}
.cell .ic{width:84%;height:84%;object-fit:cover;border-radius:2px;filter:saturate(.9);pointer-events:none}
.cell .ic+.gl{position:absolute;bottom:1px;left:3px;font-size:11px}
.cell.vac .ic{opacity:.22;filter:grayscale(1)}
.cell small{position:absolute;bottom:1px;right:3px;text-shadow:0 1px 2px #000}
.cell .up{bottom:auto;top:2px;right:auto;left:50%;transform:translateX(-50%)}
.cell .st{position:absolute;bottom:1px;left:3px;font-style:normal;font-size:11px;font-family:var(--f-disp);color:var(--sc);text-shadow:0 0 4px #000}
.tabs{display:flex;gap:6px}.tab{flex:1;padding:9px;border:1px solid var(--line);background:rgba(255,255,255,.02);font-size:14px;border-radius:2px;color:var(--mute)}.tab.on{color:var(--bone);border-color:var(--gold);background:rgba(200,162,89,.1)}
.setb{border:1px solid color-mix(in srgb,var(--sc) 55%,transparent);background:color-mix(in srgb,var(--sc) 7%,transparent);padding:8px 10px;font-size:12.5px;border-radius:2px}
.setb b{font-family:var(--f-disp);font-weight:400;font-size:15px;color:var(--sc)}.setb ul{margin:4px 0 0;padding-left:18px;color:var(--mute)}.setb li.on{color:var(--bone)}
.petrow,.partyrow{display:grid;grid-template-columns:84px 1fr;gap:12px;padding:12px;border:1px solid rgba(232,224,204,.1);border-radius:2px;align-items:center}
.petrow.on,.partyrow.on{border-color:var(--gold);background:rgba(200,162,89,.06)}
.petrow img,.partyrow img{width:84px;height:84px;object-fit:contain}
.partyrow.empty img{opacity:.35;filter:grayscale(1)}
.petrow h5,.partyrow h5{margin:0;font-family:var(--f-disp);font-weight:400;font-size:19px;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.petrow p,.partyrow p{margin:4px 0;font-size:12.5px;color:#cfc7b3;line-height:1.5}.petrow .eff{color:var(--jade)}
.pn{background:rgba(0,0,0,.4);border:1px solid var(--line);color:var(--bone);padding:7px 9px;font:inherit;font-size:13px;width:120px;border-radius:2px}
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.cgrid label{display:grid;gap:3px;font-size:12px;color:var(--mute)}
.cgrid input,.cgrid select{background:#0f1016;color:var(--bone);border:1px solid var(--line);padding:7px 8px;font:inherit;font-size:13px;border-radius:2px;width:100%;min-width:0}
.code{width:100%;background:#0f1016;color:var(--bone);border:1px solid var(--line);padding:8px;font-family:var(--f-num);font-size:11px;border-radius:2px;resize:vertical;word-break:break-all}
.potdot{display:inline-block;width:10px;height:14px;border-radius:3px 3px 5px 5px;background:var(--pc);margin-right:6px;vertical-align:-1px}
.dh .gl img{width:100%;height:100%;object-fit:cover}
.achrow{display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid rgba(232,224,204,.08)}
.achrow .ai{width:44px;height:44px;display:grid;place-items:center;font-family:var(--f-disp);font-size:22px;border:1px solid var(--line);color:#4a4740}
.achrow.done .ai{color:var(--gold);border-color:var(--gold);box-shadow:inset 0 0 12px -4px var(--gold)}
.achrow.got .ai{color:var(--jade);border-color:rgba(94,212,185,.5)}
.achrow h5{margin:0;font-family:var(--f-disp);font-weight:400;font-size:17px}
.achrow p{margin:2px 0 0;font-size:12px;color:#cfc7b3}
.achrow .pg{height:4px;background:rgba(0,0,0,.5);margin-top:6px;max-width:260px}
.achrow .pg i{display:block;height:100%;background:var(--gold)}
.achrow .rw{font-size:11px;color:var(--mute);margin-top:4px}
.lockt{color:#ff8f9d;font-size:11px}
.card h4{margin:0 14px;font-family:var(--f-disp);font-weight:400;font-size:24px;color:var(--cc);display:flex;align-items:baseline;gap:8px}
.card h4 small{font-family:var(--f-body);font-size:12px;color:var(--mute)}
.card p{margin:0 14px;font-size:13px;line-height:1.6;color:#cfc7b3}
.card .gls{margin:2px 14px 0;font-family:var(--f-disp);font-size:18px;letter-spacing:.3em;color:var(--cc);opacity:.85}
.card .ms{margin:0 14px;font-size:11px;letter-spacing:.08em;color:var(--gold)}
.namer{display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap}
.namer label{font-size:14px;color:var(--mute)}
.namer input{background:rgba(0,0,0,.4);border:1px solid var(--line);color:var(--bone);padding:10px 12px;font:inherit;width:160px;border-radius:2px}

/* HUD */
#hud{position:absolute;inset:0;pointer-events:none;text-shadow:0 1px 2px #000,0 0 10px rgba(0,0,0,.85)}
.tl::before{content:'';position:absolute;inset:-12px -40px -10px -16px;background:radial-gradient(ellipse at 20% 30%,rgba(6,6,9,.6),rgba(6,6,9,0) 70%);z-index:-1}
#hud .pe{pointer-events:auto}
.tl{position:absolute;left:16px;top:calc(12px + env(safe-area-inset-top,0px));width:min(320px,calc(100vw - 96px));display:grid;gap:6px}
.who{display:flex;gap:10px;align-items:center}
.cg{font-family:var(--f-disp);width:40px;height:40px;display:grid;place-items:center;background:var(--cc,var(--blood));color:#130e0f;font-size:22px;border-radius:2px;flex:none}
.who b{font-family:var(--f-disp);font-weight:400;font-size:18px;letter-spacing:.04em}
.who .lvl{font-size:12px;color:var(--gold);margin-left:6px}
.mapn{font-size:12px;color:var(--mute)}
.bar{position:relative;height:15px;background:rgba(0,0,0,.6);border:1px solid rgba(232,224,204,.18);overflow:hidden;border-radius:1px}
.bar i{position:absolute;top:0;bottom:0;left:0;width:0}
.bar.hp i{background:linear-gradient(90deg,#6f1221,#d0364b)}
.bar.hp i.sh{background:rgba(243,207,69,.5)}
.bar span{position:absolute;inset:0;display:grid;place-items:center;font-size:10px;font-family:var(--f-num);text-shadow:0 1px 2px #000}
.bar.xp{height:5px}.bar.xp i{background:var(--jade)}
.cur{display:flex;gap:12px;font-size:12px;flex-wrap:wrap}
.cur em{font-style:normal;font-family:var(--f-disp);margin-right:4px}
.cur .cgd{color:#f3cf45}.cur .cst{color:#9fc3e8}.cur .csl{color:#c79bff}
.trk{display:grid;gap:4px;margin-top:4px}
.tq{display:grid;gap:1px;text-align:left;background:linear-gradient(90deg,rgba(10,10,14,.78),rgba(10,10,14,0));border-left:2px solid var(--gold);padding:6px 10px;font-size:12px;line-height:1.4;min-width:0}
.tq.b{border-left-color:var(--jade)}
.tq em{font-style:normal;font-size:10px;letter-spacing:.12em;color:var(--gold)}
.tq.b em{color:var(--jade)}
.tq b{font-weight:400;font-family:var(--f-disp);font-size:14px}
.tq span{color:#cfc7b3}
.tq .go{color:var(--jade);font-size:11px}
.tr{position:absolute;right:16px;top:calc(12px + env(safe-area-inset-top,0px));display:grid;gap:6px}
.mb{width:50px;height:50px;border:1px solid var(--line);background:rgba(12,13,18,.8);display:grid;place-items:center;align-content:center;border-radius:2px;padding:0;position:relative}
.mb span{font-family:var(--f-disp);font-size:20px;line-height:1.05}
.mb small{font-size:9.5px;color:var(--mute)}
.mb .dot{position:absolute;top:4px;right:4px;width:7px;height:7px;border-radius:50%;background:var(--blood);box-shadow:0 0 8px var(--blood)}
#bossBar,#gauge{position:absolute;top:calc(14px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);width:min(480px,calc(100vw - 32px));display:grid;gap:4px;text-align:center}
#bossBar .bn{font-family:var(--f-disp);font-size:20px;letter-spacing:.08em;text-shadow:0 0 14px rgba(255,60,80,.6)}
.bar.boss{height:12px}.bar.boss i{background:linear-gradient(90deg,#8d1022,#ff4a5e)}
#gauge span{font-size:11px;color:var(--mute);letter-spacing:.1em}
.bar.g{height:6px}.bar.g i{background:var(--gold)}
@media (max-width:1040px){#bossBar,#gauge{top:auto;bottom:calc(84px + env(safe-area-inset-bottom,0px));left:16px;right:86px;width:auto;transform:none}}
.skb{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));display:flex;gap:6px}
.sk{position:relative;width:54px;height:54px;border:1px solid var(--line);background:rgba(12,13,18,.82);display:grid;place-items:center;font-family:var(--f-disp);font-size:25px;color:var(--cc);border-radius:2px;overflow:hidden;padding:0}
.sk::after{content:'';position:absolute;inset:0;background:conic-gradient(rgba(5,5,8,.8) calc(var(--p,0)*360deg),transparent 0)}
.sk.ready{box-shadow:inset 0 0 14px -3px var(--cc);border-color:color-mix(in srgb,var(--cc) 60%,transparent)}
.sk .lv{position:absolute;right:3px;bottom:1px;font-size:9px;font-family:var(--f-num);color:var(--bone);z-index:2}
.sk.lock{color:#4a4740}
.sk.lock .lv{left:0;right:0;text-align:center;bottom:3px;color:var(--mute)}
.dash{position:absolute;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));width:74px;height:74px;border-radius:50%;border:1px solid var(--line);background:rgba(12,13,18,.85);display:grid;place-items:center;align-content:center;overflow:hidden}
.dash::after{content:'';position:absolute;inset:0;border-radius:50%;background:conic-gradient(rgba(5,5,8,.8) calc(var(--p,0)*360deg),transparent 0)}
.dash span{font-family:var(--f-disp);font-size:26px;color:var(--jade);line-height:1}
.dash small{font-size:10px;color:var(--mute)}
.talk{position:absolute;right:16px;bottom:calc(212px + env(safe-area-inset-bottom,0px));padding:10px 16px;background:var(--blood);color:#fff4ee;border-radius:2px;font-size:14px;box-shadow:0 6px 24px rgba(184,40,60,.4)}
.talk kbd{font-family:var(--f-num);font-size:11px;opacity:.8;margin-right:6px}
/* 회복약 · 표적 버튼 */
.pot{position:absolute;right:24px;bottom:calc(100px + env(safe-area-inset-bottom,0px));width:58px;height:58px;border-radius:50%;border:1px solid var(--line);background:radial-gradient(circle at 50% 60%,color-mix(in srgb,var(--pc,#555) 45%,#0c0d12),#0c0d12 70%);display:grid;place-items:center;align-content:center;overflow:hidden;padding:0}
.pot::after{content:'';position:absolute;inset:0;border-radius:50%;background:conic-gradient(rgba(5,5,8,.8) calc(var(--p,0)*360deg),transparent 0)}
.pot span{font-family:var(--f-num);font-size:18px;line-height:1;position:relative;z-index:1}.pot small{font-size:9px;color:#e8dccc;position:relative;z-index:1}
.pot.empty{opacity:.5}
.tgt{position:absolute;right:16px;bottom:calc(168px + env(safe-area-inset-bottom,0px));font-size:11px;padding:6px 10px;border:1px solid var(--line);background:rgba(12,13,18,.82);border-radius:14px;color:#cfc7b3}
.tgt.boss{border-color:#ff5a6a;color:#ffb0b8}
.cur .ces{color:#7ff7e4}
.cur em{font-family:var(--f-body)!important;font-size:10.5px;opacity:.85}
.sk.setk{box-shadow:inset 0 0 0 1px var(--cc),inset 0 0 18px -4px var(--cc)}
#toasts{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));display:grid;gap:4px;justify-items:center;width:min(420px,calc(100vw - 32px))}
.toast{background:rgba(10,10,14,.86);border:1px solid rgba(232,224,204,.12);padding:5px 12px;font-size:12.5px;border-radius:2px;animation:tin .2s ease-out;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.toast.out{opacity:0;transition:opacity .4s}
@keyframes tin{from{opacity:0;transform:translateY(6px)}}
#banner{position:absolute;left:0;right:0;top:24%;display:grid;justify-items:center;gap:4px;text-align:center;padding:0 16px}
#banner b{font-family:var(--f-disp);font-weight:400;font-size:clamp(28px,6vw,48px);letter-spacing:.12em;text-shadow:0 0 30px rgba(184,40,60,.7),0 2px 0 #000}
#banner span{font-size:14px;color:#d9d0bb;text-shadow:0 1px 3px #000}
#banner.show{animation:ban 2.6s ease forwards}
@keyframes ban{0%{opacity:0;transform:scale(1.06)}12%{opacity:1;transform:none}75%{opacity:1}100%{opacity:0}}
@media (max-width:640px){
  .skb{left:16px;transform:none;gap:5px}
  .sk{width:46px;height:46px;font-size:21px}
  .mb{width:44px;height:44px}.mb span{font-size:18px}
  #toasts{left:16px;transform:none;width:calc(100vw - 110px);justify-items:start;bottom:calc(76px + env(safe-area-inset-bottom,0px))}
  .tq b{font-size:13px}
}

/* modal sheet */
#modal{position:fixed;inset:0;background:rgba(4,4,7,.62);display:grid;place-items:center;padding:calc(16px + env(safe-area-inset-top,0px)) 16px calc(16px + env(safe-area-inset-bottom,0px));z-index:30}
/* 모바일 세로: 팝업 높이를 줄여 위쪽 닫기 버튼이 상태 표시줄·노치에 걸리지 않게 하고, 버튼을 크게 */
@media (max-width:640px) and (orientation:portrait){
  .sheet{max-height:calc(100vh - 200px)!important;max-height:calc(100dvh - 200px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px))!important}
  .sheet header{padding:10px 12px 10px 16px}
  .x{min-width:64px;min-height:44px;font-size:15px;padding:8px 14px}
}
.sheet{width:min(780px,100%);max-height:calc(100vh - 32px);max-height:calc(100dvh - 32px);display:flex;flex-direction:column;background:var(--sheet);border:1px solid var(--line);border-radius:2px;box-shadow:0 30px 80px rgba(0,0,0,.6);touch-action:pan-y}
.sheet header{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid var(--line);flex:none}
.sheet h3{font-family:var(--f-disp);font-weight:400;font-size:22px;margin:0;letter-spacing:.05em}
.sheet h3 small{font-family:var(--f-body);font-size:12px;color:var(--mute);margin-left:8px;letter-spacing:0}
.x{border:1px solid var(--line);padding:6px 12px;font-size:13px;border-radius:2px}
.mbody{overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;touch-action:pan-y;padding:14px 16px 18px;display:grid;gap:14px;align-content:start;min-height:0;flex:1 1 auto}
.mbody *{touch-action:pan-y}
.sec{font-size:11px;letter-spacing:.14em;color:var(--gold);margin:0}
.sb{border:1px solid var(--line);background:rgba(255,255,255,.03);padding:8px 12px;font-size:13px;border-radius:2px}

.pw{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}

.pw b{font-size:24px;color:var(--gold)}
.pw small{margin-left:auto;color:var(--mute);font-size:12px}
.eq{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(56px,1fr));gap:6px}
.cell{position:relative;aspect-ratio:1;max-width:100%;border:1px solid var(--gc,rgba(232,224,204,.15));background:linear-gradient(180deg,transparent,rgba(0,0,0,.45)),color-mix(in srgb,var(--gc,#333) 15%,#101218);display:grid;place-items:center;align-content:center;border-radius:2px;padding:0;min-width:0}
.cell.on{box-shadow:0 0 0 2px var(--bone)}
.cell .gl{font-family:var(--f-disp);font-size:22px;color:var(--gc);line-height:1}

.cell .enh{position:absolute;top:2px;left:3px;font-style:normal;font-size:10px;font-family:var(--f-num);color:var(--bone)}
.cell .lk{position:absolute;top:2px;right:3px;font-style:normal;font-size:10px;color:var(--gold);font-family:var(--f-disp)}
.cell .up{position:absolute;bottom:2px;right:3px;font-style:normal;font-size:10px;color:var(--pos)}
.cell.vac{border-style:dashed;background:rgba(0,0,0,.25)}
.cell.vac .gl{color:#4a4740}
.g7{animation:prim 2.4s linear infinite}

.cell.g5,.cell.g6,.cell.g7{box-shadow:inset 0 0 14px -4px var(--gc)}
.bulk{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.bulk select,.set select{background:#0f1016;color:var(--bone);border:1px solid var(--line);padding:7px 8px;font:inherit;font-size:13px;border-radius:2px}
.empty{color:var(--mute);font-size:13px;margin:6px 0;grid-column:1/-1}
.det{border:1px solid var(--gc);background:color-mix(in srgb,var(--gc) 6%,#0f1016);padding:12px;display:grid;gap:10px;border-radius:2px}
.dh{display:flex;gap:12px;align-items:center}
.dh .gl{font-family:var(--f-disp);font-size:30px;color:var(--gc);width:52px;height:52px;display:grid;place-items:center;border:1px solid var(--gc);flex:none}

.dh small{color:var(--mute);font-size:12px}
.pwr{font-size:13px;color:var(--mute);display:flex;gap:10px;align-items:baseline}
.pwr b{color:var(--bone);font-size:16px}
.pos{color:var(--pos)}.neg{color:var(--neg)}
table.st{border-collapse:collapse;width:100%;font-size:13px}
table.st th{text-align:left;font-weight:400;color:#cfc7b3;padding:4px 0}
table.st td{text-align:right;padding:4px 0 4px 10px}
table.st tr+tr{border-top:1px solid rgba(232,224,204,.07)}
.acts{display:flex;gap:6px;flex-wrap:wrap}
.statrow{display:grid;grid-template-columns:64px 1fr auto;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid rgba(232,224,204,.08)}
.statrow .k{font-family:var(--f-disp);font-size:28px;text-align:center;line-height:1}
.statrow .k small{display:block;font-family:var(--f-body);font-size:10px;color:var(--mute);letter-spacing:.08em;margin-top:4px}

.statrow .v p{margin:2px 0 0;font-size:12px;color:var(--mute);line-height:1.5}
.statrow .v .main{color:var(--gold);font-size:11px;margin-left:6px}
.statrow .b{display:flex;gap:4px}

.dl div{display:flex;justify-content:space-between;border-bottom:1px dotted rgba(232,224,204,.12);padding:4px 0}
.dl dt{color:#cfc7b3}
.skrow{display:grid;grid-template-columns:56px 1fr;gap:12px;padding:12px 0;border-bottom:1px solid rgba(232,224,204,.08);align-items:start}
.skrow .ic{width:56px;height:56px;display:grid;place-items:center;font-family:var(--f-disp);font-size:28px;color:var(--cc);border:1px solid color-mix(in srgb,var(--cc) 50%,transparent);background:color-mix(in srgb,var(--cc) 10%,#0f1016)}

.skrow h5{margin:0;font-family:var(--f-disp);font-weight:400;font-size:18px;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.skrow h5 small{font-family:var(--f-num);font-size:11px;color:var(--mute)}
.skrow p{margin:4px 0 8px;font-size:13px;color:#cfc7b3;line-height:1.55}
.mrow{display:grid;grid-template-columns:1fr auto;gap:12px;padding:12px 0;border-bottom:1px solid rgba(232,224,204,.08);align-items:center}
.mrow h5{margin:0;font-family:var(--f-disp);font-weight:400;font-size:19px;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.tag{font-family:var(--f-body);font-size:10px;letter-spacing:.1em;padding:2px 6px;border:1px solid var(--line);color:var(--gold)}
.tag.dg{color:#ff8f9d;border-color:rgba(255,100,120,.35)}
.tag.inf{color:#c79bff;border-color:rgba(199,155,255,.4)}
.mrow p{margin:4px 0 0;font-size:12.5px;color:#cfc7b3;line-height:1.55}
.mrow .meta{font-size:11px;color:var(--mute);margin-top:4px}
.set{display:grid;gap:4px}
.set label{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid rgba(232,224,204,.08);font-size:14px}
.set label small{display:block;color:var(--mute);font-size:12px;margin-top:2px}
.set input[type=checkbox]{width:20px;height:20px;accent-color:var(--blood)}
.gleg{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:12px}
.gleg span{display:flex;align-items:center;gap:5px}
.gleg i{width:10px;height:10px;display:inline-block;background:var(--gc)}

/* visual novel */
#vn{position:fixed;inset:0;z-index:40;display:flex;flex-direction:column;justify-content:flex-end;background:linear-gradient(180deg,rgba(0,0,0,.15),rgba(0,0,0,.72));cursor:pointer;overflow:hidden}
.por{position:absolute;bottom:0;height:min(80vh,660px);aspect-ratio:300/520;max-width:70vw;transition:filter .3s,transform .3s,opacity .3s;filter:drop-shadow(0 0 30px rgba(0,0,0,.8))}
.por svg,.por img{width:100%;height:100%;display:block}
.por img{object-fit:contain;object-position:50% 100%}
.por.L{left:max(-40px,calc(50% - 540px))}
.por.R{right:max(-40px,calc(50% - 540px))}
.por.dim{filter:brightness(.32) saturate(.5);transform:translateY(14px)}
.por:empty{opacity:0}
.box{position:relative;margin:0 auto calc(16px + env(safe-area-inset-bottom,0px));width:min(920px,calc(100% - 32px));background:linear-gradient(180deg,rgba(14,14,20,.95),rgba(8,8,12,.97));border:1px solid var(--line);border-top:2px solid var(--blood);padding:24px 22px 28px;min-height:140px;z-index:2}
.nm{position:absolute;top:-17px;left:18px;background:var(--blood);font-family:var(--f-disp);padding:4px 14px;font-size:16px;letter-spacing:.06em;color:#fff4ee}
.nm:empty{display:none}
#vnT{margin:0;font-size:17px;line-height:1.8;max-width:62ch;white-space:pre-wrap}
.box.narr #vnT{color:#c9c0aa;font-family:var(--f-disp);font-size:18px}
.nx{position:absolute;right:18px;bottom:10px;color:var(--gold);animation:blink 1s infinite;font-size:12px}
@keyframes blink{50%{opacity:.2}}
.skip{position:absolute;right:16px;top:calc(14px + env(safe-area-inset-top,0px));font-size:12px;background:rgba(0,0,0,.55);border:1px solid var(--line);padding:6px 12px;z-index:3;border-radius:2px}
@media (max-width:640px){.por{height:58vh}#vnT{font-size:15.5px}.box{padding:22px 16px 26px}}

#death{position:fixed;inset:0;display:grid;place-content:center;gap:8px;text-align:center;background:radial-gradient(circle,rgba(60,0,10,.35),rgba(0,0,0,.85));z-index:25;padding:16px}
#death b{font-family:var(--f-disp);font-weight:400;font-size:clamp(34px,8vw,56px);color:#ff5a6a;letter-spacing:.14em}
#death span{color:var(--mute)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

let UID=1;const newId=()=>Date.now().toString(36)+(UID++).toString(36)+Math.floor(Math.random()*1e4).toString(36);
function statBase(k,L){const s=Math.pow(1.085,L);switch(k){case'atk':return 8*s;case'hp':return 40*s;case'armor':return 6*s;case'regen':return .8*s;case'crit':return 2.2;case'critd':return 10;default:return 2+L*.6}}
function rollStat(k,L,g){const m=GRADES[g].m;let v;if(k==='crit')v=statBase(k,L)*Math.sqrt(m);else if(k==='critd')v=statBase(k,L)*Math.pow(m,.7);else v=statBase(k,L)*m;return v*rnd(.85,1.15)}
function itemName(slot,g,cls){const b=slot==='weapon'?BASEN.weapon[cls]:BASEN[slot];return `${ADJ[g]} ${pick(FLAV)}의 ${pick(b)}`}
/* setCls: undefined면 에픽 이상에서 35% 확률로 세트 옵션(대개 현재 직업), null이면 없음, 직업 id면 그 세트 */
function makeItem(slot,g,L,cls,setCls){
  cls=cls||pl.cls;const main=CLS[cls].main,def=SLOTDEF[slot],st={};
  const add=(k,f)=>{const key=k==='main'?main:k;st[key]=(st[key]||0)+rollStat(k,L,g)*f};
  def.pri.forEach(k=>add(k,1));
  const ex=[0,1,1,2,2,3,3,4][g];for(let i=0;i<ex;i++)add(pick(def.pool),.6);
  for(const k in st)st[k]=(k==='crit'||k==='critd'||k==='regen')?Math.round(st[k]*10)/10:Math.max(1,Math.round(st[k]));
  let set=null;if(setCls)set=setCls;else if(setCls===undefined&&g>=6&&Math.random()<.35)set=Math.random()<.75?cls:pick(Object.keys(CLS));
  return {id:newId(),slot,g,ilv:L,name:(set?`[${SETN[set]}] `:'')+itemName(slot,g,cls),st,enh:0,lock:false,set};
}
function eff(it){const m=1+.1*it.enh,o={};for(const k in it.st)o[k]=it.st[k]*m;return o}
function power(it){if(!it)return 0;const e=eff(it),L=pl.lv,main=CLS[pl.cls].main;let p=0;
  for(const k in e){let ref,w;if(k==='str'||k==='agi'||k==='int'){ref=statBase('main',L);w=k===main?1.4:.25}else{ref=statBase(k,L);w={atk:1.6,hp:1,armor:.9,regen:.6,crit:1.1,critd:.9}[k]}p+=e[k]/ref*w}
  if(it.set&&it.set===pl.cls)p*=1.3;
  return p*100}
function rollGrade(bonus,maxG){if(maxG===undefined)maxG=7;const w=GW.map((v,i)=>i>maxG?0:v*Math.pow(1+bonus,i));let s=w.reduce((a,b)=>a+b,0),r=Math.random()*s;for(let i=0;i<w.length;i++){r-=w[i];if(r<=0)return i}return 0}
const isEq=it=>pl.gear[it.slot]===it;
const isUpgrade=it=>power(it)>power(pl.gear[it.slot])+.01;
function findItem(id){for(const s of SLOTS)if(pl.gear[s]&&pl.gear[s].id===id)return pl.gear[s];return pl.inv.find(i=>i.id===id)||ROOT.stash.find(i=>i.id===id)}
function equipItem(it){const old=pl.gear[it.slot];const ix=pl.inv.indexOf(it);if(ix>=0)pl.inv.splice(ix,1);pl.gear[it.slot]=it;if(old)pl.inv.unshift(old);recalc()}
function unequip(it){if(pl.inv.length>=INVCAP){toast('가방이 가득 찼다');return}pl.gear[it.slot]=null;pl.inv.unshift(it);recalc()}

function disYield(it){return {stone:DIS_ST[it.g]+Math.floor(it.ilv/10)+it.enh*2,soul:it.g>=4?it.g-3:0,gold:5*(it.g+1)+it.ilv}}
function dismantle(it){const y=disYield(it);const ix=pl.inv.indexOf(it);if(ix>=0)pl.inv.splice(ix,1);pl.stone+=y.stone;pl.soul+=y.soul;pl.gold+=y.gold;if(pl.st)pl.st.dis++;return y}
function enhCost(it){return {stone:Math.ceil((it.enh+1)*(1+it.g*.6)*2),gold:Math.floor(40*(it.enh+1)*(1+it.ilv*.15)),rate:Math.max(.25,1-it.enh*.05)}}
function canEnh(it){const c=enhCost(it);return it.enh<30&&pl.stone>=c.stone&&pl.gold>=c.gold}
function autoEquipAll(){let n=0;for(const s of SLOTS){let best=pl.gear[s],bp=power(best);for(const it of pl.inv){if(it.slot===s&&power(it)>bp+.01){best=it;bp=power(it)}}if(best&&best!==pl.gear[s]){equipItem(best);n++}}return n}

/* pure: derived combat stats from level, allocated stats and a list of effective-stat objects */
function derive(lv,stats,effs,cls){
  const g={atk:0,hp:0,armor:0,regen:0,crit:0,critd:0,str:0,agi:0,int:0};
  for(const e of effs)for(const k in e)g[k]+=e[k];
  const c=CLS[cls],str=stats.str+g.str,agi=stats.agi+g.agi,int=stats.int+g.int,main={str,agi,int}[c.main];
  const d={str,agi,int,main,g};
  d.atk=(5+lv*1.5+g.atk)*(1+main*.025)*c.dm;
  d.mhp=(100+lv*12+g.hp+str*6)*c.hpm;
  d.armor=(g.armor+str*.5)*c.arm;
  d.dr=Math.min(.75,d.armor/(d.armor+40+lv*8));
  d.regen=(1+g.regen)*(c.id==='healer'?1.15:1);
  d.crit=Math.min(75,5+g.crit+agi*.08);
  d.critd=150+g.critd;
  d.spd=230*(1+Math.min(.4,agi*.002));
  d.cdr=Math.min(.3,int*.0015);
  return d}
function recalc(){
  const ratio=pl.d&&pl.d.mhp?pl.hp/pl.d.mhp:1;
  const d=derive(pl.lv,pl.stats,SLOTS.filter(s=>pl.gear[s]).map(s=>eff(pl.gear[s])),pl.cls);
  const sc=setCount();if(sc>=2)d.atk*=1.08;if(sc>=4)d.critd+=25;d.setN=sc;
  pl.d=d;pl.hp=Math.min(d.mhp,Math.max(1,ratio*d.mhp));
  if(pl.st)pl.st.maxEnh=Math.max(pl.st.maxEnh,...SLOTS.map(s=>pl.gear[s]?pl.gear[s].enh:0),...pl.inv.map(i=>i.enh));
}
/* 전투력: 치명타 기대값을 반영한 공격력 × 방어를 반영한 유효 체력의 기하평균. 기술 강화 수준도 곱한다 */
function cpOf(d,skMul){const atkE=d.atk*(1+(d.crit/100)*(d.critd/100-1))*(skMul||1);const ehp=d.mhp/(1-d.dr);return Math.round(Math.sqrt(atkE*ehp)*4)}
function myCP(){const un=SK[pl.cls].map((s,i)=>pl.lv>=UNL[i]?1+.12*(pl.skl[i]-1):null).filter(x=>x!==null);const sm=un.reduce((a,b)=>a+b,0)/Math.max(1,un.length);return cpOf(pl.d,sm)}
/* 기준 캐릭터: 해당 레벨, 주스탯 몰빵, 전 부위 같은 등급(+0) 평균 옵션 */
function refEff(slot,g,L,cls){const main=CLS[cls].main,def=SLOTDEF[slot],o={};const add=(k,f)=>{const key=k==='main'?main:k;let v=statBase(k,L);const m=GRADES[g].m;v*=k==='crit'?Math.sqrt(m):k==='critd'?Math.pow(m,.7):m;o[key]=(o[key]||0)+v*f};
  def.pri.forEach(k=>add(k,1));const ex=[0,1,1,2,2,3,3,4][g];def.pool.forEach(k=>add(k,.6*ex/def.pool.length));return o}
function refCP(L,g,cls){cls=cls||pl.cls;const st={str:2,agi:2,int:2};st[CLS[cls].main]+=5+3*(L-1);return cpOf(derive(L,st,SLOTS.map(s=>refEff(s,g,L,cls)),cls),1)}
function mobLvOf(id){const M=MAPS[id];if(M.safe)return 0;const tier=M.endless?pl.abyss+1:0;return Math.max(1,pl.lv+M.off+(M.endless?Math.floor(tier/3):0))}
function recCP(id){const M=MAPS[id];if(M.safe)return 0;let k=M.diff;if(M.endless)k*=Math.pow(1.125,pl.abyss+1);return Math.round(refCP(mobLvOf(id),2)*k)}

function nearest(x,y,range){const bf=bossFirst(x,y,range);if(bf)return bf;let b=null,bd=range*range;for(const e of G.ents){if(e.dead)continue;const d=(e.x-x)**2+(e.y-y)**2;if(d<bd){bd=d;b=e}}return b}
function nearestN(x,y,range,k){const bf=bossFirst(x,y,range);return G.ents.filter(e=>!e.dead&&(e.x-x)**2+(e.y-y)**2<range*range).sort((a,b)=>(a===bf?-1:b===bf?1:0)||((a.x-x)**2+(a.y-y)**2)-((b.x-x)**2+(b.y-y)**2)).slice(0,k)}
function densest(range,rad){const bf=bossFirst(pl.x,pl.y,range);if(bf)return bf;let best=null,bn=0;for(const e of G.ents){if(e.dead)continue;if((e.x-pl.x)**2+(e.y-pl.y)**2>range*range)continue;let n=e.boss?3:1;for(const o of G.ents)if(o!==e&&!o.dead&&(o.x-e.x)**2+(o.y-e.y)**2<rad*rad)n++;if(n>bn){bn=n;best=e}}return best}

function setCount(cls){return SLOTS.filter(sl=>pl.gear[sl]&&pl.gear[sl].set===(cls||pl.cls)).length}
function skillDef(i){return i===4&&setCount()>=6?SETSK[pl.cls]:SK[pl.cls][i]}
function cdOf(i){const lv=pl.skl[i];return skillDef(i).cd*(1-pl.d.cdr)*(1-Math.min(.3,.015*(lv-1)))*(i===0&&pl.buffs.blade>0?.3:1)}
const skCost=lv=>({soul:lv*2,gold:80*lv*lv});

/* ================= combat ================= */
function hit(e,dmg,o,sx,sy){if(e.dead)return;o=o||{};const cr=pl.buffs.blade>0||Math.random()*100<pl.d.crit;const d=dmg*(cr?pl.d.critd/100:1)*rnd(.92,1.08);
  e.hp-=d;e.flash=.08;
  if(o.kb&&!e.boss){const a=Math.atan2(e.y-(sy??pl.y),e.x-(sx??pl.x));e.kbx+=Math.cos(a)*o.kb;e.kby+=Math.sin(a)*o.kb}
  if(o.slow)e.slow=Math.max(e.slow,o.slow);
  if(o.stun&&!e.boss)e.stun=Math.max(e.stun,o.stun);
  if(pl.set.dmgNum)addText(e.x+rnd(-10,10),e.y-e.r-8,fmt(d),cr?'#ffd34d':'#f1ead8',cr?17:12,cr);
  if(cr)burst(e.x,e.y,'#ffd34d',4,160,2);
  if(e.hp<=0)killEnemy(e)}
function hitCircle(x,y,r,dmg,o){let n=0;for(const e of G.ents){if(e.dead)continue;if((e.x-x)**2+(e.y-y)**2<(r+e.r)**2){hit(e,dmg,o,x,y);n++}}return n}
function hitArc(x,y,a,r,w,dmg,o){for(const e of G.ents){if(e.dead)continue;const dx=e.x-x,dy=e.y-y,d=Math.hypot(dx,dy);if(d>r+e.r)continue;let da=Math.atan2(dy,dx)-a;da=Math.atan2(Math.sin(da),Math.cos(da));if(Math.abs(da)<=w/2||d<e.r+12)hit(e,dmg,o,x,y)}}
function addZone(z){z.ml=z.l;z.tt=0;if(z.follow){z.x=pl.x;z.y=pl.y}G.zones.push(z)}
function later(t,fn){G.timers.push({t,fn})}
function healPlayer(a){const before=pl.hp;pl.hp=Math.min(pl.d.mhp,pl.hp+a);const got=pl.hp-before;if(got>=1)addText(pl.x,pl.y-36,'+'+fmt(got),'#7fe8b4',13)}
function hurtPlayer(d){if(G.dead>0||pl.iframe>0||pl.dash>0)return;let dd=d*(1-pl.d.dr)*(pl.buffs.iron>0?.6:1);
  if(pl.shield>0){const a=Math.min(pl.shield,dd);pl.shield-=a;dd-=a}
  pl.hp-=dd;pl.flash=.15;pl.iframe=.12;if(dd>0)addText(pl.x+rnd(-8,8),pl.y-34,'-'+fmt(dd),'#ff5a6a',14);shake(3);if(pl.hp<=0)die()}
/* v3 사망 패널티: 현재 보유 경험치의 50%를 잃는다 */
function die(){if(pl.god){pl.hp=pl.d.mhp;return}pl.hp=0;pl.st.deaths++;const lost=Math.floor(pl.exp*.5);pl.exp-=lost;pl.chan=null;G.dead=2.8;G.teles=[];G.eprojs=[];
  $('#deathT').textContent=lost>0?`경험치 ${fmt(lost)}을 잃었다 (보유 경험치의 50%)`:'청등마을의 푸른 등불 곁에서 다시 깨어난다…';$('#death').hidden=false;burst(pl.x,pl.y,'#5ed4b9',50,300,4)}
/* 회복약: 최대 10개 소지, 공용 재사용 10초 */
const POT=[{n:'하급 회복약',p:.2,c:'#e8a0a8',price:L=>60+L*8},{n:'중급 회복약',p:.35,c:'#ff6b7d',price:L=>180+L*20},{n:'상급 회복약',p:.5,c:'#ff3e5d',price:L=>450+L*45},{n:'최상급 회복약',p:.7,c:'#c9283f',price:L=>1200+L*100}];
const POT_MAX=10,POT_CD=10;
const potTotal=()=>pl.pots.reduce((a,b)=>a+b,0);
function bestPot(){for(let i=3;i>=0;i--)if(pl.pots[i]>0)return i;return -1}
function usePot(){if(G.scene!=='play'||G.dead>0||G.modal||G.vn)return;const i=bestPot();
  if(i<0){toast('회복약이 없다 · 잡화점에서 산다');return}
  if(pl.potCd>0){toast(`회복약 재사용까지 ${Math.ceil(pl.potCd)}초`);return}
  if(pl.hp>=pl.d.mhp){toast('체력이 가득 차 있다');return}
  pl.pots[i]--;pl.potCd=POT_CD;healPlayer(pl.d.mhp*POT[i].p);fxPillar(pl.x,pl.y,36,POT[i].c,.5);burst(pl.x,pl.y-20,POT[i].c,20,160,3)}
function respawn(){$('#death').hidden=true;pl.buffs={};pl.shield=0;travel('village');pl.hp=pl.d.mhp}

function spawnPos(minD,maxD){for(let k=0;k<8;k++){const a=rnd(0,TAU),d=rnd(minD,maxD);const [x,y]=inBounds(pl.x+Math.cos(a)*d,pl.y+Math.sin(a)*d,20);if(Math.hypot(x-pl.x,y-pl.y)>minD*.7)return[x,y]}const b=mbound(MAPS[G.map]);return[pl.x>(b.x0+b.x1)/2?b.x0+40:b.x1-40,clamp(pl.y,b.y0+40,b.y1-40)]}

function killEnemy(e){
  if(e.dead)return;e.dead=true;const M=MAPS[G.map];

  if(e.boss||Math.random()<(e.elite?.3:.03)*ex)dropCur(e.x+rnd(-20,20),e.y+rnd(-20,20),'soul',(e.boss?3+Math.floor(curTier()/2):1)*ex);

  if(e.boss){for(let i=0;i<(M.end?5:3);i++)dropItem(e.x,e.y,(M.end?1.3:.9)+tb,3,ib+1,7)}

  else if(Math.random()<(M.end?.35:M.dg?.2:.16)*dropMul())dropItem(e.x,e.y,(M.dg?.1:0)+tb,0,ib,MOB_MAXG);

  if(M.dg&&!e.boss&&!G.boss){G.gauge++;if(G.gauge>=GAUGE)spawnBoss()}
  if(e.boss)bossDefeated(e)}
function bossDefeated(e){

function dropItem(x,y,bonus,minG,ilvB,maxG){const g=Math.max(minG||0,rollGrade(bonus,maxG));const M=MAPS[G.map];const slot=(M.favor&&Math.random()<.55)?pick(M.favor):pick(SLOTS);

function dropCur(x,y,kind,amt){G.drops.push({x:x+rnd(-14,14),y:y+rnd(-14,14),kind,amt,t:0})}
function eshot(x,y,a,sp,r,dmg,c){G.eprojs.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,r,dmg,c,l:3.2})}
function tele(t){t.t=0;G.teles.push(t)}
function shout(e,txt){addText(e.x,e.y-e.r-30,txt,'#ffd6dc',16,true,1.6)}

   case 'radial':{fxRing(e.x,e.y,e.r,e.r+60,'#ff5a6a',.5,4);for(let w=0;w<2+ph+fu;w++)later(.45+w*.45,()=>{if(e.dead)return;const n=20+ph*6,off=rnd(0,TAU);for(let i=0;i<n;i++)eshot(e.x,e.y,off+i/n*TAU,240+w*20,9,D*1.5,B.c)});e.cast=1.4;break}
   case 'donut':{const inner=Math.random()<.5,R=190;tele({k:'d',x:e.x,y:e.y,r1:inner?0:R,r2:inner?R:2400,dur:1.6,dmg:D*4.5});shout(e,inner?'물러나라!':'가까이 오라…');
     if(ph)later(1.7,()=>{if(e.dead)return;tele({k:'d',x:e.x,y:e.y,r1:inner?R:0,r2:inner?2400:R,dur:1.1,dmg:D*4.5});shout(e,'반대로!')});e.cast=ph?3:1.8;break}
   case 'summon':{const M=MAPS[G.map];for(let i=0;i<3+ph+fu*2;i++){const a=i/(3+ph+fu*2)*TAU;const [sx,sy]=inBounds(e.x+Math.cos(a)*90,e.y+Math.sin(a)*90,20);const m=spawnMob(pick(M.mobs),sx,sy);m.dmg*=1.3}shout(e,'일어나라.');e.cast=.8;break}

   case 'pool':{for(let i=0;i<4+ph;i++){const x=pl.x+rnd(-150,150),y=pl.y+rnd(-150,150);tele({k:'c',x,y,r:95,dur:.85,dmg:D*1.4,fn:()=>addZone({x,y,r:95,l:6,tick:.45,dmg:D*.5,c:'#8fcf3a',kind:'pool',enemy:1})})}e.cast=1;break}
   /* v3 신규: 소용돌이 탄막 — 회전 방향을 읽고 빈틈으로 */
   case 'spiral':{const arms=2+ph+fu,base=rnd(0,TAU),dir=Math.random()<.5?1:-1;shout(e,'춤추어라…');for(let k=0;k<22;k++)later(.3+k*.11,()=>{if(e.dead)return;for(let j=0;j<arms;j++)eshot(e.x,e.y,base+dir*k*.3+j*TAU/arms,210,10,D*1.4,B.c)});e.cast=2.8;break}
   /* 십자 베기: 보스를 지나는 4줄, 이어서 45도 돌려 한 번 더 */

   case 'chase':{const n=6+ph*2+fu*2;for(let k=0;k<n;k++)later(k*.3,()=>{if(!e.dead)tele({k:'c',x:pl.x,y:pl.y,r:88,dur:.75,dmg:D*2.8})});e.cast=.6+n*.3;break}
   /* 안전지대: 화면 전체 공격, 표시된 원 안에만 피할 수 있다 */
   case 'safe':{const n=Math.max(1,3-ph-fu),zs=[];for(let k=0;k<n;k++){const a=rnd(0,TAU),r=rnd(140,300);const [x,y]=inBounds(pl.x+Math.cos(a)*r,pl.y+Math.sin(a)*r,80);zs.push({x,y,r:78})}tele({k:'s',x:e.x,y:e.y,zs,dur:2.3,dmg:D*6});shout(e,'숨을 곳을 찾아라.');banner('피할 곳으로!','초록 원 안으로 들어가라');e.cast=2.4;break}

  }}
function bossUpd(e,dt){

    if(!e.dashHit&&Math.hypot(pl.x-e.x,pl.y-e.y)<e.r+pl.r){e.dashHit=true;hurtPlayer(e.dmg*4)}return}
  const dx=pl.x-e.x,dy=pl.y-e.y,d=Math.hypot(dx,dy)||1;e.face=dx<0?-1:1;
  if(e.cast>0)e.cast-=dt;else if(d>e.r+40){const sp=e.spd*(e.slow>0?.6:1)*(e.enr?1.3:1)*(e.fury?1.2:1);e.x+=dx/d*sp*dt;e.y+=dy/d*sp*dt;e.walkT+=sp*dt/30}

  if(e.pt<=0){let p;do{p=pick(B.pats)}while(p===e.last&&B.pats.length>1);e.last=p;e.atkA=.55;doPattern(e,p);
    if(e.fury&&p!=='safe'&&Math.random()<.5)later(.5,()=>{if(!e.dead)doPattern(e,'circles')});
    e.pt=e.fury?1.4:e.enr?1.8:2.6}
  if(!e.enr&&e.hp<e.mhp*.5){e.enr=true;banner('격노',`${e.n} · 패턴이 빨라지고 겹친다`);fxRing(e.x,e.y,10,300,'#ff3e5d',.8,10);shake(10)}
  if(!e.fury&&e.hp<e.mhp*.2){e.fury=true;banner('광폭',`${e.n} · 마지막 발악`);fxRing(e.x,e.y,10,420,'#ff0030',1,14);shake(16)}}

/* ================= quests ================= */
function qCur(){return MAINQ[pl.q]}
function reward(r){pl.gold+=r.gold||0;if(r.gold)pl.st.gold+=r.gold;pl.stone+=r.stone||0;pl.soul+=r.soul||0;if(r.exp)gainExp(r.exp)}
const qLvOk=q=>!q.lv||pl.lv>=q.lv;
const QNPC={seol:'무녀 설화',smith:'대장장이 강쇠',merch:'떠돌이 상인 묘'};
const QNPCMAP={seol:'village',smith:'village',merch:'shop'};
function qDone(q){switch(q.type){
  case'lv':return pl.lv>=q.lv;case'enh':return pl.st.maxEnh>=q.n;case'abyss':return pl.abyss>=q.n;
  case'kill':case'elite':case'collect':case'bossAny':return pl.qk>=q.n;default:return false}}
function qEvent(type,data){const q=qCur();if(!q||G.qBusy||q.type==='endless')return;data=data||{};
  if(type==='kill'&&data.map===q.map){
    if(q.type==='kill'&&pl.qk<q.n)pl.qk++;
    else if(q.type==='elite'&&data.elite&&pl.qk<q.n)pl.qk++;
    else if(q.type==='collect'&&pl.qk<q.n&&Math.random()<q.p*(data.elite?3:1)){pl.qk++;addText(pl.x,pl.y-80,`+1 ${q.item} (${pl.qk}/${q.n})`,'#f3cf45',13,true)}}
  if(type==='boss'){if(q.type==='bossAny'&&pl.qk<q.n)pl.qk++;if(q.type==='boss'&&data.boss===q.boss)pl.qk=1}
  if(type==='talk'&&q.type==='talk'&&data.npc===q.npc){if(qLvOk(q))qComplete();else toast(`레벨 ${q.lv}이 되면 다시 오자`);return}
  if(q.type==='boss'?pl.qk>=1&&qLvOk(q):qDone(q)&&qLvOk(q))qComplete()}
function qComplete(){const q=qCur(),i=pl.q;G.qBusy=true;
  const big=q.type==='boss'||q.type==='abyss',r={exp:Math.floor(need(pl.lv)*(big?.5:q.type==='talk'?.15:.3)),gold:Math.floor((120+pl.lv*30)*(big?3:1)),stone:8+i*2+(big?20:0),soul:1+Math.floor(i/3)+(big?3:0)};
  const after=()=>{G.qBusy=false;reward(r);if(q.type==='boss'){const it=makeItem(pick(SLOTS),Math.max(3,rollGrade(1,SHOP_MAXG)),pl.lv);collect({it})}
    toast(`<b style="color:#c8a259">임무 완료 · ${q.t}</b> · 금화 ${fmt(r.gold)} · 강화석 ${r.stone} · 혼석 ${r.soul}`);
    pl.q=Math.min(pl.q+1,MAINQ.length-1);pl.qk=0;const n=qCur();later(.6,()=>banner('새 임무',n.t));save();later(.2,()=>qEvent('check'))};
  if(q.end)vn(q.end(),after);else after()}
function qMap(q){if(q.type==='talk')return QNPCMAP[q.npc];if(q.type==='abyss'||q.type==='endless')return'abyss';if(q.type==='enh')return'village';return q.map||null}
function qProg(q){const need=q.lv&&pl.lv<q.lv&&q.type!=='lv'?` · <span class="neg">Lv.${q.lv} 필요</span>`:'';switch(q.type){
  case'talk':return `${QNPC[q.npc]}와 대화${need}`;
  case'kill':return `${MAPS[q.map].n} · 적 ${Math.min(pl.qk,q.n)}/${q.n}${need}`;
  case'elite':return `${MAPS[q.map].n} · 정예 ${Math.min(pl.qk,q.n)}/${q.n}${need}`;
  case'collect':return `${MAPS[q.map].n} · ${q.item} ${Math.min(pl.qk,q.n)}/${q.n}${need}`;
  case'boss':return `${MAPS[q.map].n} · ${BOSSES[q.boss].n} 처치${pl.qk?' ✓':''}${need}`;
  case'bossAny':return `아무 보스 ${Math.min(pl.qk,q.n)}/${q.n}회 처치${need}`;
  case'lv':return `레벨 ${q.lv} 달성 (현재 ${pl.lv})`;
  case'enh':return `장비 하나를 +${q.n}까지 강화 (최고 +${pl.st.maxEnh})${need}`;
  case'abyss':return `무한 심연 ${Math.min(pl.abyss,q.n)}/${q.n}단계 돌파${need}`;
  default:return `무한 심연 최고 ${pl.abyss}단계`}}
function makeOffers(){const maps=['field','fox','river','swamp','palace','abyss'].concat(pl.lv>=100?['gate']:[]);const o=[];for(let i=0;i<3;i++){const m=pick(maps),dg=MAPS[m].dg?1:0,n=ri(15,30);o.push({map:m,n,k:0,rw:{gold:60+pl.lv*15+n*4,stone:6+pl.lv+dg*4,soul:ri(1,2)+dg,exp:Math.floor(need(pl.lv)*.25)}})}return o}

function buildMap(id){
  const M=MAPS[id],R=seeded(hash(id)),b=mbound(M),D=[];
  const put=(t,n)=>{for(let i=0;i<n;i++){const x=b.x0+R()*(b.x1-b.x0),y=b.y0+R()*(b.y1-b.y0);if(Math.hypot(x-M.w/2,y-M.h/2)<180)continue;D.push({t,x,y,s:.7+R()*.6,r:R()})}};
  G.npcs=[];
  (BGLAMPS[M.bg]||[]).forEach(([fx,fy])=>D.push({t:'lamp',x:fx*M.w,y:fy*M.h+30,s:1,r:R()}));
  if(id==='village'){
    G.npcs=[
      {npc:1,id:'seol',x:.505*M.w,y:.47*M.h,n:'무녀 설화',ch:'seol',spr:'seol'},
      {npc:1,id:'smith',x:.15*M.w,y:.5*M.h,n:'대장장이 강쇠',ch:'smith',spr:'smith'},
      {npc:1,id:'door',x:.93*M.w,y:.47*M.h,n:'묘의 잡화점',obj:'door'},
      {npc:1,id:'board',x:.8*M.w,y:.5*M.h,n:'의뢰 게시판',obj:'board'},
      {npc:1,id:'gate',x:.575*M.w,y:.74*M.h,n:'산길 다리',obj:'gate'}];
  }
  else if(id==='shop'){
    G.npcs=[{npc:1,id:'merch',x:.62*M.w,y:.55*M.h,n:'떠돌이 상인 묘',ch:'merch',spr:'npc'},
      {npc:1,id:'exit',x:.11*M.w,y:.5*M.h,n:'마을로 나가기',obj:'door'}];
  }
  else if(id==='field'){put('grass',60);put('grave',6);put('candle',8)}
  else if(id==='fox'){put('candle',20);put('bone',18);put('torii',2)}
  else if(id==='river'){put('water',8);put('reed',30);put('bluec',14)}
  else if(id==='swamp'){put('pool',12);put('reed',40);put('greenc',10)}
  else if(id==='palace'){put('redl',14);put('pillar',8);put('tilef',10)}
  else if(id==='abyss'){put('crystal',20);put('eye',8)}
  else if(id==='gate'){put('eye',12);put('redl',10);put('bone',20);put('torii',3)}

  G.decor=D;G.lights=D.filter(d=>LIGHT[d.t]);
  const pc=document.createElement('canvas');pc.width=pc.height=256;const p=pc.getContext('2d');p.fillStyle=M.ground;p.fillRect(0,0,256,256);
  for(let i=0;i<900;i++){p.fillStyle=`rgba(${R()<.5?'255,255,255':'0,0,0'},${(R()*.06).toFixed(3)})`;p.fillRect(R()*256,R()*256,R()*3+1,R()*3+1)}
  G.pat=cx.createPattern(pc,'repeat');
}
function travel(id,at){
  const M=MAPS[id];
  if(M.req&&pl.lv<M.req){toast(`<b style="color:#ff8f9d">${M.n}</b>은 레벨 ${M.req} 이상만 들어갈 수 있다 (현재 ${pl.lv})`);return false}
  G.map=id;pl.map=id;
  G.ents=[];G.projs=[];G.eprojs=[];G.zones=[];G.teles=[];G.drops=[];G.fx=[];G.parts=[];G.timers=[];G.texts=[];G.corpses=[];G.boss=null;G.gauge=0;G.target=null;pl.trail=[];pl.chan=null;G.pet=null;
  buildMap(id);
  if(at){pl.x=at[0]*M.w;pl.y=at[1]*M.h}
  else if(id==='village'){pl.x=.5*M.w;pl.y=.62*M.h}
  else if(id==='shop'){pl.x=.2*M.w;pl.y=.55*M.h}
  else{pl.x=M.w/2;pl.y=M.h/2}
  G.cam.x=pl.x-VW/ZOOM/2;G.cam.y=pl.y-VH/ZOOM/2;G.spawnT=.8;
  if(M.end)pl.st.gate++;
  const rc=recCP(id),my=myCP();
  banner(M.n,M.endless?`${pl.abyss+1}단계 · 권장 전투력 ${fmt(rc)}`:M.dg?`보스 · ${M.boss?BOSSES[M.boss].n:'무작위'} · 권장 전투력 ${fmt(rc)}`:M.safe?M.kind:`권장 전투력 ${fmt(rc)}`);
  if(rc&&my<rc*.8)later(1.2,()=>toast(`<b style="color:#ff8f9d">전투력이 권장치보다 낮다</b> · ${fmt(my)} / ${fmt(rc)}`));
  save();return true}

  if(d.kind){pl[d.kind]+=d.amt;if(d.kind==='gold')pl.st.gold+=d.amt;if(d.kind!=='gold')addText(pl.x,pl.y-40,`+${d.amt} ${CUR[d.kind]}`,CURC[d.kind],12);if(d.kind==='ess')toast(`<b style="color:#7ff7e4">동반자 정수</b> ${d.amt}개 획득 · 동반자 강화에 쓴다`);return}
  pl.st.gotG=Math.max(pl.st.gotG,d.it.g);
  const it=d.it,g=GRADES[it.g],nm=`<b style="color:${g.c}">[${g.n}] ${esc(it.name)}</b>`;
  if(pl.set.autoEquip&&isUpgrade(it)){equipItem(it);toast(`${nm} 자동 착용 ▲`);addText(pl.x,pl.y-48,'장비 강화!','#7fd88f',14,true);return}
  if(it.g<=pl.set.autoDis&&!it.set){const y=dismantle(it);addText(pl.x,pl.y-40,`해체 · 강화석 +${y.stone}`,'#9fc3e8',11);return}
  if(pl.inv.length>=INVCAP){const y=dismantle(it);toast(`가방이 가득 차 ${nm} 해체 · 강화석 ${y.stone}`);return}
  pl.inv.push(it);toast(`획득 ${nm}${isUpgrade(it)?' <span class="pos">▲</span>':''}`)}

function moveVec(){let x=0,y=0;const k=G.keys;if(k.KeyW||k.ArrowUp)y--;if(k.KeyS||k.ArrowDown)y++;if(k.KeyA||k.ArrowLeft)x--;if(k.KeyD||k.ArrowRight)x++;
  if(x||y){const l=Math.hypot(x,y);return{x:x/l,y:y/l,s:1,src:'k'}}
  if(G.joy){const jx=G.joy.x-G.joy.ox,jy=G.joy.y-G.joy.oy,l=Math.hypot(jx,jy);if(l>8)return{x:jx/l,y:jy/l,s:Math.min(1,l/50),src:'j'}}
  return{x:0,y:0,s:0}}
function dash(){if(G.scene!=='play'||G.dead>0||pl.dashCd>0||pl.dash>0||G.modal||G.vn)return;let a=pl.face;const mv=moveVec();
  if(mv.x||mv.y)a=Math.atan2(mv.y,mv.x);else if(G.target)a=Math.atan2(G.target.y-pl.y,G.target.x-pl.x);
  pl.st.dash++;pl.dash=.18;pl.dvx=Math.cos(a)*950;pl.dvy=Math.sin(a)*950;pl.dashCdMax=Math.max(1.2,2.4*(1-Math.min(.35,pl.d.agi*.002)));pl.dashCd=pl.dashCdMax;pl.iframe=.25;pl.face=a;
  burst(pl.x,pl.y,CLS[pl.cls].col,12,180);G.target=null}

/* ================= update ================= */
function update(dt){
  G.t+=dt;
  if(G.dead>0){G.dead-=dt;updParts(dt);updFx(dt);if(G.dead<=0)respawn();return}
  for(let i=G.timers.length-1;i>=0;i--){const t=G.timers[i];t.t-=dt;if(t.t<=0){G.timers.splice(i,1);t.fn()}}
  updPlayer(dt);updChannel(dt);updSkills(dt);updPet(dt);spawnLogic(dt);
  pl.potCd=Math.max(0,pl.potCd-dt);if(pl.set.autoPot&&!MAPS[G.map].safe&&pl.hp<pl.d.mhp*.3&&pl.potCd<=0&&bestPot()>=0)usePot();updEnemies(dt);updProjs(dt);updEProjs(dt);updZones(dt);updTeles(dt);updDrops(dt);updFx(dt);updParts(dt);ambient(dt);
  for(const t of G.texts){t.l-=dt;t.y-=dt*34}G.texts=G.texts.filter(t=>t.l>0);
  G.shake=Math.max(0,G.shake-dt*30);
  G.ents=G.ents.filter(e=>!e.dead);G.drops=G.drops.filter(d=>!d.dead);
  G.near=MAPS[G.map].safe?nearNpc():null;
  G.achT+=dt;if(G.achT>.5){G.achT=0;checkAch()}
  G.saveT+=dt;if(G.saveT>15){G.saveT=0;save()}}
function updPlayer(dt){
  const d=pl.d,M=MAPS[G.map];
  pl.hp=Math.min(d.mhp,pl.hp+d.regen*dt*(M.safe?6:1)+(M.safe?d.mhp*.05*dt:0));
  for(const k in pl.buffs){pl.buffs[k]-=dt;if(pl.buffs[k]<=0)delete pl.buffs[k]}
  if(!pl.buffs.iron&&pl.shield>0)pl.shield=Math.max(0,pl.shield-d.mhp*.05*dt);
  pl.iframe-=dt;pl.flash-=dt;pl.dashCd-=dt;pl.aimT-=dt;
  const mv=moveVec();pl.moving=false;
  pl.atkT=Math.max(0,pl.atkT-dt);
  for(const t of pl.trail)t.l-=dt;pl.trail=pl.trail.filter(t=>t.l>0);
  if(pl.dash>0){pl.dash-=dt;pl.x+=pl.dvx*dt;pl.y+=pl.dvy*dt;part(pl.x,pl.y-20,0,0,.3,CLS[pl.cls].col,5,0);pl.trail.push({x:pl.x,y:pl.y,l:.28,ml:.28,left:Math.cos(pl.face)<0})}
  else{
    const sp=d.spd*(pl.buffs.bless>0?1.2:1)*(pl.chan?.5:1);let vx=0,vy=0;
    if(mv.x||mv.y){vx=mv.x*mv.s;vy=mv.y*mv.s;G.target=null}
    else if(G.target){const dx=G.target.x-pl.x,dy=G.target.y-pl.y,l=Math.hypot(dx,dy);
      if(l<10){const n=G.target.npc;G.target=null;if(n)interact(n)}else{vx=dx/l;vy=dy/l;if(l<sp*dt){vx*=l/(sp*dt);vy*=l/(sp*dt)}}}
    if(vx||vy){pl.x+=vx*sp*dt;pl.y+=vy*sp*dt;pl.face=Math.atan2(vy,vx);pl.moving=true;pl.walkT+=Math.hypot(vx,vy)*sp*dt/26}}
  [pl.x,pl.y]=inBounds(pl.x,pl.y,0);
  const vw=VW/ZOOM,vh=VH/ZOOM;let tx=pl.x-vw/2,ty=pl.y-vh/2;
  tx=vw>M.w?(M.w-vw)/2:clamp(tx,0,M.w-vw);ty=vh>M.h?(M.h-vh)/2:clamp(ty,0,M.h-vh);
  const k=Math.min(1,dt*8);G.cam.x+=(tx-G.cam.x)*k;G.cam.y+=(ty-G.cam.y)*k}
function updSkills(dt){
  if(MAPS[G.map].safe)return;const sp=(pl.buffs.bless>0?1.15:1)*(pl.buffs.fairy>0?1+petFairyHaste():1);
  for(let i=0;i<5;i++){if(pl.lv<UNL[i])continue;pl.cds[i]-=dt*sp;if(pl.cds[i]>0)continue;
    if(pl.chan&&i!==4)continue;
    const sk=skillDef(i),lv=pl.skl[i],s={lv,range:sk.range,dmg:m=>pl.d.atk*atkMul()*m*(1+.12*(lv-1))};
    if(sk.f(s)){pl.cds[i]=cdOf(i);pl.atkT=.28}else pl.cds[i]=.12}}
/* 궁수 6세트: 채널링 중 조준 방향으로 화살을 퍼붓는다 */
function updChannel(dt){const c=pl.chan;if(!c)return;c.t-=dt;
  const mv=moveVec();
  if(G.hover&&G.t-G.hover.t<1.5)c.a=Math.atan2(G.hover.y-pl.y,G.hover.x-pl.x);
  else if(mv.x||mv.y)c.a=Math.atan2(mv.y,mv.x);
  pl.aim=c.a;pl.aimT=.2;c.acc+=dt;
  while(c.acc>=.05){c.acc-=.05;for(let k=0;k<2;k++){const b=c.a+rnd(-.13,.13);shoot({x:pl.x+Math.cos(b)*14,y:pl.y-18+Math.sin(b)*14,vx:Math.cos(b)*1150,vy:Math.sin(b)*1150,dmg:c.dmg,st:'arrow',c:'#e6ffc0',l:.62,pierce:1})}}
  if(Math.random()<.5)part(pl.x+Math.cos(c.a)*30,pl.y-18+Math.sin(c.a)*30,Math.cos(c.a)*200,Math.sin(c.a)*200,.25,'#e6ffc0',3);
  if(c.t<=0)pl.chan=null}
function spawnLogic(dt){const M=MAPS[G.map];if(M.safe)return;G.spawnT-=dt;if(G.spawnT>0)return;G.spawnT=.3;
  const cap=G.boss?6:14+(M.dg?3:0)+(M.endless?Math.min(12,pl.abyss):0);let n=0;for(const e of G.ents)if(!e.boss&&!e.dead)n++;if(n<cap)spawnMob(pick(M.mobs))}
function updEnemies(dt){
  const ents=G.ents;
  for(let i=0;i<ents.length;i++){const e=ents[i];if(e.dead)continue;
    e.flash-=dt;e.atk-=dt;e.cd-=dt;e.atkA=Math.max(0,(e.atkA||0)-dt);e.born=(e.born||0)+dt;
    e.x+=e.kbx*dt;e.y+=e.kby*dt;const f=Math.pow(.02,dt);e.kbx*=f;e.kby*=f;
    if(e.stun>0){e.stun-=dt;if(Math.random()<.1)part(e.x+rnd(-8,8),e.y-e.r,0,-20,.4,'#f3cf45',2)}
    else if(e.boss)bossUpd(e,dt);
    else{const dx=pl.x-e.x,dy=pl.y-e.y,d=Math.hypot(dx,dy)||1,sp=e.spd*(e.slow>0?.5:1);let mv=1;
      if(e.ranged){if(d<180)mv=-.8;else if(d<300)mv=0;if(d<440&&e.atk<=0){e.atk=2.2+rnd(0,.6);e.atkA=.35;eshot(e.x,e.y,Math.atan2(dy,dx),250,7,e.dmg*.9,e.c)}}
      if(e.s==='jiangshi')mv*=Math.max(0,Math.sin(G.t*5+e.ph))*1.8;
      e.x+=dx/d*sp*mv*dt;e.y+=dy/d*sp*mv*dt;e.face=dx<0?-1:1;e.walkT=(e.walkT||0)+Math.abs(mv)*sp*dt/24}
    e.slow-=dt;
    for(let j=i+1;j<ents.length;j++){const o=ents[j];if(o.dead)continue;const dx=o.x-e.x,dy=o.y-e.y,rr=e.r+o.r,d2=dx*dx+dy*dy;if(d2<rr*rr&&d2>.01){const d=Math.sqrt(d2),p=(rr-d)/2;const wE=e.boss?.1:1,wO=o.boss?.1:1;e.x-=dx/d*p*wE;e.y-=dy/d*p*wE;o.x+=dx/d*p*wO;o.y+=dy/d*p*wO}}
    const dx=pl.x-e.x,dy=pl.y-e.y,d=Math.hypot(dx,dy)||1,rr=e.r+pl.r;
    if(d<rr+8&&e.cd<=.35&&e.atkA<=0&&e.stun<=0&&!e.ranged)e.atkA=.4;
    if(d<rr){if(e.cd<=0&&e.stun<=0){hurtPlayer(e.dmg);e.cd=.9}if(!e.boss){e.x-=dx/d*(rr-d);e.y-=dy/d*(rr-d)}}
    [e.x,e.y]=inBounds(e.x,e.y,0)}
  for(const c of G.corpses)c.t-=dt;G.corpses=G.corpses.filter(c=>c.t>0)}
function updProjs(dt){
  const M=MAPS[G.map];
  for(const p of G.projs){p.l-=dt;
    if(p.home){const t=nearest(p.x,p.y,340);if(t){const a=Math.atan2(t.y-p.y,t.x-p.x),cur=Math.atan2(p.vy,p.vx);let da=Math.atan2(Math.sin(a-cur),Math.cos(a-cur));const na=cur+clamp(da,-p.home*dt,p.home*dt),sp=Math.hypot(p.vx,p.vy);p.vx=Math.cos(na)*sp;p.vy=Math.sin(na)*sp}}
    p.x+=p.vx*dt;p.y+=p.vy*dt;
    if(p.st==='dragon'){p.trail.unshift({x:p.x,y:p.y});if(p.trail.length>18)p.trail.pop();if(Math.random()<.6)part(p.x+rnd(-20,20),p.y+rnd(-20,20),rnd(-30,30),rnd(-30,30),.6,'#5a3cff',5)}
    else if(p.st==='orb'||p.st==='light'||p.st==='thunder'){if(Math.random()<.7)part(p.x,p.y,rnd(-20,20),rnd(-20,20),.35,p.c,3)}
    for(const e of G.ents){if(e.dead||p.hit.has(e))continue;if((e.x-p.x)**2+(e.y-p.y)**2<(p.r+e.r)**2){p.hit.add(e);hit(e,p.dmg,p.o,p.x-p.vx*.02,p.y-p.vy*.02);if(p.onHit)p.onHit(p,e);burst(p.x,p.y,p.c,5,140,2);p.pierce--;if(p.pierce<0){p.l=0;break}}}
    if(p.x<-50||p.y<-50||p.x>M.w+50||p.y>M.h+50)p.l=0;
    if(p.st==='cross'&&Math.random()<.6)part(p.x,p.y,rnd(-30,30),rnd(-30,30),.4,'#fff3c4',3);
    if(p.l<=0&&p.onEnd&&!p.ended){p.ended=1;p.onEnd(p)}}
  G.projs=G.projs.filter(p=>p.l>0)}
function updEProjs(dt){for(const p of G.eprojs){p.l-=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;if((p.x-pl.x)**2+(p.y-pl.y)**2<(p.r+pl.r)**2){hurtPlayer(p.dmg);p.l=0;burst(p.x,p.y,p.c,6,120,2)}}G.eprojs=G.eprojs.filter(p=>p.l>0)}
function updZones(dt){
  for(const z of G.zones){if(z.follow){z.x=pl.x;z.y=pl.y}z.l-=dt;z.tt-=dt;
    if(z.tt<=0){z.tt+=z.tick;

      else if(z.kind==='holy'){const c=G.ents.filter(e=>!e.dead&&(e.x-z.x)**2+(e.y-z.y)**2<z.r*z.r);const t=c.length?pick(c):null;const a=rnd(0,TAU),rr=rnd(0,z.r*.8);const x=t?t.x:z.x+Math.cos(a)*rr,y=t?t.y:z.y+Math.sin(a)*rr;hitCircle(x,y,72,z.dmg,z.o);fxPillar(x,y,40,'#fff3c4',.45);burst(x,y,'#fff3c4',10,240,2)}
      else if(z.kind==='cloud'){const c=G.ents.filter(e=>!e.dead&&(e.x-z.x)**2+(e.y-z.y)**2<z.r*z.r);if(c.length){const t=pick(c);fxBolt(t.x+rnd(-30,30),t.y-220,t.x,t.y,'#d6ccff',.22);hit(t,z.dmg,z.o);burst(t.x,t.y,'#b9a8ff',8,200,2)}}

const SHOP=[

function shopH(){const tot=potTotal();return `<div class="pw"><span>보유 금화</span><b class="num">${fmt(pl.gold)}</b><small>회복약 소지 <b class="num">${tot}/${POT_MAX}</b> · 재사용 ${POT_CD}초 · 단축키 Q</small></div>
  <p class="sec">회복약</p>`+POT.map((p,i)=>{const pr=p.price(pl.lv),room=POT_MAX-tot;return `<div class="mrow"><div><h5><i class="potdot" style="--pc:${p.c}"></i>${p.n} <span class="tag">최대 체력 ${Math.round(p.p*100)}% 회복</span></h5><p>보유 <b class="num">${pl.pots[i]}</b>개</p></div><div class="acts"><button class="sb pri" data-act="buypot" data-i="${i}" data-n="1" ${pl.gold>=pr&&room>=1?'':'disabled'}>1개 · 금화 ${fmt(pr)}</button><button class="sb" data-act="buypot" data-i="${i}" data-n="5" ${pl.gold>=pr*5&&room>=5?'':'disabled'}>5개</button></div></div>`}).join('')+
  `<p class="sec">물품</p>`+SHOP.map((s,i)=>{const p=s.p();return `<div class="mrow"><div><h5>${s.n}</h5><p>${s.d}</p></div><button class="sb pri" data-act="buy" data-i="${i}" ${pl.gold>=p?'':'disabled'}>금화 ${fmt(p)}</button></div>`}).join('')}
function boardH(){if(!pl.board)pl.board=makeOffers();const b=pl.bounty;
  return (b?`<div class="det" style="--gc:var(--jade)"><div><b style="font-family:var(--f-disp);font-size:18px">진행 중 · ${MAPS[b.map].n}</b><p class="hint" style="margin-top:4px">적 ${b.k}/${b.n} 처치 · 완료하면 즉시 보상</p></div><div class="acts"><button class="sb" data-act="bgo">그곳으로 이동</button><button class="sb" data-act="bdrop">의뢰 포기</button></div></div>`:'<p class="hint">의뢰는 한 번에 하나만 맡을 수 있다. 완료하면 어디서든 바로 보상을 받는다.</p>')+
  pl.board.map((o,i)=>`<div class="mrow"><div><h5>${MAPS[o.map].n}<span class="tag${MAPS[o.map].dg?' dg':''}">${MAPS[o.map].kind}</span></h5><p>그곳의 적 ${o.n}마리 처치</p><div class="meta num">금화 ${fmt(o.rw.gold)} · 강화석 ${o.rw.stone} · 혼석 ${o.rw.soul} · 경험치 ${fmt(o.rw.exp)}</div></div><button class="sb pri" data-act="bacc" data-i="${i}" ${b?'disabled':''}>맡기</button></div>`).join('')}
function petH(){return `<div class="pw"><span>동반자 정수</span><b class="num">${fmt(pl.ess)}</b><small>보스를 쓰러뜨리면 낮은 확률로 떨어진다 · 한 번에 하나만 데리고 다닌다</small></div>`+
  Object.entries(PETS).map(([k,P])=>{const lv=petLv(k),c=petCost(lv),on=pl.pet===k;
    return `<div class="petrow${on?' on':''}" style="--pc:${P.col}"><img src="${A(`img/${k}_L.webp`)}" alt="${P.n}"><div><h5>${P.n} <span class="tag">${P.role}</span> <small class="num">Lv.${lv}</small></h5><p>${P.desc}</p><p class="eff">${P.eff(lv)}</p>
    <div class="acts">${on?'<button class="sb" disabled>함께하는 중</button>':`<button class="sb pri" data-act="petsel" data-id="${k}">데리고 다니기</button>`}${lv>=PET_MAX?'<button class="sb" disabled>최대 강화</button>':`<button class="sb" data-act="petup" data-id="${k}" ${pl.ess>=c.ess&&pl.gold>=c.gold?'':'disabled'}>강화 Lv.${lv+1} · 정수 ${c.ess} · 금화 ${fmt(c.gold)}</button>`}</div></div></div>`}).join('')}
function partyH(){const n=Object.keys(ROOT.chars).length;return `<div class="pw"><span>모험단</span><b class="num">${n}/4</b><small>직업마다 캐릭터 하나 · 진행은 따로, 창고는 함께 쓴다</small></div>`+
  Object.values(CLS).map(c=>{const ch=ROOT.chars[c.id],cur=pl.cls===c.id,data=cur?pl:ch;
    if(ch||cur){const q=MAINQ[clamp((data.qv?data.q:QMIG[Math.min(data.q||0,9)])|0,0,MAINQ.length-1)];
      return `<div class="partyrow${cur?' on':''}" style="--cc:${c.col}"><img src="${A(`img/${c.id}_L.webp`)}" alt=""><div><h5>${esc(data.name)} <span class="tag" style="color:${c.col};border-color:${c.col}">${c.n}</span> <small class="num">Lv.${data.lv}</small></h5><p>임무 · ${q.t} · 무한 심연 ${data.abyss||0}단계</p>
      <div class="acts">${cur?'<button class="sb" disabled>플레이 중</button>':`<button class="sb pri" data-act="switch" data-id="${c.id}">이 캐릭터로 전환</button><button class="sb${G.confirmDel===c.id?' pri':''}" data-act="delchar" data-id="${c.id}">${G.confirmDel===c.id?'한 번 더 누르면 삭제':'삭제'}</button>`}</div></div></div>`}
    return `<div class="partyrow empty" style="--cc:${c.col}"><img src="${A(`img/${c.id}_L.webp`)}" alt=""><div><h5>빈 자리 <span class="tag" style="color:${c.col};border-color:${c.col}">${c.n}</span></h5><p>${c.d}</p>
      <div class="acts"><input class="pn" id="pn_${c.id}" maxlength="8" placeholder="이름" aria-label="${c.n} 이름"><button class="sb pri" data-act="newchar" data-id="${c.id}">새 ${c.n} 만들기</button></div></div></div>`}).join('')}
function cheatH(){const o=GRADES.map((g,i)=>`<option value="${i}">${g.n}</option>`).join('');
  return `<p class="hint">시험용 기능이다. 사용하면 실제 기록에 그대로 반영된다.</p>
  <p class="sec">캐릭터</p><div class="cgrid">
   <label>레벨<input type="number" id="cLv" min="1" max="999" value="${pl.lv}"></label><label>남은 능력치<input type="number" id="cPts" min="0" value="${pl.pts}"></label>
   <label>힘<input type="number" id="cStr" min="0" value="${pl.stats.str}"></label><label>민첩<input type="number" id="cAgi" min="0" value="${pl.stats.agi}"></label><label>지력<input type="number" id="cInt" min="0" value="${pl.stats.int}"></label>
