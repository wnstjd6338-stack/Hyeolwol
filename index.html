<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0c0d12"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="혈월야행">
</head><body>
<title>혈월야행</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=IBM+Plex+Mono:wght@500&family=Song+Myung&display=swap">
<style>
/* Layout: full-bleed ink-wash world on canvas; HUD sits at the corners like seals on a scroll; menus are dark paper sheets. Single dark look by design. */
:root{
  --ink:#0c0d12; --ink-2:#14161e; --sheet:rgba(16,17,24,.97);
  --bone:#e8e0cc; --mute:#968f7e; --gold:#c8a259; --blood:#b8283c; --jade:#5ed4b9;
  --line:rgba(200,162,89,.26); --pos:#7fd88f; --neg:#ff6b7d;
  --f-disp:'Song Myung','Nanum Myeongjo','Batang',serif;
  --f-body:'Gowun Dodum','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  --f-num:'IBM Plex Mono',ui-monospace,Menlo,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
button,.cell,.card{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
#game,#game img{-webkit-touch-callout:none}
html,body{overscroll-behavior:none}
.fsb{position:fixed;right:16px;top:calc(12px + env(safe-area-inset-top,0px));z-index:21}
.rot{display:none;font-size:12px;color:var(--gold);margin:0}
@media (pointer:coarse) and (orientation:portrait){.rot{display:block}}
@media (max-height:520px){
  .mb{width:40px;height:40px}.mb span{font-size:16px}.mb small{font-size:8.5px}
  .tl{gap:4px;width:min(300px,calc(100vw - 360px))}
  .tl .cg{width:32px;height:32px;font-size:18px}
  .tq{padding:4px 8px}.tq span:not(.go){display:block;font-size:10.5px;line-height:1.3}
  .sk{width:42px;height:42px;font-size:19px}
  .dash{width:64px;height:64px}
  .talk{bottom:calc(88px + env(safe-area-inset-bottom,0px))}
  .por{height:86vh}.box{min-height:96px;padding:18px 16px 20px}#vnT{font-size:15px;line-height:1.6}
  h1{font-size:56px}.ttl{gap:10px}.seal{display:none}
  .sheet{max-height:calc(100vh - 16px);max-height:calc(100dvh - 16px)}
  .pot{width:50px;height:50px;bottom:calc(86px + env(safe-area-inset-bottom,0px));right:23px}
  .tgt{bottom:calc(142px + env(safe-area-inset-bottom,0px))}
  .talk{bottom:calc(178px + env(safe-area-inset-bottom,0px))}.mbody{padding:10px 14px 14px}
}
html,body{height:100%;margin:0;overflow:hidden;background:var(--ink);color:var(--bone);font-family:var(--f-body)}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0}
button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--jade);outline-offset:2px}
button:disabled{opacity:.38;cursor:not-allowed}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
#game{position:fixed;inset:0;user-select:none;-webkit-user-select:none;touch-action:none}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block}

/* title & class select */
.tart{position:absolute;left:50%;top:50%;width:max(100vw,177.69vh);height:max(100vh,56.28vw);transform:translate(-50%,-50%);background:#0c0d12 var(--tbg,url(img/bg_title.jpg)) center/100% 100% no-repeat}
#bNew{left:37.68%;top:58.34%;width:13.46%;height:6.7%}#bCont{left:52.09%;top:58.34%;width:10.29%;height:6.7%}#fsTitle{left:42.94%;top:67.38%;width:14.17%;height:6.48%}
/* V017: 세로 화면 전용 타이틀 그림 (941×1672) */
@media (orientation:portrait){.tart{width:max(100vw,56.28vh);height:max(100vh,177.69vw);background-image:var(--tbgm,url(img/bg_title_m.jpg))}
 #bNew{left:33.37%;top:65.79%;width:33.26%;height:4.43%}#bCont{left:33.37%;top:71.47%;width:33.26%;height:4.43%}#fsTitle{left:33.37%;top:77.09%;width:33.26%;height:4.43%}
 .tart .tver{top:49.76%;font-size:max(11px,2.6vw);background:transparent;box-shadow:none;text-shadow:0 1px 6px #000}.trot{display:none}}
#title{padding:0;overflow:hidden}
.thot{position:absolute;padding:0;border:1px solid transparent;border-radius:3px;background:transparent;cursor:pointer;transition:box-shadow .15s,background .15s,border-color .15s;-webkit-tap-highlight-color:transparent}
.thot:hover,.thot:focus-visible{border-color:rgba(255,190,170,.55);box-shadow:0 0 22px rgba(220,60,70,.45),inset 0 0 18px rgba(255,120,110,.18);outline:none}
.thot:active{background:rgba(255,255,255,.08)}
.thot.off{background:rgba(8,8,12,.62);cursor:default;box-shadow:none;border-color:transparent}
.tver{position:absolute;left:50%;top:54.5%;transform:translate(-50%,-50%);font-size:max(10px,.8vw);color:#bfb6a6;padding:.15em .7em;border-radius:8px;background:rgba(28,24,26,.92);box-shadow:0 0 10px 6px rgba(28,24,26,.92);letter-spacing:.06em}
.trot{position:absolute;left:0;right:0;bottom:calc(14px + env(safe-area-inset-bottom,0px));text-align:center;text-shadow:0 1px 4px #000}
.screen{position:fixed;inset:0;display:grid;place-items:center;padding:24px 16px;overflow:auto;z-index:20;touch-action:pan-y}
.ttl{text-align:center;display:grid;gap:16px;justify-items:center;max-width:560px}
.seal{font-family:var(--f-disp);color:#fff2ea;background:var(--blood);width:58px;padding:8px 0;line-height:1.1;font-size:21px;border-radius:3px;box-shadow:0 0 0 3px rgba(0,0,0,.35) inset,0 0 50px rgba(184,40,60,.45)}
h1{font-family:var(--f-disp);font-weight:400;font-size:clamp(52px,13vw,104px);letter-spacing:.1em;margin:0;line-height:1;text-shadow:0 0 34px rgba(184,40,60,.5);text-wrap:balance}
.sub{color:var(--mute);margin:0;font-size:15px}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.btn{border:1px solid var(--line);background:rgba(12,13,18,.75);padding:12px 24px;border-radius:2px;font-size:15px;letter-spacing:.05em}
.btn.pri{background:var(--blood);border-color:#d8495c;color:#fff4ee}
.btn:hover:not(:disabled){border-color:var(--gold)}
.hint{font-size:12px;color:var(--mute);margin:0;line-height:1.6}
.cs{width:min(1000px,100%);display:grid;gap:18px}
.cs h2{font-family:var(--f-disp);font-weight:400;font-size:clamp(24px,5vw,32px);margin:0;text-align:center;letter-spacing:.06em}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px}
.card{border:1px solid var(--line);background:linear-gradient(180deg,rgba(255,255,255,.03),rgba(0,0,0,.3));padding:0 0 14px;text-align:left;display:grid;gap:6px;align-content:start;overflow:hidden;border-radius:2px;transition:border-color .2s,box-shadow .2s;min-width:0}
.card.on{border-color:var(--cc);box-shadow:0 0 0 1px var(--cc),0 14px 44px -14px var(--cc)}
.card .pv{height:150px;overflow:hidden;background:radial-gradient(circle at 50% 70%,color-mix(in srgb,var(--cc) 22%,transparent),transparent 70%)}
.card .pv svg{width:100%;height:auto;display:block;margin-top:-6px}
.card .pv img{width:100%;height:220px;object-fit:contain;object-position:50% 12%;display:block;margin-top:6px}
.card .pv{height:170px}
.cp{display:flex;gap:10px;align-items:baseline;font-size:12px;color:var(--mute);flex-wrap:wrap}
.cp b{font-family:var(--f-num);font-size:15px;color:var(--gold);font-weight:500}
.cp .rec{font-family:var(--f-num)}
.cell .ic{width:84%;height:84%;object-fit:cover;border-radius:2px;filter:saturate(.9);pointer-events:none}
.cell .ic.eq,.dh .gl img.eq{object-fit:contain;filter:drop-shadow(0 0 4px color-mix(in srgb,var(--gc) 70%,transparent))}
.cell:not(.vac){background:radial-gradient(circle at 50% 55%,color-mix(in srgb,var(--gc) 42%,transparent),transparent 68%),linear-gradient(180deg,transparent,rgba(0,0,0,.45)),color-mix(in srgb,var(--gc) 14%,#101218)}
.dh .gl{background:radial-gradient(circle at 50% 55%,color-mix(in srgb,var(--gc) 45%,transparent),transparent 70%),#101218}
.cell .ic+.gl{position:absolute;bottom:1px;left:3px;font-size:11px}
.cell.vac .ic{opacity:.22;filter:grayscale(1)}
.cell small{position:absolute;bottom:1px;right:3px;text-shadow:0 1px 2px #000}
.cell .up{bottom:auto;top:2px;right:auto;left:50%;transform:translateX(-50%)}
.cell .st{position:absolute;bottom:1px;left:3px;font-style:normal;font-size:11px;font-family:var(--f-disp);color:var(--sc);text-shadow:0 0 4px #000}
.tabs{display:flex;gap:6px}.tab{flex:1;padding:9px;border:1px solid var(--line);background:rgba(255,255,255,.02);font-size:14px;border-radius:2px;color:var(--mute)}.tab.on{color:var(--bone);border-color:var(--gold);background:rgba(200,162,89,.1)}
.setb{border:1px solid color-mix(in srgb,var(--sc) 55%,transparent);background:color-mix(in srgb,var(--sc) 7%,transparent);padding:8px 10px;font-size:12.5px;border-radius:2px}
.setb b{font-family:var(--f-disp);font-weight:400;font-size:15px;color:var(--sc)}.setb ul{margin:4px 0 0;padding-left:18px;color:var(--mute)}.setb li.on{color:var(--bone)}
.petrow,.partyrow{display:grid;grid-template-columns:84px 1fr;gap:12px;padding:12px;border:1px solid rgba(232,224,204,.1);border-radius:2px;align-items:center}
.petrow.on,.partyrow.on{border-color:var(--gold);background:rgba(200,162,89,.06)}
.petrow img,.partyrow img{width:84px;height:84px;object-fit:contain}
.partyrow.empty img{opacity:.35;filter:grayscale(1)}
.petrow h5,.partyrow h5{margin:0;font-family:var(--f-disp);font-weight:400;font-size:19px;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.petrow p,.partyrow p{margin:4px 0;font-size:12.5px;color:#cfc7b3;line-height:1.5}.petrow .eff{color:var(--jade)}
.pn{background:rgba(0,0,0,.4);border:1px solid var(--line);color:var(--bone);padding:7px 9px;font:inherit;font-size:13px;width:120px;border-radius:2px}
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.cgrid label{display:grid;gap:3px;font-size:12px;color:var(--mute)}
.cgrid input,.cgrid select{background:#0f1016;color:var(--bone);border:1px solid var(--line);padding:7px 8px;font:inherit;font-size:13px;border-radius:2px;width:100%;min-width:0}
.code{width:100%;background:#0f1016;color:var(--bone);border:1px solid var(--line);padding:8px;font-family:var(--f-num);font-size:11px;border-radius:2px;resize:vertical;word-break:break-all}
.potdot{display:inline-block;width:10px;height:14px;border-radius:3px 3px 5px 5px;background:var(--pc);margin-right:6px;vertical-align:-1px}
.dh .gl img{width:100%;height:100%;object-fit:cover}
.achrow{display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid rgba(232,224,204,.08)}
.achrow .ai{width:44px;height:44px;display:grid;place-items:center;font-family:var(--f-disp);font-size:22px;border:1px solid var(--line);color:#4a4740}
.achrow.done .ai{color:var(--gold);border-color:var(--gold);box-shadow:inset 0 0 12px -4px var(--gold)}
.achrow.got .ai{color:var(--jade);border-color:rgba(94,212,185,.5)}
.achrow h5{margin:0;font-family:var(--f-disp);font-weight:400;font-size:17px}
.achrow p{margin:2px 0 0;font-size:12px;color:#cfc7b3}
.achrow .pg{height:4px;background:rgba(0,0,0,.5);margin-top:6px;max-width:260px}
.achrow .pg i{display:block;height:100%;background:var(--gold)}
.achrow .rw{font-size:11px;color:var(--mute);margin-top:4px}
.lockt{color:#ff8f9d;font-size:11px}
.card h4{margin:0 14px;font-family:var(--f-disp);font-weight:400;font-size:24px;color:var(--cc);display:flex;align-items:baseline;gap:8px}
.card h4 small{font-family:var(--f-body);font-size:12px;color:var(--mute)}
.card p{margin:0 14px;font-size:13px;line-height:1.6;color:#cfc7b3}
.card .gls{margin:2px 14px 0;font-family:var(--f-disp);font-size:18px;letter-spacing:.3em;color:var(--cc);opacity:.85}
.card .ms{margin:0 14px;font-size:11px;letter-spacing:.08em;color:var(--gold)}
.namer{display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap}
.namer label{font-size:14px;color:var(--mute)}
.namer input{background:rgba(0,0,0,.4);border:1px solid var(--line);color:var(--bone);padding:10px 12px;font:inherit;width:160px;border-radius:2px}

/* HUD */
#hud{position:absolute;inset:0;pointer-events:none;text-shadow:0 1px 2px #000,0 0 10px rgba(0,0,0,.85)}
.tl::before{content:'';position:absolute;inset:-12px -40px -10px -16px;background:radial-gradient(ellipse at 20% 30%,rgba(6,6,9,.6),rgba(6,6,9,0) 70%);z-index:-1}
#hud .pe{pointer-events:auto}
.tl{position:absolute;left:16px;top:calc(12px + env(safe-area-inset-top,0px));width:min(320px,calc(100vw - 96px));display:grid;gap:6px}
.who{display:flex;gap:10px;align-items:center}
.cg.hpor{background:var(--cc) center/cover no-repeat;box-shadow:inset 0 0 0 1px rgba(0,0,0,.35),0 0 0 1px var(--cc)}
.cg{font-family:var(--f-disp);width:40px;height:40px;display:grid;place-items:center;background:var(--cc,var(--blood));color:#130e0f;font-size:22px;border-radius:2px;flex:none}
.who b{font-family:var(--f-disp);font-weight:400;font-size:18px;letter-spacing:.04em}
.who .lvl{font-size:12px;color:var(--gold);margin-left:6px}
.mapn{font-size:12px;color:var(--mute)}
.bar{position:relative;height:15px;background:rgba(0,0,0,.6);border:1px solid rgba(232,224,204,.18);overflow:hidden;border-radius:1px}
.bar i{position:absolute;top:0;bottom:0;left:0;width:0}
.bar.hp i{background:linear-gradient(90deg,#6f1221,#d0364b)}
.bar.hp i.sh{background:rgba(243,207,69,.5)}
.bar span{position:absolute;inset:0;display:grid;place-items:center;font-size:10px;font-family:var(--f-num);text-shadow:0 1px 2px #000}
.bar.xp{height:5px}.bar.xp i{background:var(--jade)}
.cur{display:flex;gap:12px;font-size:12px;flex-wrap:wrap}
.cur em{font-style:normal;font-family:var(--f-disp);margin-right:4px}
.cur .cgd{color:#f3cf45}.cur .cst{color:#9fc3e8}.cur .csl{color:#c79bff}
.trk{display:grid;gap:4px;margin-top:4px}
.tq{display:grid;gap:1px;text-align:left;background:linear-gradient(90deg,rgba(10,10,14,.78),rgba(10,10,14,0));border-left:2px solid var(--gold);padding:6px 10px;font-size:12px;line-height:1.4;min-width:0}
.tq.b{border-left-color:var(--jade)}
.tq em{font-style:normal;font-size:10px;letter-spacing:.12em;color:var(--gold)}
.tq.b em{color:var(--jade)}
.tq.b{display:flex;flex-wrap:wrap;gap:0 7px;align-items:baseline;padding-top:3px;padding-bottom:3px}.tq.b b{font-size:13px}.tq.b span:not(.go){display:inline!important;font-family:"IBM Plex Mono",monospace;font-size:11px}
.tq b{font-weight:400;font-family:var(--f-disp);font-size:14px}
.tq span{color:#cfc7b3}
.tq .go{color:var(--jade);font-size:11px}
.tq .qc{display:block!important;font-size:11.5px;line-height:1.35;color:#e2d9c4}
.tq .qbar{display:block;height:3px;margin-top:3px;background:rgba(0,0,0,.55);max-width:220px}.tq .qbar u{display:block;height:100%;background:var(--gold)}.tq.b .qbar u{background:var(--jade)}
.tr{position:absolute;right:16px;top:calc(12px + env(safe-area-inset-top,0px));display:grid;gap:6px}
.mb{width:50px;height:50px;border:1px solid var(--line);background:rgba(12,13,18,.8);display:grid;place-items:center;align-content:center;border-radius:2px;padding:0;position:relative}
.mb span{font-family:var(--f-disp);font-size:20px;line-height:1.05}
.mb .mi{width:72%;height:72%;object-fit:contain;display:block;margin-bottom:-1px;filter:drop-shadow(0 1px 2px rgba(0,0,0,.7));pointer-events:none}
.mb small{white-space:nowrap}
.sk.ski img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;pointer-events:none}.sk.ski.lock img{filter:grayscale(1) brightness(.35)}
.sk.ski.setk{box-shadow:0 0 0 1px var(--cc),inset 0 0 10px -2px var(--cc)}
.skrow .ic img{width:100%;height:100%;object-fit:cover;display:block}.skrow.lock .ic img{filter:grayscale(1) brightness(.4)}
.dash .di{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;border-radius:50%;opacity:.85;pointer-events:none}.dash small{position:relative;z-index:1;margin-top:34px;text-shadow:0 1px 3px #000;color:#e8e0cc}
.mb small{font-size:9.5px;color:var(--mute)}
.mb .dot{position:absolute;top:4px;right:4px;width:7px;height:7px;border-radius:50%;background:var(--blood);box-shadow:0 0 8px var(--blood)}
#bossBar,#gauge{position:absolute;top:calc(14px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);width:min(480px,calc(100vw - 32px));display:grid;gap:4px;text-align:center}
#bossBar .bn{font-family:var(--f-disp);font-size:20px;letter-spacing:.08em;text-shadow:0 0 14px rgba(255,60,80,.6)}
.bar.boss{height:12px}.bar.boss i{background:linear-gradient(90deg,#8d1022,#ff4a5e)}
#gauge span{font-size:11px;color:var(--mute);letter-spacing:.1em}
.bar.g{height:6px}.bar.g i{background:var(--gold)}
.skb{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));display:flex;gap:6px}
.sk{position:relative;width:54px;height:54px;border:1px solid var(--line);background:rgba(12,13,18,.82);display:grid;place-items:center;font-family:var(--f-disp);font-size:25px;color:var(--cc);border-radius:2px;overflow:hidden;padding:0}
.sk::after{content:'';position:absolute;inset:0;background:conic-gradient(rgba(5,5,8,.8) calc(var(--p,0)*360deg),transparent 0)}
.sk.ready{box-shadow:inset 0 0 14px -3px var(--cc);border-color:color-mix(in srgb,var(--cc) 60%,transparent)}
.sk .lv{position:absolute;right:3px;bottom:1px;font-size:9px;font-family:var(--f-num);color:var(--bone);z-index:2}
.sk.lock{color:#4a4740}
.sk.lock .lv{left:0;right:0;text-align:center;bottom:3px;color:var(--mute)}
.dash{position:absolute;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));width:74px;height:74px;border-radius:50%;border:1px solid var(--line);background:rgba(12,13,18,.85);display:grid;place-items:center;align-content:center;overflow:hidden}
.dash::after{content:'';position:absolute;inset:0;border-radius:50%;background:conic-gradient(rgba(5,5,8,.8) calc(var(--p,0)*360deg),transparent 0)}
.dash span{font-family:var(--f-disp);font-size:26px;color:var(--jade);line-height:1}
.dash small{font-size:10px;color:var(--mute)}
.talk{position:absolute;right:16px;bottom:calc(212px + env(safe-area-inset-bottom,0px));padding:10px 16px;background:var(--blood);color:#fff4ee;border-radius:2px;font-size:14px;box-shadow:0 6px 24px rgba(184,40,60,.4)}
.talk kbd{font-family:var(--f-num);font-size:11px;opacity:.8;margin-right:6px}
/* 회복약 · 표적 버튼 */
.pot{position:absolute;right:24px;bottom:calc(100px + env(safe-area-inset-bottom,0px));width:58px;height:58px;border-radius:50%;border:1px solid var(--line);background:radial-gradient(circle at 50% 60%,color-mix(in srgb,var(--pc,#555) 45%,#0c0d12),#0c0d12 70%);display:grid;place-items:center;align-content:center;overflow:hidden;padding:0}
.pot::after{content:'';position:absolute;inset:0;border-radius:50%;background:conic-gradient(rgba(5,5,8,.8) calc(var(--p,0)*360deg),transparent 0)}
.pot span{font-family:var(--f-num);font-size:18px;line-height:1;position:relative;z-index:1}.pot small{font-size:9px;color:#e8dccc;position:relative;z-index:1}
.pot.empty{opacity:.5}
.difv{display:flex;align-items:center;gap:8px}.difv input{width:min(46vw,220px)}.difv b{min-width:46px;text-align:right}

    {w:'seol',t:`논두렁 끝 산자락에 여우골이 있어. 거기서 아홉 갈래 웃음소리가 들린대.`},
    {w:'seol',t:`동굴의 적은 네가 강해지는 만큼 같이 강해져. 서두르지 말고, 하지만 멈추지도 말고.`}]},
  {t:'여우골 입구',type:'kill',map:'fox',n:50,lv:6,st:()=>[{w:'seol',t:'여우골에 들어가면 웃음소리를 따라가지 마. 구미호는 듣고 싶은 말만 골라서 해.'},{w:'me',t:'듣고 싶은 말이 뭔지 나도 모르는데.'},{w:'seol',t:'……그러니까 더 위험해.'}],end:()=>[
    {w:'n',t:'동굴 깊은 곳에서 아홉 갈래의 웃음소리가 메아리쳤다.'},
    {w:'gumiho',t:'어머, 손님이네. 등불 냄새를 묻히고 오다니… 그 무녀의 개구나?'}]},
  {t:'여우불 꺼뜨리기',type:'mob',map:'fox',mob:'wisp',n:20,lv:8,hint:'여우골 동굴의 도깨비불을 쓰러뜨리자',end:()=>[
    {w:'n',t:'도깨비불이 꺼질 때마다 동굴 안이 한 뼘씩 어두워졌다. 그런데도 앞은 잘 보였다.'},
    {w:'me',t:'어둠이 편하다. …망자라서인가.'},
    {w:'gumiho',t:'아니, 원래 그런 눈이었어. 등불이 아니라 어둠을 보도록 만들어진 눈.'}]},
  {t:'꼬리 셋 달린 여우',lv:9,type:'elite',map:'fox',n:5,end:()=>[
    {w:'n',t:`정예 여우령의 꼬리가 하나씩 꺼질 때마다 동굴 안쪽에서 누군가 혀를 찼다.`}]},
  {t:'여우 방울',lv:10,type:'collect',map:'fox',n:15,item:'여우 방울',p:0.2,end:()=>[
    {w:'n',t:`방울마다 작은 글씨가 새겨져 있었다. "약속은 지켜야지, 무녀야."`},
    {w:'me',t:`…또 그 무녀 이야기다.`}]},
  {t:'동굴 속 목소리',type:'talk',npc:'seol',lv:11,hint:'청등마을의 무녀 설화에게 여우 방울 이야기를 하자',end:()=>[
    {w:'me',t:'여우 방울에 「약속은 지켜야지, 무녀야」라고 새겨져 있었다.'},
    {w:'seol',t:'…구미호는 원래 이 산의 수호령이었어. 할머니 때부터 마을과 약조를 맺고 살았지.'},
    {w:'seol',t:'혈월이 뜨던 밤, 나는 그 약조를 어겼어. 여우골에 바칠 등불을 다른 데 썼거든.'},
    {w:'me',t:'어디에.'},
    {w:'seol',t:'……너한테.'}]},
  {t:'정리하는 손',type:'dis',n:10,lv:12,hint:'가방에서 쓰지 않는 장비를 10개 해체하자 (해체하면 강화석이 나온다)',st:()=>[
    {w:'smith',t:'가방이 고물상이구먼. 쓰지 않는 쇠는 녹여서 강화석으로 바꿔. 가방에서 해체하면 돼.'}],end:()=>[
    {w:'smith',t:'좋아. 쇠는 미련 없이 녹여야 다시 태어나지. 사람도 그렇고.'},
    {w:'smith',t:'…무녀도 그걸 알았으면 좋았을 텐데.'}]},
  {t:'더 깊은 굴',type:'lv',lv:14,end:()=>[
    {w:'gumiho',t:`어머, 아직도 여기 있네? 좀 더 단단해지면 안쪽까지 와 봐. 놀아 줄게.`}]},
  {t:'여우령 사냥',type:'mob',map:'fox',mob:'fox',n:25,lv:15,end:()=>[
    {w:'n',t:'여우령들은 쓰러지면서도 꼬리로 동굴 안쪽을 가리켰다. 마치 길을 안내하듯이.'},
    {w:'gumiho',t:'착하지? 내 아이들이야. 너한테 나쁜 마음은 없어. 그 무녀한테만 있지.'}]},
  {t:'여우골의 원혼',type:'kill',map:'fox',n:120,lv:16,end:()=>[
    {w:'n',t:`동굴 벽에 걸린 등잔들이 하나둘 꺼졌다. 남은 것은 가장 안쪽의 붉은 빛 하나뿐.`}]},
  {t:'등잔 틀 백서른두 개',type:'talk',npc:'smith',lv:17,hint:'대장장이 강쇠에게 무녀가 주문했던 등잔 틀 이야기를 묻자',end:()=>[
    {w:'smith',t:'등잔 틀? 아아, 그거. 백서른두 개. 하나도 틀리지 않고 기억하지.'},
    {w:'smith',t:'틀마다 이름을 새겨 달라더군. 마을 사람들 이름을. 서당 훈장, 방앗간 집 쌍둥이, 내 마누라….'},
    {w:'me',t:'당신 아내의 이름도?'},
    {w:'smith',t:'내 손으로 새겼다. 굿에 쓴다길래, 복 비는 굿인 줄 알았지. …망치가 무거운 날이 있어. 오늘이 그래.'}]},
  {t:'아홉 꼬리의 거짓말',type:'boss',map:'fox',boss:'gumiho',lv:18,hint:'여우골 동굴에서 적을 쓰러뜨려 보스 게이지를 채우면 구미호가 나타난다',end:()=>[
    {w:'gumiho',t:'후후… 아홉 번째 꼬리까지 잘라 가다니. 그런데 너, 냄새가 이상하네.'},
    {w:'gumiho',t:'산 놈한테선 이런 냄새가 안 나거든. 갓 덮은 무덤 흙 냄새.'},
    {w:'me',t:'헛소리 마라.'},
    {w:'gumiho',t:'그 무녀한테 물어봐. 사흘 전 혈월이 뜨던 밤, 마을 한가운데서 무슨 굿을 했는지.'}]},
  {t:'무녀의 손목',lv:19,type:'talk',npc:'seol',end:()=>[
    {w:'me',t:'구미호가 네 이야기를 했다. 사흘 전 밤의 굿에 대해.'},
    {w:'seol',t:'…여우는 원래 거짓말을 해. 신경 쓰지 마.'},
    {w:'n',t:'설화의 손끝이 떨렸다. 소매 아래로 붉은 실이 칭칭 감긴 손목이 언뜻 보였다.'},
    {w:'seol',t:'저승 나루터로 가 줘. 저승사자가 마을 사람들의 혼을 배에 싣고 있대. …하지만 지금의 너로는 무리야. 더 강해져서 가.'}]},
  {t:'여우골의 남은 원혼',type:'kill',map:'fox',n:60,lv:20,end:()=>[
    {w:'n',t:'구미호가 사라진 동굴에도 원혼은 남아 있었다. 주인을 잃은 여우불이 갈 곳을 몰라 맴돌았다.'},
    {w:'gumiho',t:'(동굴 깊은 곳의 메아리) …저승 나루터에 가거든, 사공한테 내 안부나 전해 줘. 그 늙은이는 아직 노를 젓고 있을 테니.'}]},
  {t:'저승으로 가는 길',type:'lv',lv:21,end:()=>[
    {w:'seol',t:'이걸 가져가. 내 머리카락으로 엮은 부적이야.'},
    {w:'seol',t:'저승의 물은 망자를 붙잡아. 너를 놓치면… 다시는 못 불러와.'},
    {w:'me',t:'"다시는"? 전에도 불러온 적이 있다는 말처럼 들리는데.'},
    {w:'seol',t:'……가.'}]},
  {t:'검은 강의 망자',type:'kill',map:'river',n:80,lv:21,st:()=>[{w:'n',t:'나루터에 닿자 강물이 발목을 붙잡았다. 차갑지 않았다. 오히려 익숙했다.'},{w:'n',t:'설화가 엮어 준 머리카락 부적이 손목에서 희미하게 데워졌다.'}],end:()=>[
    {w:'n',t:'강물 위로 떠내려가는 등잔 하나하나에 사람의 얼굴이 비쳤다.'},
    {w:'n',t:'누군가 강가에 명부를 찢어 흩뿌려 놓았다. 젖은 종이 조각들이 물살에 휩쓸려 가고 있었다.'}]},
  {t:'백골 궁수',type:'mob',map:'river',mob:'archer',n:20,lv:23,end:()=>[
    {w:'n',t:'백골 궁수들은 화살을 다 쏘고 나서야 무너졌다. 화살대마다 마을 이름이 적힌 띠가 감겨 있었다.'},
    {w:'me',t:'청등마을 사람들은 아니다. 더 오래된… 다른 마을의 망자들이다.'}]},
  {t:'찢어진 명부',lv:24,type:'collect',map:'river',n:18,item:'찢어진 명부 조각',p:.22,end:()=>[
    {w:'n',t:'명부 조각을 이어 붙이자 한 줄이 드러났다.'},
    {w:'n',t:'"청등마을 백서른두 명 — 혈월 첫날 밤 몰(歿). 사유: 제물."'},
    {w:'me',t:'제물이라고…?'}]},
  {t:'나루터의 사공들',lv:25,type:'elite',map:'river',n:8,end:()=>[
    {w:'n',t:'노를 쥔 망자 사공이 마지막으로 중얼거렸다.'},
    {w:'n',t:'"배 삯은 이미 치러졌다. 백서른두 개의 혼으로. 그런데 왜 너 하나만 배에서 내렸지?"'}]},
  {t:'강시의 행렬',type:'mob',map:'river',mob:'jiangshi',n:25,lv:26,end:()=>[
    {w:'n',t:'강시들은 이마의 부적을 떼어 내자 한 줄로 서서 강 쪽으로 깡충깡충 걸어갔다. 돌아갈 곳을 기억하는 듯이.'},
    {w:'reaper',t:'(어딘가에서 들리는 목소리) 길을 잃은 혼을 강으로 돌려보내 주어 고맙구나. 너 자신은 돌아가지 않겠지만.'}]},
  {t:'강을 건너는 등불',type:'lv',lv:28,end:()=>[
    {w:'seol',t:`강 위로 떠내려가던 등잔, 기억나? 그건 내가 띄운 거야. 길 잃은 혼이 마을로 돌아오라고.`},
    {w:'me',t:`돌아온 혼은 어디로 가지.`},
    {w:'seol',t:`…등불 속으로.`}]},
  {t:'저승의 쇠',lv:28,type:'talk',npc:'smith',end:()=>[
    {w:'smith',t:'명부에 제물이라고 적혀 있었다고? ……'},
    {w:'smith',t:'솔직히 말하마. 그 등잔 틀, 쇠에 피를 먹여 달라고 했어. 굿에 쓸 거라면서.'},
    {w:'smith',t:'난 돈을 받았고, 묻지 않았지. 그게 내 죄다.'},
    {w:'me',t:'그럼 당신은 왜 살아 있지?'},
    {w:'smith',t:'…그 밤에 나는 대장간 화로 앞에 있었어. 등불이 닿지 않는 곳에. 그게 다야.'}]},
  {t:'단련된 쇠',type:'enh',n:8,hint:'저승의 쇠로 장비를 +8까지 강화하자',end:()=>[
    {w:'smith',t:`저승 쇠가 이제 좀 말을 듣는구먼. 여덟 번 두드린 쇠는 쉽게 부러지지 않아.`}]},
  {t:'장비의 격',type:'eqg',g:2,n:6,lv:29,hint:'매직 이상 장비 6부위를 착용하자 · 등급이 한 단계 높으면 장비 레벨 3 높은 것과 비슷하다',end:()=>[
    {w:'smith',t:'이제야 갖춰 입었구먼. 망자도 옷이 날개야.'},
    {w:'smith',t:'좋은 쇠는 강한 놈들한테서 나와. 더 깊이 들어가서 더 무거운 쇠를 찾아.'}]},
  {t:'나루터의 의뢰',lv:30,type:'bounty',n:2,end:()=>[
    {w:'n',t:`의뢰를 마치고 돌아오니 게시판 한쪽에 누군가 서툰 글씨로 "고맙소"라고 적어 두었다.`}]},
  {t:'저승차사의 그림자',type:'mob',map:'river',mob:'chasa',n:15,lv:31,end:()=>[
    {w:'n',t:'갓을 쓴 그림자들은 쓰러지면서도 명부를 놓지 않았다. 펼쳐진 쪽마다 같은 이름 위에 붉은 줄이 그어져 있었다.'},
    {w:'me',t:`${pl.name}… 내 이름이다. 지워지고, 다시 쓰이고, 또 지워졌다.`}]},
  {t:'노잣돈',type:'talk',npc:'merch',lv:32,hint:'잡화점의 떠돌이 상인 묘를 찾아가자',end:()=>[
    {w:'merch',t:'나루터에 다녀왔구나. 강바닥에 엽전이 많지? 노잣돈이야. 망자가 배 삯으로 내는 거.'},
    {w:'merch',t:'그런데 이상하지. 청등마을 백서른두 명 몫의 노잣돈은 한 푼도 없었어. 배를 타지 못했다는 뜻이야.'},
    {w:'me',t:'등불 속에 갇혀 있으니까.'},
    {w:'merch',t:'그렇지. 나는 장사꾼이라 계산이 빨라. 혼 백서른둘이 등불에 묶였고, 하나는 배에서 내렸어. 그 하나가 지금 내 앞에 서 있고.'}]},
  {t:'사공의 노래',type:'kill',map:'river',n:150,lv:34,end:()=>[
    {w:'n',t:`강 건너편에서 노 젓는 소리가 들렸다. 박자에 맞춰 누군가 이름을 부르고 있었다. 내 이름을.`}]},
  {t:'강물에 비친 얼굴',type:'collect',map:'river',n:12,item:'젖은 등잔',p:.18,lv:35,end:()=>[
    {w:'n',t:'건져 올린 등잔마다 불씨가 하나씩 남아 있었다. 손을 대자 짧은 기억이 스쳤다.'},
    {w:'n',t:'— 붉은 달 아래, 마당 한가운데 선 소녀. 떨리는 손으로 등불을 하나씩 켜며, 누군가의 이름을 부르고 있었다.'},
    {w:'me',t:'설화의 목소리였다. 부르던 이름은… 내 이름이었다.'}]},
  {t:'명부에 덧쓴 글씨',type:'boss',map:'river',boss:'reaper',lv:37,end:()=>[
    {w:'reaper',t:'멈춰라. 나는 너를 데려갈 수 없다.'},
    {w:'reaper',t:'명부를 보아라. 네 이름은 사흘 전에 이미 지워졌다. 그런데 그 옆에, 산 자의 손으로 덧쓴 글씨가 있지.'},
    {w:'me',t:'누구의 글씨냐.'},
    {w:'reaper',t:'마을 백서른두 명의 혼을 값으로 치른 자. 네가 가장 잘 아는 얼굴이다.'}]},
  {t:'등불은 무엇으로 타는가',lv:38,type:'talk',npc:'seol',end:()=>[
    {w:'me',t:'마을 사람들은 어디 있지, 설화.'},
    {w:'seol',t:'……'},
    {w:'seol',t:'저 푸른 등불. 다 무엇으로 타고 있는지, 정말 몰랐어?'},
    {w:'n',t:'등불 속에서 낯익은 얼굴들이 소리 없이 비명을 지르고 있었다.'},
    {w:'seol',t:'넌 내 오라비야. 사흘 전 밤에 죽었지. 그래서 다시 불렀어. 백서른두 개의 혼을 태워서.'},
    {w:'seol',t:'원망해도 좋아. 대신 늪의 이무기를 죽여 줘. 그게 혈월의 문을 지키고 있어. 그것만 없애면 다 끝낼 수 있어.'}]},
  {t:'꺼지지 않는 분노',type:'kill',map:'river',n:100,lv:39,end:()=>[
    {w:'n',t:'칼을 휘두를 때마다 등불 속 얼굴들이 떠올랐다. 대장장이의 아내, 방앗간 집 아이들.'},
    {w:'me',t:'설화를 미워해야 하는데. …미워지지가 않는다.'},
    {w:'n',t:'분노는 갈 곳을 잃고 강물 위의 원혼들에게로 쏟아졌다. 검은 강이 조용해질 때까지.'}]},
  {t:'타오르는 등불 아래',type:'lv',lv:41,end:()=>[
    {w:'n',t:'밤마다 등불이 조금씩 어두워졌다. 그 안의 얼굴들이 하나둘 사라지고 있었다.'},
    {w:'seol',t:'시간이 없어. 등불이 다 꺼지면… 너도 같이 꺼져.'}]},
  {t:'늪의 독기',type:'kill',map:'swamp',n:100,lv:41,st:()=>[{w:'merch',t:'늪에 간다고? 숨은 참지 마. 망자는 숨을 안 쉬어도 독은 들어오거든. 회복약 넉넉히 챙겨.'}],end:()=>[
    {w:'n',t:'늪 바닥에서 거대한 무언가가 숨을 쉬었다. 물거품이 터질 때마다 비린 피 냄새가 올라왔다.'}]},
  {t:'독사의 둥지',type:'mob',map:'swamp',mob:'snake',n:30,lv:43,end:()=>[
    {w:'n',t:'독사들은 늪 한가운데를 향해 똬리를 틀고 있었다. 무언가를 지키듯이, 혹은 무언가에게 절하듯이.'}]},
  {t:'묵린의 비늘',lv:44,type:'collect',map:'swamp',n:20,item:'이무기 비늘',p:.15,end:()=>[
    {w:'n',t:'비늘마다 오래된 봉인 문양이 새겨져 있었다. 누군가 이무기를 이곳에 묶어 둔 것이다.'},
    {w:'me',t:'문을 지키는 게 아니라… 묶여 있는 거라면?'}]},
  {t:'떠돌이 상인의 거래',lv:45,type:'talk',npc:'merch',end:()=>[
    {w:'merch',t:'이무기 비늘이라… 귀한 걸 들고 왔네. 사겠다곤 안 할게. 대신 이야기 하나 해 주지.'},
    {w:'merch',t:'사흘 전에 그 무녀가 나한테서 굿 하나를 샀어. "죽은 자를 다시 부르는 굿". 대가는 혼 백서른셋.'},
    {w:'me',t:'백서른둘이 아니라?'},
    {w:'merch',t:'하나가 모자랐지. 그래서 아직 굿이 안 끝났어. …마지막 하나가 누구일 것 같나?'}]},
  {t:'저주 무당의 굿',type:'mob',map:'swamp',mob:'shaman',n:20,lv:46,end:()=>[
    {w:'n',t:'저주 무당들은 쓰러지면서 같은 장단을 두드렸다. 설화가 혈월 첫날 밤에 쳤다는 그 장단이었다.'},
    {w:'me',t:'같은 굿이다. 누군가 이 늪에서 먼저 같은 굿을 했다.'}]},
  {t:'늪지기',lv:47,type:'elite',map:'swamp',n:10,end:()=>[
    {w:'n',t:'늪지기들이 쓰러지자 늪 한가운데의 물이 소용돌이치기 시작했다.'}]},
  {t:'레어의 빛',type:'eqg',g:3,n:6,lv:48,hint:'레어 이상 장비 6부위를 착용하자',end:()=>[
    {w:'smith',t:'노란 빛이 도는 쇠로군. 레어야. 늪 바닥 놈들이 이런 걸 품고 있었다니.'}]},
  {t:'독무 속의 길',type:'lv',lv:50,end:()=>[
    {w:'merch',t:`늪 깊은 곳은 독무가 짙어. 몸이 버틸 만큼 단단해진 다음에 들어가라고. 장사는 살아 있는 손님이랑 해야 남거든.`}]},
  {t:'늪가 마을의 아이',type:'talk',npc:'seol',lv:51,hint:'청등마을의 무녀 설화에게 돌아가자',st:()=>[
    {w:'n',t:'마을 어귀의 등불 하나가 유난히 흔들렸다. 그 안에서 작은 손이 유리를 두드리고 있었다.'}],end:()=>[
    {w:'yeon',t:'아저씨… 아니, 오라버니. 나 연이야. 방앗간 집 연이.'},
    {w:'yeon',t:'등불 안은 따뜻해. 근데 너무 밝아서 잠을 못 자. 다들 그래.'},
    {w:'seol',t:'……연아. 조금만 더 참아. 금방 끝나.'},
    {w:'yeon',t:'설화 언니는 맨날 그 말만 해. 근데 언니 손이 맨날 떨려.'},
    {w:'me',t:'끝내겠다. 반드시. 그때까지 버텨, 연아.'}]},
  {t:'도깨비 장터',type:'mob',map:'swamp',mob:'goblin',n:30,lv:52,end:()=>[
    {w:'n',t:'늪의 도깨비들은 혼을 사고팔고 있었다. 저울 한쪽에는 등불이, 다른 쪽에는 금화가 놓여 있었다.'},
    {w:'merch',t:'(멀리서) 거기 도깨비들, 내 단골이야. 너무 많이 패지 마. 장사 망해.'}]},
  {t:'되살아난 비늘',type:'kill',map:'swamp',n:200,lv:53,end:()=>[
    {w:'n',t:`쓰러뜨린 독사들이 늪 속으로 가라앉았다가, 비늘 하나 다르지 않은 모습으로 다시 떠올랐다.`},
    {w:'me',t:`늪 바닥의 무언가가 계속 되살리고 있다.`}]},
  {t:'늪의 의뢰',lv:54,type:'bounty',n:2,end:()=>[
    {w:'n',t:`늪가 마을의 마지막 의뢰였다. 의뢰인의 이름 옆에는 이미 검은 줄이 그어져 있었다.`}]},
  {t:'봉인 문양',type:'collect',map:'swamp',n:15,item:'봉인 문양 조각',p:.15,lv:55,end:()=>[
    {w:'n',t:'문양 조각을 맞추자 늪 바닥 전체에 걸친 거대한 봉인진이 그려졌다. 가운데는 비어 있었다.'},
    {w:'me',t:'이무기는 봉인의 주인이 아니다. 봉인의 일부다. 무언가를 막는 빗장.'}]},
  {t:'대장장이의 고백',type:'talk',npc:'smith',lv:56,hint:'대장장이 강쇠를 찾아가자',end:()=>[
    {w:'smith',t:'…술 한잔하자. 망자도 마실 수 있겠지.'},
    {w:'smith',t:'혈월 첫날 밤, 나는 화로 앞에 있었다고 했지. 거짓말이야. 굿판에 있었어. 마누라 손을 잡고.'},
    {w:'smith',t:'등불이 켜지는 순간 마누라가 내 손을 놓았어. 아니, 내가 놓았지. 뜨거워서. …그래서 나만 살았다.'},
    {w:'me',t:'……'},
    {w:'smith',t:'그러니 무녀를 너무 미워하지 마라. 그 밤에 손을 놓은 건 나도 마찬가지니까.'}]},
  {t:'늪 아래 잠든 것',type:'boss',map:'swamp',boss:'imugi',lv:57,end:()=>[
    {w:'imugi',t:'어리석은 것… 나는 문을 지킨 게 아니다. 막고 있었던 것이다.'},
    {w:'imugi',t:'그 계집이 너를 살린 줄 아느냐? 너라는 그릇에 혈월왕을 담으려는 것이다.'},
    {w:'n',t:'늪이 갈라지고 하늘의 달이 한층 더 붉어졌다. 멀리서 궁궐 문이 열리는 소리가 들렸다.'}]},
  {t:'그릇',lv:58,type:'talk',npc:'seol',end:()=>[
    {w:'me',t:'백서른셋 번째 혼. 그게 나였나.'},
    {w:'seol',t:'아니야! 처음엔… 처음엔 정말 오라버니를 돌려받고 싶었을 뿐이야.'},
    {w:'seol',t:'그런데 굿이 끝나지 않았어. 달이 대답했어. "그릇을 바치면 오라비를 돌려주마."'},
    {w:'seol',t:'…미안해. 궁궐로 가. 혈월왕을 죽여 줘. 그러면 내가 마지막 혼이 될게.'}]},
  {t:'붉어지는 달',type:'kill',map:'swamp',n:120,lv:59,end:()=>[
    {w:'n',t:'이무기가 사라진 늪 위로 달이 한층 더 붉어졌다. 늪물이 핏빛으로 물들며 궁궐 쪽으로 흘러갔다.'},
    {w:'king',t:'(바람 속의 목소리) 빗장이 하나 빠졌구나. 고맙다, 나의 그릇.'}]},
  {t:'핏빛 궁궐의 문',type:'lv',lv:61,end:()=>[
    {w:'n',t:'궁궐로 가는 길 위에 붉은 비가 내렸다. 빗방울 하나하나가 따뜻했다.'}]},
  {t:'궁궐의 혈귀',type:'kill',map:'palace',n:150,lv:61,st:()=>[{w:'n',t:'궁궐 정문에 걸린 현판의 글씨는 피로 쓰여 있었다. 「혈월궁(血月宮)」.'},{w:'king',t:'(어디선가) 들어오너라. 문은 처음부터 너를 위해 열어 두었다.'}],end:()=>[
    {w:'n',t:'혈귀들은 모두 같은 옷을 입고 있었다. 사흘 전 굿판에 섰던 마을 사람들의 옷이었다.'}]},
  {t:'혈귀 사냥',type:'mob',map:'palace',mob:'blood',n:30,lv:63,end:()=>[
    {w:'n',t:'혈귀들은 마을 사람들의 옷을 입고 있었지만 얼굴은 모두 같았다. 혈월왕의 얼굴이었다.'}]},
  {t:'달의 파편',lv:64,type:'collect',map:'palace',n:25,item:'혈월의 파편',p:.12,end:()=>[
    {w:'n',t:'모은 파편을 손에 쥐자 귓가에 목소리가 울렸다.'},
    {w:'king',t:'왔구나, 나의 그릇. 그 몸은 처음부터 내 것이었다.'}]},
  {t:'혈위대',lv:65,type:'elite',map:'palace',n:12,end:()=>[
    {w:'n',t:'호위들이 무너지자 옥좌로 가는 계단이 핏물에 잠긴 채 드러났다.'}]},
  {t:'궁녀의 혼',type:'talk',npc:'seol',lv:66,hint:'청등마을의 무녀 설화에게 궁궐 이야기를 하자',end:()=>[
    {w:'me',t:'궁궐에서 궁녀의 혼을 만났다. 이백 년 전에도 누군가 같은 굿을 했다더군. 오라비를 살리려고.'},
    {w:'seol',t:'……그 사람은 어떻게 됐어?'},
    {w:'me',t:'오라비는 돌아왔다. 혈월왕의 그릇이 되어서. 그리고 나라 하나가 사라졌다.'},
    {w:'seol',t:'알고 있었어. 할머니가 말해 줬거든. 그래도… 그래도 했어. 오라버니가 없는 세상은 등불이 다 켜져 있어도 깜깜했으니까.'}]},
  {t:'명장의 칼날',lv:67,type:'enh',n:12,end:()=>[
    {w:'smith',t:'열두 번을 버틴 쇠다. 이 정도면 달도 벨 수 있겠어.'},
    {w:'smith',t:'돌아오면 술 한잔하자. 산 사람이든 죽은 사람이든.'}]},
  {t:'궁궐 수비대',type:'mob',map:'palace',mob:'archer',n:30,lv:68,end:()=>[
    {w:'n',t:'성벽 위의 백골 궁수들이 하나둘 무너졌다. 그들이 지키던 것은 바깥이 아니라 안쪽이었다.'}]},
  {t:'피의 연회',type:'lv',lv:70,end:()=>[
    {w:'n',t:`궁궐 연회장에는 차려진 음식이 썩지도 않고 그대로였다. 의자마다 혈귀가 앉아 같은 잔을 들고 있었다.`},
    {w:'king',t:`손님이 왔구나. 앉아라, 그릇아. 네 자리는 늘 비워 두었다.`}]},
  {t:'유니크의 무게',type:'eqg',g:4,n:6,lv:71,hint:'유니크 이상 장비 6부위를 착용하자',end:()=>[
    {w:'smith',t:'보랏빛 쇠. 유니크로군. 이 정도면 왕의 옷자락쯤은 벨 수 있겠어.'}]},
  {t:'다섯 번의 토벌',lv:72,type:'bossAny',n:5,end:()=>[
    {w:'smith',t:'보스 놈들을 다섯이나 베고 왔다고? 그 칼, 이제 왕의 목에도 들어가겠군.'},
    {w:'smith',t:'…무녀를 너무 미워하진 마라. 그 아이도 그 밤에 반쯤은 죽었으니까.'}]},
  {t:'차사의 경고',type:'mob',map:'palace',mob:'chasa',n:25,lv:73,end:()=>[
    {w:'reaper',t:'멈춰라, 망자여. 옥좌에 앉은 것은 왕이 아니다. 달이 빚은 껍데기다.'},
    {w:'reaper',t:'껍데기를 부수면 알맹이는 땅 아래로 숨는다. 그 아래에는 더 오래된 것이 잠들어 있고.'},
    {w:'me',t:'그래도 간다.'},
    {w:'reaper',t:'…그래, 너는 늘 그렇게 말했지. 명부에 적힌 그대로다.'}]},
  {t:'궁궐 깊은 곳',type:'kill',map:'palace',n:250,lv:74,end:()=>[
    {w:'n',t:`옥좌로 이어지는 복도의 촛불이 모두 붉게 타올랐다.`}]},
  {t:'옥좌의 그림자',type:'collect',map:'palace',n:15,item:'혈월왕의 봉인편',p:.12,lv:75,end:()=>[
    {w:'n',t:'봉인편에는 혈월왕을 처음 불러낸 굿의 기록이 적혀 있었다. 굿을 한 자의 이름은 지워져 있었다.'},
    {w:'n',t:'다만 끝에 한 줄. "그릇은 스스로 원할 때에만 채워진다."'},
    {w:'me',t:'…그렇다면 내가 원하지 않는 한, 놈은 나를 가질 수 없다.'}]},
  {t:'왕의 목소리',type:'talk',npc:'merch',lv:76,hint:'잡화점의 떠돌이 상인 묘를 찾아가자',end:()=>[
    {w:'merch',t:'왕한테 가는구나. 그 전에 하나만 팔게. 공짜로.'},
    {w:'merch',t:'혈월왕은 약속으로 움직여. 무녀와 맺은 약속 — "오라비를 돌려준다". 놈은 그걸 지켰어. 너를 돌려줬잖아.'},
    {w:'merch',t:'그러니 놈을 쓰러뜨리는 건 약속을 깨는 게 아니야. 이미 끝난 거래를 정리하는 거지. 장사꾼 말 믿어.'},
    {w:'me',t:'당신은 대체 뭐지.'},
    {w:'merch',t:'떠돌이 상인. 이 산에서 거래가 있는 곳엔 늘 내가 있어. 이백 년 전에도 그랬고.'}]},
  {t:'핏빛 달 아래',type:'boss',map:'palace',boss:'bloodking',lv:77,end:()=>[
    {w:'king',t:'그릇이 주인을 거부하는구나. 재미있다.'},
    {w:'seol',t:'오라버니! …이건, 이건 내가 원한 게 아니었어!'},
    {w:'king',t:'원했지. 오라비를 돌려 달라 빌던 네 목소리를 아직 기억한다. 대가는 받아야겠다… 이번엔 영원히.'},
    {w:'n',t:'혈월왕의 형체가 무너져 내리며 땅 아래, 바닥 없는 심연으로 스며들었다.'},
    {w:'n',t:'그가 사라진 자리, 무너진 옥좌 뒤로 차가운 바람이 새어 나오는 좁은 통로가 드러났다.'},
    {w:'n',t:'통로 깊은 곳에서… 금이 간 범종 소리가 한 번, 낮게 울렸다.'}]},
  {t:'옥좌 뒤의 통로',lv:78,type:'talk',npc:'seol',end:()=>[
    {w:'me',t:'옥좌 뒤에 길이 있었다. 그 끝에서 종소리가 들렸어.'},
    {w:'seol',t:'…봉인된 터. 궁궐이 세워지기 훨씬 전, 그 자리에 있던 옛 사찰이야.'},
    {w:'seol',t:'스님들이 무언가를 땅 아래 가두고, 그 위에 궁궐을 올려 입구를 덮어 버렸대. 아무도 다시는 내려가지 못하도록.'},
    {w:'seol',t:'혈월왕이 무너지면서 덮개가 열린 거야. 거긴 혈귀들보다 훨씬 오래된 것들이 지키고 있어. 조심해.'}]},
  {t:'무너진 궁궐',type:'kill',map:'palace',n:150,lv:79,end:()=>[
    {w:'n',t:'왕이 사라진 궁궐에서 혈귀들은 갈 곳을 잃고 서로를 물어뜯었다. 옥좌 뒤 통로에서는 차가운 바람이 계속 새어 나왔다.'}]},
  {t:'봉인된 터',type:'kill',map:'sealed',n:150,lv:81,st:()=>[{w:'n',t:'옥좌 뒤의 통로는 끝없이 아래로 이어졌다. 내려갈수록 종소리가 가까워졌다.'},{w:'seol',t:'(머리카락 부적에서 들리는 목소리) …조심해. 거기서부터는 내 등불도 닿지 않아.'}],end:()=>[
    {w:'n',t:'무너진 법당 기둥마다 붉은 부적이 겹겹이 붙어 있었다. 모두 안쪽을 향해, 무언가를 밀어 넣듯이.'},
    {w:'n',t:'망자들은 사찰 마당을 넘지 않았다. 마치 그 아래 있는 것이 두려운 듯이.'}]},
  {t:'강시 승병',type:'mob',map:'sealed',mob:'jiangshi',n:30,lv:83,end:()=>[
    {w:'n',t:'승복을 입은 강시들이었다. 이마의 부적은 스스로 붙인 것이었다. 죽어서도 봉인을 지키겠다는 맹세.'},
    {w:'me',t:'…쉬어라. 이제는 내가 지킨다.'}]},
  {t:'깨진 범종',lv:84,type:'collect',map:'sealed',n:20,item:'깨진 범종 조각',p:.14,end:()=>[

function q4Of(o){if(!o.qv)return QMIG[Math.min(o.q||0,QMIG.length-1)];if(o.qv<4&&(o.q||0)>=QINS_AT)return (o.q||0)+QINS_N;return o.q||0}

function setCount(cls){return SLOTS.filter(sl=>pl.gear[sl]&&!pl.gear[sl].broken&&pl.gear[sl].set===(cls||pl.cls)).length}

function rngMul(){return 1+(setCount()>=4?.5:0)+pasV('rng')}
function cdAtkMul(){return (setCount()>=4?.8:1)*(1-pasV('cdr'))}

function hit(e,dmg,o,sx,sy){if(e.dead)return;o=o||{};const mine=!o.src,S=o.src||pl.d;
  const cr=!o.fix&&((mine&&pl.buffs.blade>0)||Math.random()*100<S.crit+(mine&&pl.buffs.r_amp>0?20:0));
  let d=dmg*(cr?S.critd/100:1)*rnd(.92,1.08)*(e.groggy>0?1.5:1);
  if(mine&&!o.fix)d*=relDmgMul(e);
  /* V018 패시브 「꿰뚫는 일격」: 방어·저항을 무시하는 관통 피해 */
  const pen=mine?pasV('pen'):0,td=pen>0?d*pen:0;

  if(o.slow)e.slow=Math.max(e.slow,o.slow);

function qPct(q){switch(q.type){case'kill':case'elite':case'collect':case'bossAny':case'bounty':case'mob':case'dash':case'pot':case'dis':return[Math.min(pl.qk,q.n),q.n];

  case'lv':return[Math.min(pl.lv,q.lv),q.lv];case'enh':return[Math.min(pl.st.maxEnh,q.n),q.n];case'abyss':return[Math.min(pl.abyss,q.n),q.n];
  case'gear':return[gearCnt(0),q.n];case'gearEnh':return[gearCnt(q.e),q.n];case'boss':return G.map===q.map&&!G.boss&&bossAllowed(MAPS[q.map])?[G.gauge,GAUGE]:null;default:return null}}
function qEvent(type,data){const q=qCur();if(!q||G.qBusy||q.type==='endless')return;data=data||{};

function buildMap(id){

  G.pat=cx.createPattern(pc,'repeat');
}
function travel(id,at,opt){
  const M=MAPS[id];opt=opt||{};
  if(!opt.force&&!mapOpen(id)){toast(`<b style="color:#ff8f9d">${M.n}</b> · ${mapLockTxt(id)||'아직 갈 수 없다'}`);return false}
  if(M.endless){const t=opt.tier||G.tier||pl.abyss+1;G.tier=clamp(t|0,1,pl.abyss+1)}
  if(G.map==='raid'&&id!=='raid')raidCleanup();
  if(G.map&&G.map!==id)sfx('warp',.7);G.map=id;pl.map=M.raid?'village':id;
  G.ents=[];G.projs=[];G.eprojs=[];G.zones=[];G.teles=[];G.drops=[];G.fx=[];G.kp=[];G.turrets=[];G.parts=[];G.timers=[];G.texts=[];G.corpses=[];G.boss=null;G.gauge=0;G.target=null;pl.trail=[];pl.chan=null;G.pet=null;
  buildMap(id);
  if(at){pl.x=at[0]*M.w;pl.y=at[1]*M.h}
  else if(id==='village'){pl.x=.5*M.w;pl.y=.62*M.h}
  else if(id==='shop'){pl.x=.2*M.w;pl.y=.55*M.h}
  else{pl.x=M.w/2;pl.y=M.h/2}
  G.cam.x=pl.x-VW/ZOOM/2;G.cam.y=pl.y-VH/ZOOM/2;G.spawnT=.8;
  if(M.end)pl.st.gate++;
  const rc=recCP(id),my=myCP();
  if(M.raid){raidStart(opt.raid);save();return true}
  const lvr=mobLvOf(id),lvt=lvr[0]?` · 적 Lv.${lvr[0]}~${lvr[1]}`:'';
  banner(M.n,M.endless?`${G.tier}단계${lvt} · 권장 전투력 ${fmt(rc)}`:M.dg?`${M.boss?(bossAllowed(M)?'보스 · '+BOSSES[M.boss].n:'보스 미출현 · 임무가 이어지면 나타난다'):'보스 · 무작위'}${lvt} · 권장 ${fmt(rc)}`:M.safe?M.kind:`권장 전투력 ${fmt(rc)}${lvt}`);
  if(rc&&my<rc*.8)later(1.2,()=>toast(`<b style="color:#ff8f9d">전투력이 권장치보다 낮다</b> · ${fmt(my)} / ${fmt(rc)}`));
  save();return true}

   case'sel':G.sel=G.sel===id?null:id;break;
   case'eq':if(it){equipItem(it);toast(`<b style="color:${GRADES[it.g].c}">${esc(it.name)}</b> 착용`)}break;
   case'uneq':if(it)unequip(it);break;
   case'lock':if(it)it.lock=!it.lock;break;

   case'stashsort':ROOT.stash.sort((x,y)=>SLOTS.indexOf(x.slot)-SLOTS.indexOf(y.slot)||y.g-x.g||y.ilv-x.ilv);break;

/* 기본 음원: 오실레이터 하나 (o: to 주파수 미끄러짐, lp 저역통과, a 어택, rev 잔향, dest 출력, vib 비브라토) */
function sOsc(type,f,t,dur,vol,o){o=o||{};const c=SND.ctx,os=c.createOscillator(),g=c.createGain();os.type=type;os.frequency.setValueAtTime(f,t);
  if(o.to)os.frequency.exponentialRampToValueAtTime(Math.max(20,o.to),t+(o.slide||dur));if(o.det)os.detune.value=o.det;
  let node=os;if(o.lp){const fl=c.createBiquadFilter();fl.type='lowpass';fl.frequency.setValueAtTime(o.lp,t);if(o.lpTo)fl.frequency.exponentialRampToValueAtTime(o.lpTo,t+dur*.8);fl.Q.value=o.q||.7;os.connect(fl);node=fl}
  if(o.vib){const l=c.createOscillator(),lg=c.createGain();l.frequency.value=o.vib;lg.gain.setValueAtTime(0,t);lg.gain.linearRampToValueAtTime(f*.006,t+Math.min(.3,dur*.5));l.connect(lg);lg.connect(os.frequency);l.start(t);l.stop(t+dur+.05)}
  node.connect(g);const a=o.a??.005;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+a);
  if(o.sus){g.gain.setValueAtTime(vol,t+Math.max(a,dur-o.sus));}g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  g.connect(o.dest||SND.sfxG);sRev(g,o.rev);os.start(t);os.stop(t+dur+.05)}
/* 잡음 음원: 필터를 거친 백색 잡음 (ft 필터 종류, f→to 주파수 이동, q) */
function sNoi(t,dur,vol,o){o=o||{};const c=SND.ctx,src=c.createBufferSource(),fl=c.createBiquadFilter(),g=c.createGain();src.buffer=SND.noise;
  fl.type=o.ft||'bandpass';fl.frequency.setValueAtTime(o.f||1000,t);if(o.to)fl.frequency.exponentialRampToValueAtTime(o.to,t+dur);fl.Q.value=o.q||1;
  src.connect(fl);fl.connect(g);const a=o.a??.004;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+a);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  g.connect(o.dest||SND.sfxG);sRev(g,o.rev);src.start(t,Math.random()*1.5);src.stop(t+dur+.05)}
function sBell(f,t,vol,dur,dest,rev){[[1,1],[2.76,.45],[5.4,.22],[8.9,.1]].forEach(([m,a],i)=>sOsc('sine',f*m,t,dur/(1+i*.6),vol*a,{a:.003,dest,rev:rev??.5}))}
function sGong(f,t,vol,dur,dest){[[1,1],[1.48,.6],[2.12,.4],[2.73,.3],[3.9,.15]].forEach(([m,a],i)=>sOsc('sine',f*m,t,dur*(1-i*.12),vol*a,{a:.01,dest,rev:.6,to:f*m*.985,slide:dur}))}
const SFX={
  /* 전사 */
  slash(t,v){sNoi(t,.2,.55*v,{f:3400,to:500,q:1.4});sOsc('sawtooth',260,t,.12,.1*v,{to:90,lp:1100})},
  slam(t,v){sOsc('sine',120,t,.6,.9*v,{to:32});sNoi(t,.55,.6*v,{ft:'lowpass',f:1200,to:90});sNoi(t+.03,.25,.25*v,{f:600,q:.6,rev:.3})},
  gong(t,v){sGong(196,t,.45*v,2.4);sNoi(t,.12,.2*v,{ft:'highpass',f:3000})},
  whirl(t,v){for(let i=0;i<4;i++)sNoi(t+i*.12,.22,.7*v,{f:900,to:3200,q:2.5})},
  ghost(t,v){sNoi(t,.35,.6*v,{f:2600,to:300,q:1.6,rev:.3});sOsc('sawtooth',110,t,.7,.18*v,{to:40,lp:600});sOsc('sine',70,t+.05,.6,.6*v,{to:30})},
  /* 궁수 */
  arrow(t,v){sOsc('triangle',820,t,.08,.16*v,{to:330});sNoi(t+.01,.13,.3*v,{ft:'highpass',f:2400,to:6500})},
  scatter(t,v){for(let i=0;i<3;i++)SFX.arrow(t+i*.035,v*.8)},
  pierce(t,v){SFX.arrow(t,v);sOsc('sine',2000,t+.02,.35,.12*v,{to:700})},
  rain(t,v){for(let i=0;i<10;i++)sNoi(t+i*.05+Math.random()*.03,.1,.18*v,{ft:'highpass',f:3000+Math.random()*2000})},
  thunder(t,v){sNoi(t,.06,.7*v,{ft:'highpass',f:2000});sNoi(t+.03,1.1,.7*v,{ft:'lowpass',f:1800,to:80,rev:.4});sOsc('sine',60,t,.8,.5*v,{to:28})},
  /* 마법사 */
  foxfire(t,v){sOsc('sine',520,t,.3,.2*v,{to:1300,rev:.4});sOsc('triangle',780,t+.04,.25,.08*v,{to:1700});sNoi(t,.2,.12*v,{f:1800,q:3})},
  ice(t,v){[2093,2637,3136,3951].forEach((f,i)=>sOsc('sine',f,t+i*.03,.5,.08*v,{rev:.5}));sNoi(t,.4,.25*v,{ft:'highpass',f:5000})},
  talisman(t,v){sNoi(t,.12,.35*v,{f:1500,q:4});sNoi(t+.18,.35,.6*v,{ft:'lowpass',f:2000,to:150});sOsc('sine',140,t+.18,.35,.5*v,{to:50})},
  cloud(t,v){sNoi(t,1.4,.45*v,{ft:'lowpass',f:500,to:120,a:.15,rev:.5});SFX.thunder(t+.5,v*.6)},
  dragon(t,v){sOsc('sawtooth',90,t,1.1,.22*v,{to:45,lp:500,a:.08});sOsc('sine',55,t+.5,1,.8*v,{to:25});sNoi(t+.5,1,.7*v,{ft:'lowpass',f:1500,to:60,rev:.4})},
  /* 힐러 */
  orb(t,v){sBell(1047,t,.12*v,.8);sOsc('sine',1568,t,.3,.05*v)},
  heal(t,v){[523,659,784,1047].forEach((f,i)=>sBell(f,t+i*.07,.1*v,1.2))},
  cross(t,v){sNoi(t,.3,.35*v,{f:700,to:2500,q:2});sBell(784,t+.05,.12*v,1)},
  bless(t,v){sGong(392,t,.25*v,2.2);[1047,1319,1568].forEach((f,i)=>sBell(f,t+.1+i*.09,.07*v,1.4))},
  smite(t,v){sBell(659,t,.18*v,1.5);sOsc('sine',100,t+.08,.6,.7*v,{to:40});sNoi(t+.08,.5,.45*v,{ft:'lowpass',f:2400,to:200,rev:.4})},
  /* 공용 */
  hurt(t,v){sOsc('sine',190,t,.16,.7*v,{to:55});sNoi(t,.12,.45*v,{ft:'lowpass',f:900,to:200});sOsc('square',95,t,.07,.06*v,{lp:400})},
  dash(t,v){sNoi(t,.24,.75*v,{f:600,to:3200,q:1.8})},
  pot(t,v){for(let i=0;i<5;i++)sOsc('sine',350+i*110+Math.random()*60,t+i*.05,.09,.16*v,{to:700+i*150});sBell(1319,t+.28,.06*v,.8)},
  lvl(t,v){[587,740,880,1175,1480].forEach((f,i)=>sBell(f,t+i*.08,.12*v,1.6))},
  boom(t,v){sOsc('sine',70,t,1.2,.9*v,{to:28});sNoi(t,1.2,.5*v,{ft:'lowpass',f:700,to:50,rev:.5})},
  drop(t,v){sBell(1568,t,.1*v,1);sBell(2093,t+.08,.08*v,1.2)},
  ui(t,v){sOsc('triangle',1200,t,.05,.06*v,{to:900})},
  /* V004 추가 효과음 */
  hit(t,v){sNoi(t,.06,.22*v,{f:1600,q:1.5});sOsc('sine',260,t,.07,.12*v,{to:120})},
  crit(t,v){sNoi(t,.09,.35*v,{f:3200,q:2});sOsc('square',520,t,.08,.06*v,{to:180,lp:2000});sOsc('sine',140,t,.12,.25*v,{to:60})},
  kill(t,v){sNoi(t,.3,.22*v,{f:900,to:200,q:.8,rev:.3});sOsc('sine',220,t,.25,.12*v,{to:70})},
  bossIn(t,v){sGong(98,t,.5*v,3.2);sOsc('sine',55,t,1.6,.6*v,{to:40,a:.2});for(let i=0;i<3;i++)sOsc('sine',90,t+.5+i*.35,.4,.5*v,{to:42})},
  bossDie(t,v){SFX.boom(t,v);sGong(147,t+.3,.4*v,3);[523,659,784].forEach((f,i)=>sBell(f,t+.9+i*.12,.1*v,1.8))},
  coin(t,v){sOsc('triangle',1800,t,.08,.08*v);sOsc('triangle',2400,t+.05,.12,.07*v)},
  pick(t,v){sOsc('sine',660,t,.08,.08*v,{to:990})},
  enhOk(t,v){[784,988,1175,1568].forEach((f,i)=>sBell(f,t+i*.06,.11*v,1.4));sNoi(t,.15,.15*v,{ft:'highpass',f:5000})},
  enhFail(t,v){sOsc('sine',180,t,.35,.4*v,{to:90});sNoi(t,.2,.2*v,{ft:'lowpass',f:700})},
  shatter(t,v){for(let i=0;i<8;i++)sOsc('sine',2000+Math.random()*3000,t+i*.025,.25,.05*v,{to:900+Math.random()*600});sNoi(t,.5,.4*v,{ft:'highpass',f:2500,to:6000});sOsc('sine',120,t,.4,.4*v,{to:50})},
  quest(t,v){[523,659,784,1047,1319].forEach((f,i)=>sBell(f,t+i*.09,.1*v,1.6))},
  death(t,v){sOsc('sine',220,t,1.6,.35*v,{to:55,a:.05,rev:.5});sNoi(t,1.4,.25*v,{ft:'lowpass',f:600,to:80,rev:.4})},
  warp(t,v){sNoi(t,.6,.35*v,{f:300,to:3000,q:2,rev:.4});sOsc('sine',300,t,.6,.08*v,{to:1200,rev:.4})},
  open(t,v){sNoi(t,.08,.08*v,{f:2200,q:3});sOsc('triangle',700,t,.06,.05*v,{to:1000})}};
const SKSFX={warrior:['slash','slam','gong','whirl','ghost'],archer:['arrow','scatter','pierce','rain','thunder'],mage:['foxfire','ice','talisman','cloud','dragon'],healer:['orb','heal','cross','bless','smite']};
const SFXGAP={ui:.06,item:.12,questDone:.5,hurt:.09,arrow:.05,slash:.06,orb:.06,foxfire:.06,drop:.15,hit:.06,crit:.08,kill:.07,coin:.05,pick:.08,open:.1};
/* 직접 제공된 음원이 있는 효과음: UI 터치 · 사망 · 장비 획득 · 임무 완료 (불러오기 전이거나 실패하면 합성음으로 대신한다) */
const SMP={ui:['ui',.55],death:['death',.85],item:['item',.7],questDone:['quest',.8]};
function sfx(k,v){const c=SND.ctx;if(!c||c.state!=='running'||SND.vol.mute||!SND.vol.s)return;const now=c.currentTime;if(now-(SND.last[k]||-9)<(SFXGAP[k]||.04))return;
  const sm=SMP[k];if(sm&&SND.buf[sm[0]]){SND.last[k]=now;sBuf(sm[0],now+.005,sm[1]*(v??1));return}
  const f=SFX[k]||(k==='item'?SFX.pick:k==='questDone'?SFX.quest:null);if(!f)return;SND.last[k]=now;try{f(now+.01,v??1)}catch(_){}}
/* 게임 안의 버튼·탭·메뉴를 누를 때 UI 효과음 (대쉬 버튼은 대쉬 소리만) */
document.addEventListener('pointerdown',e=>{const b=e.target.closest&&e.target.closest('button,.tab,[data-act],[data-open],select,#vn');if(b&&b.id!=='dashB')sfx('ui')},true);
function sfxSkill(cls,i,v){
  if(i===0){const c=SND.ctx;if(c&&c.state==='running'&&!SND.vol.mute&&SND.vol.s){const now=c.currentTime;if(now-(SND.last.sk1||-9)<.07)return;SND.last.sk1=now;if(sBuf('sk1',now+.005,.55*(v??1),.94+Math.random()*.12))return}}
  /* V005: 2~5번 기술은 직업별 공용 효과음 (직접 제공된 음원) */
  if(i>0){const c=SND.ctx;if(c&&c.state==='running'&&!SND.vol.mute&&SND.vol.s){const now=c.currentTime,kk='sk_'+cls;if(now-(SND.last[kk]||-9)<.1)return;SND.last[kk]=now;if(sBuf(kk,now+.005,.75*(v??1),.97+Math.random()*.06))return}}
  const k=SKSFX[cls]&&SKSFX[cls][i];if(k)sfx(k,(i===0?.55:1)*(v??1))}
/* ---- 배경음 (V004): 직접 제공된 음원 3곡 ----
   청등마을·잡화점(타이틀 포함) / 레이드를 뺀 모든 전투 던전 / 어둑시니 레이드.
   <audio>를 Web Audio 그래프에 연결해 볼륨을 조절하고(아이폰은 audio.volume을 무시한다), 바뀔 때 1.2초간 겹쳐 넘긴다 */
const BGMF={village:'snd/bgm_village.mp3',dungeon:'snd/bgm_dungeon.mp3',deep:'snd/bgm_deep2.mp3',raid:'snd/bgm_raid.mp3'};
/* V007: 혈월 궁궐 · 봉인된 터 · 무한 심연은 전용 곡(Cavernous Pulse) */
const DEEPBGM={palace:1,sealed:1,abyss:1};
SND.mus={};SND.cur='';
function bgmKey(){if(G.scene!=='play')return 'village';if(G.raid)return 'raid';const M=MAPS[G.map];return !M||M.safe?'village':DEEPBGM[G.map]?'deep':'dungeon'}
function musEl(k){let m=SND.mus[k];if(m)return m;const el=new Audio();el.loop=true;el.preload='auto';el.setAttribute('playsinline','');el.setAttribute('webkit-playsinline','');el.src=A(BGMF[k]);
  m=SND.mus[k]={el,g:null,want:0};
  try{const src=SND.ctx.createMediaElementSource(el),g=SND.ctx.createGain();g.gain.value=0;src.connect(g);g.connect(SND.bgmG);m.g=g}catch(_){el.volume=0}
  return m}
function musPlay(m){if(!m.el.paused)return;const pr=m.el.play();if(pr&&pr.catch)pr.catch(()=>{})}
function musLevel(m,v,sec){m.want=v;if(m.g){const t=SND.ctx.currentTime;m.g.gain.cancelScheduledValues(t);m.g.gain.setValueAtTime(m.g.gain.value,t);m.g.gain.linearRampToValueAtTime(v,t+sec)}
  else{const vv=SND.vol.mute?0:v*SND.vol.m*SND.vol.b;m.el.volume=Math.max(0,Math.min(1,vv))}}
/* 매 프레임: 지금 맵에 맞는 곡으로 바꾸고, 멈춘 곡은 다시 튼다 (아이폰은 첫 재생만 터치가 필요 — sndUnlock에서 처리) */
function sndTick(){const c=SND.ctx;if(!c||c.state!=='running'||document.hidden)return;const k=bgmKey();
  if(SND.cur!==k){const old=SND.mus[SND.cur];if(old){musLevel(old,0,1.2);const oe=old.el;setTimeout(()=>{if(SND.mus[SND.cur]!==old)try{oe.pause()}catch(_){}},1300)}
    SND.cur=k;const m=musEl(k);musPlay(m);musLevel(m,1,1.2)}
  else{const m=SND.mus[k];if(m&&m.el.paused&&!m.blocked)musPlay(m);else if(m&&!m.el.paused&&SND.tagOn&&SND.tag){try{SND.tag.pause()}catch(_){}SND.tagOn=false}}}
/* 효과음 표본: 모든 직업 1번 기술 공용 (직접 제공된 음원) */
SND.buf={};
function sndLoadBuf(k,path){if(SND.buf[k]!==undefined||!SND.ctx)return;SND.buf[k]=null;
  fetch(A(path)).then(r=>r.arrayBuffer()).then(ab=>new Promise((ok,no)=>SND.ctx.decodeAudioData(ab,ok,no))).then(b=>{SND.buf[k]=b}).catch(()=>{SND.buf[k]=false})}
function sBuf(k,t,vol,rate){const b=SND.buf[k];if(!b)return false;const c=SND.ctx,s=c.createBufferSource(),g=c.createGain();s.buffer=b;s.playbackRate.value=rate||1;g.gain.value=vol;s.connect(g);g.connect(SND.sfxG);s.start(t);return true}
function sndH(){const v=SND.vol,row=(k,n)=>`<label><span>${n}</span><span class="sndv"><input type="range" min="0" max="1" step="0.05" value="${v[k]}" data-snd="${k}"><b class="num">${Math.round(v[k]*100)}%</b></span></label>`;
  return `<p class="sec">사운드</p><div class="set">${row('m','전체 음량')}${row('b','배경음')}${row('s','효과음')}<label><span>음소거</span><input type="checkbox" data-snd="mute" ${v.mute?'checked':''}></label></div>
  <div class="acts"><button class="sb" data-act="sndtest">소리 테스트</button><span class="hint" id="sndSt" style="margin:0">${sndState()}</span></div>
  <p class="hint">배경음은 마을·던전·레이드 전용 곡을, 기술·UI·사망·장비 획득·임무 완료는 전용 효과음을 쓴다. 아이폰에서 소리가 안 나면 「소리 테스트」를 한 번 누르고, 볼륨 버튼으로 미디어 음량을 올려 보자.</p>`}
function sndState(){const c=SND.ctx;return !c?'소리 꺼짐 (화면을 한 번 터치하면 켜진다)':c.state==='running'?'소리 켜짐':'소리 대기 중 · 화면을 터치하자'}
document.addEventListener('change',e=>{if(e.target.dataset&&e.target.dataset.gfx){setGfx(e.target.value);toast(`그래픽 품질 · ${GFX.n}`)}});
document.addEventListener('input',e=>{const k=e.target.dataset&&e.target.dataset.snd;if(!k)return;sndInit();
  if(k==='mute')SND.vol.mute=e.target.checked;else{SND.vol[k]=+e.target.value;const b=e.target.nextElementSibling;if(b)b.textContent=Math.round(SND.vol[k]*100)+'%';if(k==='s')sfx('orb')}
  sndVol();sndSave()});

/* ================= loop ================= */
let last=performance.now();
let errN=0;
function frame(now){
  /* v2: 한 프레임에서 오류가 나도 루프가 멈추지 않도록 다음 프레임을 먼저 예약한다 */
  requestAnimationFrame(frame);
  /* V006: 초당 그리기 횟수 상한. 메뉴·대화창이 열려 멈춰 있을 때는 초당 15번만 다시 그린다 */
  const idle=G.scene==='play'&&(G.modal||G.ctlEdit),cap=idle?15:G.vn?Math.min(30,GFX.fps):GFX.fps;
  if(now-last<1000/cap-3)return;
  const dt=Math.min(.05,(now-last)/1000);last=now;
  try{sndTick()}catch(_){}
  try{if(G.scene==='play'){if(!G.modal&&!G.vn&&!G.ctlEdit)update(dt);if(G.vn)vnTick(dt);drawWorld();hudTick(dt)}
  else{G.t+=dt;if($('#title').hidden)drawTitle(dt)}}
  catch(err){if(errN++<5)console.error(err);cx.setTransform(1,0,0,1,0,0);cx.globalAlpha=1;cx.globalCompositeOperation='source-over'}}
function boot(data){
  try{window.claude?.hot?.snapshot?.(()=>{if(G.scene==='play')save();return {inGame:G.scene==='play'}})}catch(_){}
  loadRoot();
  if(data&&data.inGame&&ROOT.active&&hasChar(ROOT.active))loadFrom(ROOT.chars[ROOT.active]);else if(data&&data.save&&data.save.cls)loadFrom(data.save);else toTitle();
  requestAnimationFrame(frame)}
try{window.claude?.hot?.ready?window.claude.hot.ready(boot):boot(window.claude?.hot?.data??{})}catch(_){boot({})}
</script>
