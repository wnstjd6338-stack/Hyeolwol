  <div class="acts"><button class="sb pri" data-act="chchar">캐릭터 적용</button><button class="sb" data-act="chheal">체력 회복</button><button class="sb${pl.god?' pri':''}" data-act="chgod">무적 ${pl.god?'켜짐':'꺼짐'}</button><button class="sb" data-act="chq">다음 임무로</button>${MAPS[G.map].dg&&!G.boss?'<button class="sb" data-act="chboss">보스 즉시 소환</button>':''}</div>
  <p class="sec">장비 만들기</p><div class="cgrid">
   <label>부위<select id="ciS">${SLOTS.map(s=>`<option value="${s}">${SLOTN[s]}</option>`).join('')}</select></label>
   <label>등급<select id="ciG">${o}</select></label>
   <label>장비 레벨<input type="number" id="ciL" min="1" value="${pl.lv}"></label>
   <label>강화<input type="number" id="ciE" min="0" max="30" value="0"></label>
   <label>세트<select id="ciSet"><option value="">없음</option>${Object.values(CLS).map(c=>`<option value="${c.id}"${c.id===pl.cls?' selected':''}>${SETN[c.id]} (${c.n})</option>`).join('')}</select></label></div>
  <div class="acts"><button class="sb pri" data-act="chitem">가방에 넣기</button><button class="sb" data-act="chset6">내 직업 6세트 한 벌 (에픽)</button></div>
  <p class="sec">재화</p><div class="cgrid">
   <label>금화<input type="number" id="cGo" min="0" value="${pl.gold}"></label><label>강화석<input type="number" id="cSt" min="0" value="${pl.stone}"></label>
   <label>혼석<input type="number" id="cSo" min="0" value="${pl.soul}"></label><label>동반자 정수<input type="number" id="cEs" min="0" value="${pl.ess}"></label>
   ${POT.map((p,i)=>`<label>${p.n}<input type="number" id="cP${i}" min="0" max="10" value="${pl.pots[i]}"></label>`).join('')}</div>
  <div class="acts"><button class="sb pri" data-act="chcur">재화 적용</button></div>`}
const numv=id=>{const v=parseInt(($('#'+id)||{}).value,10);return isFinite(v)?v:0};
$('#modal').addEventListener('click',e=>{
  if(e.target.id==='modal'){closeModal();return}
  const el=e.target.closest('[data-act]');if(!el)return;const a=el.dataset.act,id=el.dataset.id;let it=id?findItem(id):null;
  switch(a){
   case'close':closeModal();return;
   case'tab':G.bagTab=id;G.sel=null;break;
   case'sel':G.sel=G.sel===id?null:id;break;
   case'eq':if(it){equipItem(it);toast(`<b style="color:${GRADES[it.g].c}">${esc(it.name)}</b> 착용`)}break;
   case'uneq':if(it)unequip(it);break;
   case'lock':if(it)it.lock=!it.lock;break;
   case'stash':if(it&&!isEq(it)){if(ROOT.stash.length>=STASH_CAP){toast('창고가 가득 찼다');break}pl.inv.splice(pl.inv.indexOf(it),1);ROOT.stash.unshift(it);G.sel=null;toast('창고에 넣었다');save()}break;
   case'unstash':if(it&&inStash(it)){if(pl.inv.length>=INVCAP){toast('가방이 가득 찼다');break}ROOT.stash.splice(ROOT.stash.indexOf(it),1);pl.inv.unshift(it);G.sel=null;toast('가방으로 꺼냈다');save()}break;
   case'stashsort':ROOT.stash.sort((x,y)=>SLOTS.indexOf(x.slot)-SLOTS.indexOf(y.slot)||y.g-x.g||y.ilv-x.ilv);break;
   case'dis':if(it&&!it.lock&&!isEq(it)&&!inStash(it)){const y=dismantle(it);G.sel=null;toast(`해체 · 강화석 ${y.stone}${y.soul?` · 혼석 ${y.soul}`:''} · 금화 ${y.gold}`)}break;
   case'enh':if(it&&canEnh(it)){const c=enhCost(it);pl.stone-=c.stone;pl.gold-=c.gold;if(Math.random()<c.rate){it.enh++;recalc();toast(`<b style="color:#7fd88f">강화 성공</b> · ${esc(it.name)} +${it.enh}`)}else toast('<b style="color:#ff6b7d">강화 실패</b> · 재료만 사라졌다 (장비는 무사하다)');later(.1,()=>qEvent('check'))}break;
   case'autoeq':{const n=autoEquipAll();toast(n?`${n}개 부위를 더 강한 장비로 바꿨다`:'이미 가장 강한 장비를 입고 있다');break}
   case'bulkdis':{const g=+$('#disG').value;G.disG=g;let n=0,st=0,so=0;for(const x of [...pl.inv]){if(x.g<=g&&!x.lock&&!x.set&&!isUpgrade(x)){const y=dismantle(x);n++;st+=y.stone;so+=y.soul}}if(G.sel&&!findItem(G.sel))G.sel=null;toast(n?`${n}개 해체 · 강화석 ${st}${so?` · 혼석 ${so}`:''}`:'해체할 장비가 없다 (잠금·세트·더 강한 장비 제외)');break}
   case'sort':pl.inv.sort((x,y)=>SLOTS.indexOf(x.slot)-SLOTS.indexOf(y.slot)||y.g-x.g||power(y)-power(x));break;
   case'pt':{const k=el.dataset.k,n=Math.min(+el.dataset.n,pl.pts);if(n>0){pl.stats[k]+=n;pl.pts-=n;recalc()}break}
   case'resetpt':{const base={str:2,agi:2,int:2};base[CLS[pl.cls].main]+=5;const inv=pl.stats.str+pl.stats.agi+pl.stats.int-11;pl.stats=base;pl.pts+=Math.max(0,inv);recalc();break}
   case'skup':{const i=+el.dataset.i,c=skCost(pl.skl[i]);if(pl.soul>=c.soul&&pl.gold>=c.gold){pl.soul-=c.soul;pl.gold-=c.gold;pl.skl[i]++;toast(`${skillDef(i).n} Lv.${pl.skl[i]}`)}break}
   case'go':if(MAPS[id].req&&pl.lv<MAPS[id].req){travel(id);break}closeModal();travel(id);return;
   case'buy':{const s=SHOP[+el.dataset.i],p=s.p();if(pl.gold>=p){pl.gold-=p;s.buy()}break}
   case'buypot':{const i=+el.dataset.i,n=+el.dataset.n,pr=POT[i].price(pl.lv)*n;if(pl.gold>=pr&&potTotal()+n<=POT_MAX){pl.gold-=pr;pl.pots[i]+=n;toast(`${POT[i].n} ${n}개를 샀다`)}break}
   case'bacc':{if(!pl.bounty){pl.bounty=pl.board[+el.dataset.i];pl.board=null;toast(`의뢰 수락 · ${MAPS[pl.bounty.map].n}`)}break}
   case'bdrop':pl.bounty=null;break;
   case'bgo':{const m=pl.bounty&&pl.bounty.map;if(m){closeModal();travel(m)}return}
   case'claim':claimAch(el.dataset.id);break;
   case'claimall':ACH.forEach(x=>{if(pl.ach[x.id]===1)claimAch(x.id)});break;
   case'petsel':pl.pet=id;G.pet=null;toast(`${PETS[id].n}와 함께한다`);break;
   case'petup':{const lv=petLv(id),c=petCost(lv);if(lv<PET_MAX&&pl.ess>=c.ess&&pl.gold>=c.gold){pl.ess-=c.ess;pl.gold-=c.gold;pl.pets[id]=lv+1;toast(`${PETS[id].n} Lv.${lv+1}`)}break}
   case'switch':switchChar(id);return;
   case'newchar':{if(hasChar(id))break;const nm=(($('#pn_'+id)||{}).value||'').trim().slice(0,8)||'무명';save();closeModal();newGame(id,nm);return}
   case'delchar':if(id===pl.cls)break;if(G.confirmDel!==id){G.confirmDel=id;break}delete ROOT.chars[id];G.confirmDel=null;writeRoot();toast(`${CLS[id].n} 캐릭터를 지웠다`);break;
   case'savenow':save(true);break;
   case'export':G.code='export';break;
   case'importshow':G.code='import';break;
   case'copycode':{const ta=$('#codeOut');if(!ta)break;const done=()=>toast('저장 코드를 복사했다');try{navigator.clipboard.writeText(ta.value).then(done,()=>{ta.focus();ta.select();toast('코드를 길게 눌러 복사해 주세요')})}catch(_){ta.focus();ta.select();toast('코드를 길게 눌러 복사해 주세요')}return}
   case'importdo':importCode(($('#codeIn')||{}).value);return;
   case'opencheat':G.modal='cheat';$('#mB').scrollTop=0;break;
   case'chchar':{const L=clamp(numv('cLv'),1,999);pl.lv=L;pl.exp=0;pl.pts=Math.max(0,numv('cPts'));pl.stats={str:Math.max(0,numv('cStr')),agi:Math.max(0,numv('cAgi')),int:Math.max(0,numv('cInt'))};pl.abyss=Math.max(0,numv('cAby'));recalc();pl.hp=pl.d.mhp;buildSkillBar();lastTrk='';toast('캐릭터 값을 적용했다');later(.1,()=>qEvent('check'));break}
   case'chheal':pl.hp=pl.d.mhp;pl.potCd=0;break;
   case'chgod':pl.god=!pl.god;break;
   case'chq':if(pl.q<MAINQ.length-1){pl.q++;pl.qk=0;lastTrk='';toast(`임무 이동 · ${qCur().t}`)}break;
   case'chboss':closeModal();spawnBoss();return;
   case'chitem':{if(pl.inv.length>=INVCAP){toast('가방이 가득 찼다');break}const g=+$('#ciG').value,sc=$('#ciSet').value||null;const x=makeItem($('#ciS').value,g,Math.max(1,numv('ciL')),pl.cls,sc);x.enh=clamp(numv('ciE'),0,30);if(sc)x.name=`[${SETN[sc]}] `+x.name.replace(/^\[[^\]]+\] /,'');pl.inv.unshift(x);pl.st.gotG=Math.max(pl.st.gotG,g);recalc();toast(`만들었다 · <b style="color:${GRADES[g].c}">${esc(x.name)}</b>`);break}
   case'chset6':{if(pl.inv.length+6>INVCAP){toast('가방 자리가 6칸 필요하다');break}SLOTS.forEach(sl=>pl.inv.unshift(makeItem(sl,6,pl.lv,pl.cls,pl.cls)));pl.st.gotG=Math.max(pl.st.gotG,6);toast(`${SETN[pl.cls]} 6부위를 가방에 넣었다 · 「최적 장비 자동 착용」으로 입어 보자`);break}
   case'chcur':pl.gold=Math.max(0,numv('cGo'));pl.stone=Math.max(0,numv('cSt'));pl.soul=Math.max(0,numv('cSo'));pl.ess=Math.max(0,numv('cEs'));{let left=POT_MAX;for(let i=0;i<4;i++){const v=clamp(numv('cP'+i),0,left);pl.pots[i]=v;left-=v}}toast('재화를 적용했다 (회복약은 합계 10개까지)');break;
   case'title':closeModal();save();toTitle();return;
   case'reset':if(!G.confirmReset){G.confirmReset=true}else{try{localStorage.removeItem(SAVEK);localStorage.removeItem(SAVEK1)}catch(_){}ROOT={v:2,active:null,chars:{},stash:[],ts:0};G.confirmReset=false;G.modal=null;$('#modal').hidden=true;toTitle();return}break}
  renderPanel()});
$('#modal').addEventListener('change',e=>{const el=e.target;if(el.dataset.set){const k=el.dataset.set;pl.set[k]=el.type==='checkbox'?el.checked:el.dataset.str?el.value:+el.value;save();if(k==='target')toast(el.value==='boss'?'보스 몬스터를 먼저 노린다':'가까운 몬스터를 먼저 노린다')}else if(el.id==='disG')G.disG=+el.value});

/* ================= HUD ================= */
const H={};['hCls','hName','hLv','hMap','hpF','shF','hpT','xpF','cGold','cStone','cSoul','trk','bossBar','bossN','bossF','gauge','gaugeT','gaugeF','talkB','dashB','skb','ptDot','hCP','hRec','achDot','cEss','potB','potN','tgtB'].forEach(k=>H[k]=document.getElementById(k));
let SKEL=[],hudAcc=0,lastTrk='',lastTalk='';
let skSig='';
function buildSkillBar(){const C=CLS[pl.cls];skSig=pl.cls+setCount();H.skb.innerHTML=[0,1,2,3,4].map(i=>{const s=skillDef(i);return `<button class="sk pe${s.set?' setk':''}" id="sk${i}" style="--cc:${C.col}" aria-label="${s.n}">${s.g}<b class="lv"></b></button>`}).join('');
  SKEL=[...H.skb.children];SKEL.forEach(b=>b.addEventListener('click',()=>openPanel('skill')));H.hCls.textContent=C.g;H.hCls.style.setProperty('--cc',C.col)}
function hudTick(dt){hudAcc+=dt;if(hudAcc<.07||G.scene!=='play')return;hudAcc=0;const d=pl.d,M=MAPS[G.map];
  H.hName.textContent=pl.name;H.hLv.textContent='Lv.'+pl.lv;H.hMap.textContent=M.n+(M.endless?` · ${pl.abyss+1}단계`:'');
  H.hpF.style.width=clamp(pl.hp/d.mhp*100,0,100)+'%';H.shF.style.width=clamp(pl.shield/d.mhp*100,0,100)+'%';H.hpT.textContent=fmt(Math.max(0,pl.hp))+' / '+fmt(d.mhp);
  H.xpF.style.width=clamp(pl.exp/need(pl.lv)*100,0,100)+'%';H.cGold.textContent=fmt(pl.gold);H.cStone.textContent=fmt(pl.stone);H.cSoul.textContent=fmt(pl.soul);H.cEss.textContent=fmt(pl.ess);
  if(skSig!==pl.cls+setCount())buildSkillBar();
  const tp=potTotal(),bp=bestPot();H.potN.textContent=tp;H.potB.style.setProperty('--p',pl.potCd>0?clamp(pl.potCd/POT_CD,0,1):0);H.potB.style.setProperty('--pc',bp>=0?POT[bp].c:'#555');H.potB.classList.toggle('empty',tp===0);
  H.tgtB.textContent=pl.set.target==='boss'?'표적 · 보스 우선':'표적 · 주변 우선';H.tgtB.classList.toggle('boss',pl.set.target==='boss');
  H.ptDot.hidden=pl.pts<=0;H.achDot.hidden=!ACH.some(a=>pl.ach[a.id]===1);
  const my=myCP(),rc=recCP(G.map);H.hCP.textContent=fmt(my);H.hRec.innerHTML=rc?`권장 <span class="${my>=rc?'pos':'neg'}">${fmt(rc)}</span>`:'';
  SKEL.forEach((el,i)=>{const lock=pl.lv<UNL[i];el.classList.toggle('lock',lock);const lv=el.querySelector('.lv');
    if(lock){lv.textContent='Lv'+UNL[i];el.style.setProperty('--p',0);el.classList.remove('ready')}
    else{lv.textContent=pl.skl[i]>1?pl.skl[i]:'';const cd=pl.cds[i]>.13?pl.cds[i]:0,p=clamp(cd/cdOf(i),0,1);el.style.setProperty('--p',p);el.classList.toggle('ready',p===0&&!M.safe)}});
  H.dashB.style.setProperty('--p',pl.dashCd>0?clamp(pl.dashCd/(pl.dashCdMax||2.4),0,1):0);
  if(G.boss){H.bossBar.hidden=false;H.gauge.hidden=true;H.bossN.textContent=G.boss.n+(G.boss.fury?' · 광폭':G.boss.enr?' · 격노':'');H.bossF.style.width=clamp(G.boss.hp/G.boss.mhp*100,0,100)+'%'}
  else{H.bossBar.hidden=true;if(M.dg){H.gauge.hidden=false;H.gaugeT.textContent=`보스 출현까지 ${G.gauge}/${GAUGE}`;H.gaugeF.style.width=G.gauge/GAUGE*100+'%'}else H.gauge.hidden=true}
  const q=qCur(),qm=qMap(q),need2=qm&&qm!==G.map&&!(MAPS[qm].req&&pl.lv<MAPS[qm].req)?qm:null;
  let s=`<div class="tq"${need2?` data-go="${need2}" role="button" tabindex="0"`:''}><em>임무</em><b>${q.t}</b><span>${qProg(q)}</span>${need2?`<span class="go">→ ${MAPS[need2].n}로 이동</span>`:''}</div>`;
  if(pl.bounty){const b=pl.bounty;s+=`<div class="tq b"${G.map!==b.map?` data-go="${b.map}" role="button" tabindex="0"`:''}><em>의뢰</em><b>${MAPS[b.map].n}</b><span>적 처치 ${b.k}/${b.n}</span>${G.map!==b.map?`<span class="go">→ 이동</span>`:''}</div>`}
  if(s!==lastTrk){H.trk.innerHTML=s;lastTrk=s}
  const n=G.near,tk=n?n.id:'';if(tk!==lastTalk){lastTalk=tk;H.talkB.hidden=!n;if(n)H.talkB.innerHTML=`<kbd>E</kbd>${n.obj==='gate'?'지도 열기':n.obj==='board'?'의뢰 보기':n.obj==='door'?(n.id==='exit'?'나가기':'들어가기'):'대화'} · ${n.n}`}}

/* ================= save / flow (모험단) =================
   저장 구조 v2: { v:2, active:직업, chars:{직업:캐릭터}, stash:[공용 창고], ts }
   캐릭터는 직업당 하나, 최대 4명. 창고만 모든 캐릭터가 함께 쓴다. */
const SAVEK='hyeolwol_v2',SAVEK1='hyeolwol_v1',STASH_CAP=120;
let ROOT={v:2,active:null,chars:{},stash:[],ts:0};
function serial(){const o={};for(const k of PKEYS)o[k]=pl[k];return o}
function writeRoot(){try{localStorage.setItem(SAVEK,JSON.stringify(ROOT));return true}catch(_){return false}}
function save(manual){if(G.scene!=='play')return false;ROOT.chars[pl.cls]=serial();ROOT.active=pl.cls;ROOT.ts=Date.now();const ok=writeRoot();
  if(manual)toast(ok?`<b style="color:#7fd88f">저장했다</b> · ${new Date(ROOT.ts).toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit'})}`:'<b class="neg">저장하지 못했다</b> · 이 브라우저가 저장을 막고 있다 (사생활 보호 모드 등)');return ok}
function loadRoot(){try{const s=localStorage.getItem(SAVEK);if(s){const r=JSON.parse(s);if(r&&r.v===2){ROOT=Object.assign({v:2,active:null,chars:{},stash:[],ts:0},r);return}}}catch(_){}
  try{const s1=localStorage.getItem(SAVEK1);if(s1){const o=JSON.parse(s1);if(o&&o.cls){ROOT={v:2,active:o.cls,chars:{[o.cls]:o},stash:[],ts:Date.now()};writeRoot()}}}catch(_){}}
const hasChar=c=>!!(ROOT.chars&&ROOT.chars[c]);
addEventListener('visibilitychange',()=>{if(document.hidden)save()});
addEventListener('pagehide',()=>save());
function startPlay(){G.scene='play';$('#title').hidden=true;$('#classSel').hidden=true;$('#hud').hidden=false;buildSkillBar();lastTrk='';lastTalk='__';pl.cds=[0,0,0,0,0];pl.buffs={};pl.shield=0;pl.chan=null;pl.potCd=0;G.dead=0;G.pet=null}
const DEFSET={autoEquip:true,autoDis:0,autoLoot:true,dmgNum:true,target:'near',autoPot:false};
function loadFrom(o){Object.assign(pl,o);pl.st=Object.assign(newSt(),o.st||{});pl.ach=o.ach||{};pl.set=Object.assign({},DEFSET,o.set||{});
  pl.pots=Array.isArray(o.pots)?o.pots.slice(0,4):[3,0,0,0];while(pl.pots.length<4)pl.pots.push(0);
  pl.pets=Object.assign({tiger:1,fairy:1,coin:1},o.pets||{});pl.pet=o.pet||'tiger';pl.ess=o.ess||0;pl.god=false;
  if(!o.qv){pl.q=QMIG[Math.min(o.q||0,QMIG.length-1)];pl.qk=0;pl.qv=3}
  pl.q=clamp(pl.q|0,0,MAINQ.length-1);
  SLOTS.forEach(s=>{if(!pl.gear[s])pl.gear[s]=null});pl.d={};recalc();pl.hp=pl.d.mhp;startPlay();travel(MAPS[pl.map]&&!MAPS[pl.map].req?pl.map:'village');later(.3,()=>qEvent('check'))}
function newGame(cls,name){
  Object.assign(pl,{name:name||'무명',cls,lv:1,exp:0,pts:0,stats:{str:2,agi:2,int:2},gear:{},inv:[],gold:120,stone:10,soul:2,skl:[1,1,1,1,1],q:0,qk:0,qv:3,bounty:null,abyss:0,set:Object.assign({},DEFSET),map:'village',board:null,st:newSt(),ach:{},
    pots:[3,0,0,0],pets:{tiger:1,fairy:1,coin:1},pet:'tiger',ess:0,god:false});
  pl.stats[CLS[cls].main]+=5;SLOTS.forEach(s=>pl.gear[s]=null);pl.gear.weapon=makeItem('weapon',1,1,cls,null);pl.gear.armor=makeItem('armor',0,1,cls,null);pl.d={};recalc();pl.hp=pl.d.mhp;
  startPlay();travel('village');save();
  later(.9,()=>vn([{w:'n',t:'혈월(血月)이 뜬 지 사흘째 밤.'},{w:'n',t:'청등마을의 등불은 바람 한 점 없이 푸르게 타오르고 있었다.'},{w:'me',t:'…여긴, 어디지.'},{w:'n',t:'발치에서 작은 것들이 셋, 꼬리를 흔들며 올려다보고 있었다. 동반자 — 백호, 요정, 돈깨비.'},{w:'n',t:'신당 앞에서 누군가 이쪽을 바라보고 있다.'}],
    ()=>{toast('이동 · WASD / 클릭 / 화면 드래그 &nbsp; 대쉬 · Space &nbsp; 회복약 · Q');setTimeout(()=>toast('<b style="color:#f3cf45">!</b> 표시된 무녀 설화에게 다가가 대화하자'),900);setTimeout(()=>toast('동반자는 伴(동반) 메뉴에서 바꾸고 강화한다'),1800)}))}
function switchChar(cls){if(!hasChar(cls))return;save();closeModal();loadFrom(ROOT.chars[cls]);toast(`${CLS[cls].n} ${esc(ROOT.chars[cls].name)}(으)로 전환했다`)}
function toTitle(){G.scene='title';$('#hud').hidden=true;$('#title').hidden=false;$('#classSel').hidden=true;$('#bCont').hidden=!(ROOT.active&&hasChar(ROOT.active))}
let chosen=null;
function buildCards(){$('#cards').innerHTML=Object.values(CLS).map(c=>`<button class="card" data-cls="${c.id}" style="--cc:${c.col}"><div class="pv"><img src="${A(`img/por_${c.id}.webp`)}" alt="${c.n}"></div><h4>${c.n}<small>${c.role}</small></h4><div class="ms">주스탯 · ${MAINN[c.main]}${hasChar(c.id)?` · <span style="color:var(--jade)">보유 중 · ${esc(ROOT.chars[c.id].name)} Lv.${ROOT.chars[c.id].lv}</span>`:''}</div><p>${c.d}</p><div class="gls">${SK[c.id].map(s=>s.g).join('')}</div></button>`).join('')}
$('#cards').addEventListener('click',e=>{const b=e.target.closest('[data-cls]');if(!b)return;chosen=b.dataset.cls;document.querySelectorAll('.card').forEach(x=>x.classList.toggle('on',x===b));$('#bStart').disabled=false;$('#bStart').textContent=hasChar(chosen)?'이 캐릭터로 이어하기':'이 길로 깨어난다';$('#pname').disabled=hasChar(chosen)});
$('#bNew').addEventListener('click',()=>{$('#title').hidden=true;$('#classSel').hidden=false;buildCards()});
$('#bCont').addEventListener('click',()=>{if(ROOT.active&&hasChar(ROOT.active))loadFrom(ROOT.chars[ROOT.active])});
$('#bStart').addEventListener('click',()=>{if(!chosen)return;if(hasChar(chosen)){loadFrom(ROOT.chars[chosen]);return}newGame(chosen,($('#pname').value||'').trim().slice(0,8)||'무명')});
/* 저장 코드: 다른 기기·브라우저로 옮기거나 백업할 때 쓰는 문자열 */
function exportCode(){save();try{return 'HW2:'+btoa(unescape(encodeURIComponent(JSON.stringify(ROOT))))}catch(_){return ''}}
function importCode(str){try{str=(str||'').trim();if(!str.startsWith('HW2:'))throw 0;const r=JSON.parse(decodeURIComponent(escape(atob(str.slice(4)))));if(!r||r.v!==2||!r.chars)throw 0;ROOT=Object.assign({v:2,active:null,chars:{},stash:[],ts:0},r);writeRoot();
  const c=ROOT.active&&hasChar(ROOT.active)?ROOT.active:Object.keys(ROOT.chars)[0];G.modal=null;G.code=null;$('#modal').hidden=true;if(c)loadFrom(ROOT.chars[c]);else toTitle();toast('<b style="color:#7fd88f">저장 코드를 불러왔다</b>');return true}catch(_){toast('<b class="neg">저장 코드가 올바르지 않다</b> · HW2: 로 시작하는 코드 전체를 붙여 넣어 주세요');return false}}

/* ================= mobile: fullscreen & orientation ================= */
const fsOK=!!(document.fullscreenEnabled||document.webkitFullscreenEnabled);
const isFS=()=>!!(document.fullscreenElement||document.webkitFullscreenElement);
function toggleFS(){try{if(isFS()){(document.exitFullscreen||document.webkitExitFullscreen).call(document)}else{const el=document.documentElement,rq=el.requestFullscreen||el.webkitRequestFullscreen;const p=rq&&rq.call(el,{navigationUI:'hide'});const lock=()=>{try{screen.orientation&&screen.orientation.lock&&screen.orientation.lock('landscape').catch(()=>{})}catch(_){}};if(p&&p.then)p.then(lock).catch(()=>toast('이 화면에서는 전체화면을 쓸 수 없다'));else lock()}}catch(_){toast('이 화면에서는 전체화면을 쓸 수 없다')}}
document.querySelectorAll('.fsT').forEach(b=>{b.hidden=!fsOK;b.addEventListener('click',toggleFS)});
['fullscreenchange','webkitfullscreenchange'].forEach(ev=>document.addEventListener(ev,()=>{resize();const s=$('#fsHud span');if(s)s.textContent=isFS()?'⇲':'⛶'}));
addEventListener('orientationchange',()=>setTimeout(resize,200));
document.addEventListener('gesturestart',e=>e.preventDefault());
document.addEventListener('dblclick',e=>{if(e.target.closest('#game'))e.preventDefault()});

/* ================= loop ================= */
let last=performance.now();
let errN=0;
function frame(now){const dt=Math.min(.05,(now-last)/1000);last=now;
  /* v2: 한 프레임에서 오류가 나도 루프가 멈추지 않도록 다음 프레임을 먼저 예약한다 */
  requestAnimationFrame(frame);
  try{if(G.scene==='play'){if(!G.modal&&!G.vn)update(dt);if(G.vn)vnTick(dt);drawWorld();hudTick(dt)}
  else{G.t+=dt;drawTitle(dt)}}
  catch(err){if(errN++<5)console.error(err);cx.setTransform(1,0,0,1,0,0);cx.globalAlpha=1;cx.globalCompositeOperation='source-over'}}
function boot(data){
  try{window.claude?.hot?.snapshot?.(()=>{if(G.scene==='play')save();return {inGame:G.scene==='play'}})}catch(_){}
  loadRoot();
  if(data&&data.inGame&&ROOT.active&&hasChar(ROOT.active))loadFrom(ROOT.chars[ROOT.active]);else if(data&&data.save&&data.save.cls)loadFrom(data.save);else toTitle();
  requestAnimationFrame(frame)}
try{window.claude?.hot?.ready?window.claude.hot.ready(boot):boot(window.claude?.hot?.data??{})}catch(_){boot({})}
</script>
