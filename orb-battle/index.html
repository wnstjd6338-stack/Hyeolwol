<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>연쇄 구슬 배틀 (프로토타입)</title>
<style>
html,body{margin:0;height:100%;background:#07040b;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;font-family:system-ui,-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;color:#eee}
canvas{display:block;margin:0 auto;touch-action:none}
#bar{position:fixed;top:calc(6px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);width:min(100%,600px);display:flex;gap:6px;justify-content:center;flex-wrap:wrap;padding:0 8px;box-sizing:border-box;z-index:2}
#bar button{font:600 12px inherit;font-family:inherit;color:#f3e6d0;background:rgba(40,20,30,.8);border:1px solid #7a4a3a;border-radius:8px;padding:6px 9px}
#bar button:active{background:#5a2a2a}
#sp{position:fixed;z-index:3;width:60px;height:60px}
#spBtn{width:60px;height:60px;border-radius:50%;border:2px solid #6a4a3a;padding:0;color:#ffe9b0;font:800 11px/1.15 system-ui,sans-serif;text-shadow:0 1px 2px #000;
  background:radial-gradient(circle,#241018 56%,transparent 58%),conic-gradient(#ffcf4a calc(var(--p,0)*1%),#3a2a30 0)}
#spBtn.ready{border-color:#ffd96a;animation:spg 1s ease-in-out infinite}
@keyframes spg{50%{box-shadow:0 0 18px 4px #ffcf4a}}
#spPick,#prPick{position:absolute;top:2px;left:68px;display:none;gap:8px;background:rgba(20,8,14,.92);border:1px solid #8a5a3a;border-radius:14px;padding:8px 10px;white-space:nowrap}
#spPick.on,#prPick.on{display:flex}
#pr{position:fixed;z-index:3;width:60px;height:60px}
#prBtn{position:relative;width:60px;height:60px;border-radius:50%;border:2px solid #6a4a5a;padding:0;background:radial-gradient(circle,#2a1828 56%,transparent 58%),conic-gradient(#ff7ac0 calc(var(--p,0)*1%),#3a2a30 0)}
#prBtn.ready{border-color:#ff9ad0;animation:prg 1s ease-in-out infinite}
@keyframes prg{50%{box-shadow:0 0 18px 4px #ff7ac0}}
#prBtn img{width:30px;height:40px;image-rendering:pixelated;margin-top:2px}
#prBtn i{position:absolute;bottom:-4px;left:50%;transform:translateX(-50%);font:800 10px system-ui,sans-serif;font-style:normal;color:#ffe0f0;background:#3a1028;border-radius:6px;padding:1px 5px;white-space:nowrap}
#spPick button,#prPick button{width:46px;height:46px;border:0;padding:0;background:none}
#spPick img,#prPick img{width:46px;height:46px}
#over{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.7);z-index:5;text-align:center}
#over.on{display:flex}
#over h2{color:#ff5a5a;margin:0 0 8px}
#over button{font:800 16px system-ui,sans-serif;color:#fff;background:#8a1a22;border:0;border-radius:10px;padding:10px 26px;margin-top:10px}
#loot{position:fixed;top:calc(64px + env(safe-area-inset-top));right:max(10px,calc(50% - 290px));z-index:3;font:800 14px system-ui,sans-serif;color:#fff;background:rgba(30,15,10,.75);border:1px solid #a87a3a;border-radius:10px;padding:5px 10px;text-shadow:0 1px 2px #000}
#loot.bump{animation:bump .3s}@keyframes bump{50%{transform:scale(1.35)}}
.pri{background:#b8401a!important;border-color:#ffb070!important;color:#fff!important}
#lobby{position:fixed;inset:0;display:none;z-index:4;pointer-events:none}
#lobby.on{display:block}
#lobby>*{pointer-events:auto}
.ltitle{position:absolute;top:calc(12px + env(safe-area-inset-top));left:0;right:0;text-align:center;font:900 20px system-ui,sans-serif;color:#ffe9b0;text-shadow:0 2px 4px #000;pointer-events:none!important}
.lcard{position:absolute;top:calc(48px + env(safe-area-inset-top));left:max(10px,calc(50% - 290px));background:rgba(28,18,12,.85);border:2px solid #8a5a2a;border-radius:12px;padding:8px 10px;max-width:230px}
.lcard .st{font-size:11.5px}
.st{font-size:12.5px;color:#eadcc8;margin:2px 0}.st b{color:#ffcf8a;margin-right:4px}.st small{color:#a89880}.st span{margin-right:6px}
#bBag{position:absolute;right:max(12px,calc(50% - 288px));top:50%;transform:translateY(-50%);width:68px;height:68px;border-radius:50%;border:3px solid #c8904a;background:radial-gradient(circle at 35% 30%,#7a4a24,#3a2010);color:#ffe9c8;display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:0 4px 10px rgba(0,0,0,.6);padding:0}
#bBag span{font-size:28px;line-height:1}#bBag b{font:900 11px system-ui,sans-serif;margin-top:1px}
#bBag:active{transform:translateY(-50%) scale(.92)}
#bOrb{position:absolute;right:max(12px,calc(50% - 288px));top:calc(50% + 44px);width:68px;height:68px;border-radius:50%;border:3px solid #9a7ad8;background:radial-gradient(circle at 35% 30%,#4a2a7a,#1e1038);color:#ece0ff;display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:0 4px 10px rgba(0,0,0,.6);padding:0}
#bOrb b{font:900 10px system-ui,sans-serif;margin-top:2px}#bOrbImgs{display:flex;gap:0}#bOrbImgs img{width:19px;height:19px;image-rendering:pixelated;margin:0 -2px}
#bOrb:active{transform:scale(.92)}
#orbSet{position:fixed;inset:0;z-index:6;display:none;background:rgba(5,3,8,.82);justify-content:center;align-items:flex-start;overflow:auto}#orbSet.on{display:flex}
#osSlots{display:flex;gap:10px;justify-content:center}
.oss{flex:1;max-width:120px;background:#140d09;border:2px solid #5a4a3a;border-radius:12px;padding:8px 4px;text-align:center;color:#eadcc8;font:800 12px system-ui,sans-serif}
.oss.sel{border-color:#ffd96a;box-shadow:0 0 12px #ffb84a}.oss img{width:54px;height:54px;image-rendering:pixelated;display:block;margin:4px auto}.oss small{color:#a89880;display:block}
#osDesc{margin:10px 0;background:#140d09;border-radius:10px;padding:8px 10px;font-size:12.5px;color:#eadcc8;min-height:34px}
#osList{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.osi{background:#2a1c12;border:2px solid #5a4a3a;border-radius:12px;padding:6px 2px;text-align:center;font:800 11px system-ui,sans-serif;color:#fff;position:relative}
.osi img{width:46px;height:46px;image-rendering:pixelated;display:block;margin:0 auto 2px}
.osi.using{border-color:#ffd96a}.osi.using::after{content:attr(data-slot);position:absolute;top:-6px;right:-4px;background:#ffd96a;color:#3a2010;border-radius:8px;padding:0 5px;font-size:10px}
.osi.lock img{filter:grayscale(1) brightness(.35)}.osi.lock{color:#888}.osi.lock small{display:block;color:#a88;font-size:9.5px}
.newOrb{display:flex;gap:10px;align-items:center;text-align:left;background:#2a1440;border:2px solid #c36bff;border-radius:12px;padding:8px;margin:12px 0;box-shadow:0 0 14px #c36bff}
.newOrb img{width:56px;image-rendering:pixelated}.newOrb b{display:block;color:#ffe14a;font-size:13px}.newOrb span{display:block;font:900 16px system-ui,sans-serif}.newOrb small{color:#d8c8e8;font-size:11px}
.lbtns{position:absolute;left:50%;bottom:calc(46px + env(safe-area-inset-bottom));transform:translateX(-50%);display:flex;gap:10px;width:min(94%,420px)}
#bGo,#bInf{flex:1.3;height:64px;border-radius:18px;border:3px solid #ffd27a;background:linear-gradient(#e8622a,#a8280e);color:#fff;font:900 20px system-ui,sans-serif;text-shadow:0 2px 3px rgba(0,0,0,.5);box-shadow:0 6px 0 #5a1406,0 8px 16px rgba(0,0,0,.6);animation:goP 1.6s ease-in-out infinite}
#bInf{flex:1;font-size:16px;border-color:#b8a0ff;background:linear-gradient(#7a4ae8,#3a1a9a);box-shadow:0 6px 0 #1a0a4a,0 8px 16px rgba(0,0,0,.6);animation:none;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.1}
#bInf small{font:800 10.5px system-ui,sans-serif;color:#e0d4ff;margin-top:3px}
#bGo:active{transform:translateY(4px);box-shadow:0 2px 0 #5a1406}#bInf:active{transform:translateY(4px);box-shadow:0 2px 0 #1a0a4a}
@keyframes goP{50%{filter:brightness(1.15)}}
#stageSel{position:fixed;inset:0;z-index:5;display:none;overflow-y:auto;background-color:#1a3a12;background-size:cover;background-position:center}
#stageSel.on{display:block}
.sh{position:sticky;top:0;z-index:2;display:flex;align-items:center;justify-content:space-between;padding:calc(10px + env(safe-area-inset-top)) 12px 10px;background:linear-gradient(rgba(10,6,4,.9),rgba(10,6,4,0));font:900 18px system-ui,sans-serif;color:#ffe9b0;text-shadow:0 2px 3px #000}
.sh button{font:800 13px system-ui,sans-serif;color:#ffe9c8;background:rgba(40,20,10,.85);border:1px solid #8a5a2a;border-radius:10px;padding:7px 10px}.sh span{width:80px}
#ssList{position:relative;width:min(100%,520px);margin:10px auto 40px}
#ssList svg{position:absolute;left:0;top:0;pointer-events:none}
.node{position:absolute;width:130px;transform:translateX(-50%);text-align:center}
.node .art{position:relative;height:118px}
.node .mob{position:absolute;left:50%;bottom:44px;width:66px;transform:translateX(-50%);image-rendering:pixelated;filter:drop-shadow(0 2px 2px rgba(0,0,0,.5))}
.node.boss .mob{width:96px;bottom:40px}
.node .bush{position:absolute;left:0;bottom:0;width:130px;image-rendering:pixelated;filter:drop-shadow(0 4px 3px rgba(0,0,0,.5))}
.node .num{display:inline-block;margin-top:-6px;min-width:46px;padding:2px 12px;border-radius:14px;background:#3a2010;border:3px solid #c8904a;font:900 22px system-ui,sans-serif;color:#fff;text-shadow:0 2px 2px #000;position:relative}
.node .stars{color:#ffe14a;font-size:14px;text-shadow:0 1px 2px #000;height:16px}
.node.next .num{border-color:#ffe14a;box-shadow:0 0 14px #ffd84a;animation:goP 1.2s infinite}
.node.boss .num{background:#5a1010;border-color:#ff7a5a}
.node.lock .art{filter:grayscale(1) brightness(.45)}.node.lock .num{background:#2a2a2a;border-color:#555;color:#999}
.node.lock .art::after{content:'🔒';position:absolute;left:50%;top:40%;transform:translate(-50%,-50%);font-size:28px}
#fade{position:fixed;inset:0;background:#000;opacity:0;pointer-events:none;z-index:9;transition:opacity .28s}
#fade.on{opacity:1;pointer-events:auto}
#bag,#result{position:fixed;inset:0;z-index:6;display:none;background:rgba(5,3,8,.82);justify-content:center;align-items:flex-start;overflow:auto}
#bag.on,#result.on{display:flex}
.bw,.rw{width:min(100%,560px);margin:calc(10px + env(safe-area-inset-top)) 8px 10px;background:#1e140e;border:2px solid #8a5a2a;border-radius:16px;padding:12px;box-sizing:border-box}
.bh{display:flex;justify-content:space-between;align-items:center;font:900 18px system-ui,sans-serif;color:#ffe9b0}
.bh button{background:none;border:0;color:#fff;font-size:22px}
.eqa{display:flex;justify-content:space-between;align-items:center;margin:10px 0;background:radial-gradient(circle at 50% 60%,#3a5a2a,#1e140e 70%);border-radius:12px;padding:8px 6px}
.col{display:flex;flex-direction:column;gap:8px}
.eqs{display:flex;flex-direction:column;align-items:center}.eqs label{font-size:10.5px;color:#c8b8a0;margin-top:2px}
.hero img{width:110px;image-rendering:pixelated;filter:drop-shadow(0 4px 4px rgba(0,0,0,.6))}
.it{position:relative;width:52px;height:52px;border-radius:10px;border:2px solid #777;background:#2a2a2a;display:flex;align-items:center;justify-content:center;box-sizing:border-box}
.it img{width:36px;height:36px;image-rendering:pixelated}
.it span{position:absolute;bottom:0;right:3px;font:800 9px system-ui,sans-serif;color:#fff;text-shadow:0 1px 2px #000}
.it.g0{border-color:#9a9a9a;background:#2c2c2c}.it.g1{border-color:#4aa8ff;background:#10243c}.it.g2{border-color:#c36bff;background:#2c1442;box-shadow:0 0 8px #c36bff}
.it.empty{border-style:dashed;border-color:#5a4a3a;background:#18110c}.it.empty img{opacity:.18;filter:grayscale(1)}
#bstats{background:#140d09;border-radius:10px;padding:8px 10px}
.ic{font:800 13px system-ui,sans-serif;color:#ffcf8a;margin:10px 2px 6px}
#inv,.rloot{display:grid;grid-template-columns:repeat(auto-fill,52px);gap:7px;justify-content:start}
.none{color:#8a7a6a;font-size:13px;grid-column:1/-1}
#detail{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.5);z-index:7}
#detail.on{display:flex}
.dbox{width:min(86%,340px);background:#1e140e;border:2px solid;border-radius:14px;padding:14px}
.dtop{display:flex;gap:10px;align-items:center}.dname{font:900 17px system-ui,sans-serif}.dsub{font-size:12px;color:#b8a890}
.dsubs{margin:0 0 10px;padding:6px 10px;background:#140d09;border-radius:8px;font:700 13px system-ui,sans-serif;color:#8fe0ff;line-height:1.6}
.st .pc{color:#8fe0ff}
.dopt{margin:12px 0 6px;font:800 15px system-ui,sans-serif;color:#fff}.cmp{font-size:12px;color:#c8b8a0}
.dbtn{display:flex;gap:6px;margin-top:12px}.dbtn button{flex:1;height:40px;border-radius:10px;border:2px solid #6a4a2a;background:#3a2616;color:#fff;font:800 14px system-ui,sans-serif}
.rw{margin-top:18vh;text-align:center}.rw h2{margin:4px 0}.rsum{color:#c8b8a0;font-size:13px}.rtitle{margin:14px 0 8px;color:#ffcf8a;font:800 13px system-ui,sans-serif}
.rloot{justify-content:center;margin-bottom:14px}.rw button{width:100%;height:46px;border-radius:12px;border:2px solid;font:900 16px system-ui,sans-serif}
#stat{position:fixed;top:calc(40px + env(safe-area-inset-top));left:0;right:0;text-align:center;font-size:11px;color:#c9b8a8;z-index:2;pointer-events:none;text-shadow:0 1px 2px #000}
</style>
</head>
<body>
<div id="bar">
  <button id="bHint">힌트</button>
  <button id="bShuffle">섞기</button>
  <button id="bRetreat">후퇴</button>
</div>
<div id="stat"></div>
<div id="loot">🎁 0</div>
<div id="lobby">
  <div class="ltitle">⛺ 대기소</div>
  <div id="lstats" class="lcard"></div>
  <button id="bBag"><span>🎒</span><b>가방</b></button>
  <button id="bOrb"><span id="bOrbImgs"></span><b>스킬구슬</b></button>
  <div class="lbtns"><button id="bInf">♾ 무한모드<small id="infBest"></small></button><button id="bGo">⚔ 전투 시작</button></div>
</div>
<div id="stageSel"><div class="sh"><button id="ssBack">← 대기소</button><b>스테이지 선택</b><span></span></div><div id="ssList"></div></div>
<div id="fade"></div>
<div id="orbSet"><div class="bw">
  <div class="bh">🔮 스킬구슬 세팅 <button id="osClose">✕</button></div>
  <div class="ic">장착 칸 (칸을 고르고 아래 구슬을 누르세요)</div>
  <div id="osSlots"></div>
  <div id="osDesc"></div>
  <div class="ic">보유 스킬구슬</div>
  <div id="osList"></div>
</div></div>
<div id="bag"><div class="bw">
  <div class="bh">🎒 가방 <button id="bagClose">✕</button></div>
  <div class="eqa"><div class="col" id="eqL"></div><div class="hero"><img id="bagHero"></div><div class="col" id="eqR"></div></div>
  <div id="bstats"></div>
  <div id="invCnt" class="ic"></div>
  <div id="inv"></div>
</div><div id="detail"></div></div>
<div id="result"><div class="rw"><h2></h2><div class="rsum"></div><div class="rnew"></div><div class="rtitle"></div><div class="rloot"></div><button id="rOk" class="pri">확인</button></div></div>
<div id="pr"><div id="prPick"></div><button id="prBtn"><img src="" id="prImg"><i id="prCnt"></i></button></div>
<div id="sp"><div id="spPick"></div><button id="spBtn"><b>구슬<br>변환</b></button></div>
<div id="over"><div><h2>쓰러졌다...</h2><p id="overTxt"></p><button id="overBtn">다시 하기</button></div></div>
<canvas id="c"></canvas>

let AC=null, noiseBuf=null;
function ensureAudio(){
  if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();
    noiseBuf=AC.createBuffer(1,AC.sampleRate*0.6,AC.sampleRate);const d=noiseBuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;}catch(e){}}
  if(AC&&AC.state==='suspended')AC.resume();
}
function blip(f,dur,type='triangle',vol=.15,f2){if(!AC)return;const t=AC.currentTime,o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+dur);g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+dur);o.connect(g).connect(AC.destination);o.start(t);o.stop(t+dur);}
function noise(dur,vol=.3,freq=1200){if(!AC)return;const t=AC.currentTime,s=AC.createBufferSource(),f=AC.createBiquadFilter(),g=AC.createGain();s.buffer=noiseBuf;f.type='lowpass';f.frequency.setValueAtTime(freq,t);f.frequency.exponentialRampToValueAtTime(80,t+dur);g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+dur);s.connect(f).connect(g).connect(AC.destination);s.start(t);s.stop(t+dur);}
const sfxSelect=n=>blip(330*Math.pow(2,(n-1)/7),.08,'sine',.12);

let W,H,DPR,cell,bx,by,bw,bh,groundY,spriteH,heroX,monX,heroW,monW,battleTop,mapS,mapDH,mapDW,mapY,gobW;
const orbImg=[];
function layout(){
  DPR=Math.min(window.devicePixelRatio||1,2.5);
  W=Math.min(window.innerWidth,600);H=window.innerHeight;
  cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR);cv.style.width=W+'px';cv.style.height=H+'px';
  cell=Math.min((W-14)/COLS,(H*0.34)/ROWS,58);
  bw=cell*COLS;bh=cell*ROWS;bx=(W-bw)/2;by=H-bh-Math.max(16,H*0.035);
  battleTop=64;
  mapS=Math.max(W/600,H/1066)*1.15;mapDH=1066*mapS;mapDW=600*mapS;mapY=Math.min(0,(H-mapDH)/2+20);
  groundY=clamp(mapY+.6*mapDH,battleTop+160,by-34);
  spriteH=clamp(Math.min(by-34-battleTop-90,W*0.42),80,280)*0.2;
  groundY-=spriteH*3;
  heroW=spriteH*278/300;gobW=spriteH*.95*344/300;setMonSize();
  heroX=scene==='lobby'?W*.55:W*0.36;monX=W*0.66;
  makeOrbSprites();
  const sp=document.getElementById('sp');sp.style.left=((window.innerWidth-W)/2+10)+'px';sp.style.top=(battleTop+8)+'px';
  const pr=document.getElementById('pr');pr.style.left=sp.style.left;pr.style.top=(battleTop+80)+'px';
  buildPick();
}
function buildPick(){
  for(const [id,fn] of [['spPick',doSpecial],['prPick',doPriest]]){
    const pk=document.getElementById(id);pk.innerHTML='';
    for(let t=0;t<numTypes;t++){const b=document.createElement('button');const im=document.createElement('img');im.src=orbImg[t].src;b.appendChild(im);
      b.onclick=e=>{e.stopPropagation();pk.classList.remove('on');fn(t);};pk.appendChild(b);}
  }
}

// ---------- connected groups (상하좌우만) ----------
function groupFrom(r,c){
  const t=grid[r][c].t,seen=new Uint8Array(ROWS*COLS),out=[{r,c}];seen[r*COLS+c]=1;
  for(let i=0;i<out.length;i++){const k=out[i];
    for(const [dr,dc] of DIRS){const nr=k.r+dr,nc=k.c+dc;if(nr<0||nc<0||nr>=ROWS||nc>=COLS)continue;
      const j=nr*COLS+nc;if(seen[j]||grid[nr][nc].t!==t)continue;seen[j]=1;out.push({r:nr,c:nc});}}
  return out; // 누른 구슬부터 가까운 순서(BFS)
}
function largestGroup(){
  let best=[];const done=new Uint8Array(ROWS*COLS);
  for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){if(done[r*COLS+c])continue;const g=groupFrom(r,c);g.forEach(k=>done[k.r*COLS+k.c]=1);if(g.length>best.length)best=g;}
  return best;
}
function updateStat(){
  const avg=stats.count?(stats.sum/stats.count).toFixed(1):'-';
  document.getElementById('stat').textContent=`지금 보드 최대 그룹: ${boardMax}개 · 평균 ${avg} · 최고 ${stats.best} · ${stats.count}회 · 처치 ${stats.kills}`;
}

// ---------- input ----------
function pt(e){const b=cv.getBoundingClientRect();return{x:e.clientX-b.left,y:e.clientY-b.top};}
function cellAt(p,rad){
  const c=Math.floor((p.x-bx)/cell),r=Math.floor((p.y-by)/cell);
  if(r<0||c<0||r>=ROWS||c>=COLS)return null;
  if(Math.hypot(p.x-ocx(c),p.y-ocy(r))>cell*rad)return null;
  return{r,c};
}
cv.addEventListener('pointerdown',e=>{
  ensureAudio();e.preventDefault();
  document.getElementById('spPick').classList.remove('on');document.getElementById('prPick').classList.remove('on');
  if(state!=='idle'||scene!=='battle'||stageOver)return;
  const k=cellAt(pt(e),.5);if(!k)return;
  const g=groupFrom(k.r,k.c);
  if(g.length<2){grid[k.r][k.c].wig=.3;blip(140,.1,'square',.06);return;}
  hintPath=[];chain=g;popType=grid[k.r][k.c].t;popN=g.length;popIdx=0;popTimer=0;state='pop';
});

document.getElementById('bHint').onclick=()=>{if(state!=='idle')return;hintPath=largestGroup();hintT=2;};

function doSpecial(t){
  if(state!=='idle'||spGauge<SP_MAX)return;
  spGauge=0;updateSp();state='settle';
  const T=TYPES[t];
  const cand=[];for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++)if(grid[r][c].t!==t)cand.push({r,c});
  for(let i=cand.length-1;i>0;i--){const j=(Math.random()*(i+1))|0;[cand[i],cand[j]]=[cand[j],cand[i]];}
  const pickN=cand.slice(0,SP_COUNT);
  showBanner('구슬 변환!',T.name+' 구슬로',T.glow,2);
  heroCast=.4;muzzleFlash(T,3);blip(400,.3,'sawtooth',.08,1200);
  const M=muzzle();
  pickN.forEach((k,i)=>{
    const x=ocx(k.c),y=ocy(k.r);
    shoot({from:M,to:{x,y},dur:.3+i*.06,size:4,T,kind:'spark',arc:60,block:true,L:1,onHit:()=>{
      grid[k.r][k.c].t=t;grid[k.r][k.c].wig=.25;
      burst(x,y,14,160,[T.hot,T.c1,T.glow],3,1);ring(x,y,cell*.9,T.glow,4,.35,1);core(x,y,cell*.6,T.hot,.25,1);
      blip(600+i*80,.12,'triangle',.12);}});
  });
}

const healFor=n=>Math.round(20*n*(1+(n-2)*.2)*hero.max/BASE_HP);
function revertHeal(){
  let i=0;
  for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){const o=grid[r][c];if(o.t!==3||o.dead)continue;
    const d=i++*.04;later(.1+d,()=>{if(o.t!==3)return;o.t=o.orig!=null?o.orig:(Math.random()*numTypes)|0;o.wig=.2;
      const T=TYPES[o.t];let rr=-1,cc=-1;for(let a=0;a<ROWS;a++)for(let b=0;b<COLS;b++)if(grid[a][b]===o){rr=a;cc=b;}
      if(rr>=0){const x=ocx(cc),y=ocy(rr);burst(x,y,8,110,['#ffc0e0',T.c1,'#fff'],2.5,1);ring(x,y,cell*.6,'#ff7ac0',2,.3,1);}
      blip(700-d*400,.06,'triangle',.05);});}
}

function enemyAttack(){
  state='enemy';curElem=null;const S=mon.st,lv0=mon.lvl,nm=mon.boss?'미노타우로스':'고블린';
  let delay=0;
  if(S.burn>0||S.poison>0){delay=.6;const c={x:monX,y:groundY-monH()*.55};
    if(S.burn>0){floatText(c.x-20,c.y-monH()*.4-10,`🔥화상 ×${S.burn}`,13,'#ffb070',0,-30);burst(c.x,c.y,10+S.burn,160,[FIRE.hot,FIRE.c1,FIRE.glow],3,0,-200);hitMon(S.burn*4*atkMul(),c.x-14,c.y,false);}
    if(mon.alive&&mon.lvl===lv0&&S.poison>0){const P=SKILLS.poison;floatText(c.x+20,c.y-monH()*.4+6,`☠중독 ×${S.poison}`,13,P.c1,0,-30);burst(c.x,c.y,10+S.poison,120,[P.c1,P.glow,'#3a7a10'],3,0,200);hitMon(S.poison*5*atkMul(),c.x+14,c.y-12,false);}
    noise(.3,.2,1500);
  }
  mon.atkT=-delay;
  const finish=t=>later(t,()=>{attacksLeft=ATK_EVERY;if(hero.hp<=0)showResult(false);else if(state==='enemy')state='idle';});
  if(mon.lvl!==lv0||!mon.alive){finish(.9);return;}
  if(S.frozen){mon.atkT=-99;later(delay,()=>{S.frozen=false;const I=SKILLS.ice;showBanner('빙결!',`${nm}이(가) 얼어서 공격하지 못했다`,I.glow,2);
      burst(monX,groundY-monH()*.5,40,300,['#ffffff',I.c1,I.glow],4);blip(1800,.3,'triangle',.1,900);});finish(delay+1);return;}
  later(delay,()=>{showBanner(nm+'의 공격!','','#ff4a4a',2);blip(90,.5,'sawtooth',.12,50);});
  later(delay+.45,()=>{
    const p={x:heroX,y:groundY-spriteH*.5};
    if(Math.random()<Math.min(.6,S.dark*.005)){floatText(p.x,p.y-40,'빗나감!',26,'#d8b0ff');burst(p.x+heroW*.4,p.y,16,140,['#b25cff','#2a0a4a'],4);blip(300,.2,'sine',.08,150);S.weak=false;return;}
    let d=Math.round(monAtk()*rand(.9,1.1)*100/(100+cur.def)*(S.weak?.8:1));
    if(S.weak)floatText(monX,groundY-monH()-30,'약화됨',13,'#8fd8ff');S.weak=false;
    if(hero.shield>0){const ab=Math.min(hero.shield,d);hero.shield-=ab;d-=ab;
      const G=SKILLS.shield;burst(p.x+heroW*.3,p.y,40,320,[G.hot,G.c1,'#ffffff','#c8d0d8'],5);ring(p.x+heroW*.3,p.y,spriteH*.7,G.glow,8,.5);
      floatText(p.x,p.y-70,'막음! '+ab,26,'#9dffb8');blip(1200,.25,'square',.08,400);}
    hero.hp=Math.max(0,hero.hp-d);if(d>0){hero.flash=.18;hero.knock=-22;}
    explode(p.x,p.y,7,{hot:'#ffffff',c1:'#ff9a7a',glow:'#ff2a2a'});doFlash(.4,'#ff1a1a');addShake(16);noise(.5,.5,700);
    if(d>0)floatText(p.x,p.y-30,'-'+d,36,'#ff5a5a');
    if(navigator.vibrate)try{navigator.vibrate(60)}catch(e){}
  });
  finish(delay+1.0);
}

// ---------- effects ----------
function spark(x,y,o){parts.push(Object.assign({x,y,vx:0,vy:0,life:.5,max:.5,size:3,color:'#fff',g:0,drag:.9,L:0},o));if(parts.length>900)parts.splice(0,parts.length-900);}
function burst(x,y,n,spd,cols,size,L=0,g=0){for(let i=0;i<n;i++){const a=rand(0,6.283),s=rand(.25,1)*spd,l=rand(.3,.75);spark(x,y,{vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:l,max:l,size:rand(.5,1)*size,color:pick(cols),L,g,drag:.92});}}
function ring(x,y,maxR,col,w,life=.4,L=0){let t=0;fx.push({L,upd(dt){t+=dt/life;return t<1;},draw(){const e=1-Math.pow(1-t,3);ctx.globalAlpha=1-t;ctx.strokeStyle=col;ctx.lineWidth=w*(1-t)+1;ctx.beginPath();ctx.arc(x,y,maxR*e,0,7);ctx.stroke();ctx.globalAlpha=1;}});}
function glowCircle(x,y,r,col,a=1){const g=ctx.createRadialGradient(x,y,0,x,y,r);g.addColorStop(0,col);g.addColorStop(1,'rgba(0,0,0,0)');ctx.globalAlpha=a;ctx.fillStyle=g;ctx.beginPath();ctx.arc(x,y,r,0,7);ctx.fill();ctx.globalAlpha=1;}
function core(x,y,r,col,life=.25,L=0){let t=0;fx.push({L,upd(dt){t+=dt/life;return t<1;},draw(){glowCircle(x,y,r*(1+t*.5),col,1-t);}});}
function explode(x,y,p,T,L=0){
  burst(x,y,Math.min(8+p*7,90),70+p*45,[T.hot,T.c1,T.glow],2+p*.6,L,L?0:120);
  ring(x,y,12+p*14,T.glow,3+p,.35+p*.03,L);core(x,y,10+p*9,T.hot,.2+p*.02,L);
}
function addShake(v){shake=Math.max(shake,v);}
function doFlash(a,c){flash.a=Math.max(flash.a,a);flash.c=c;}
function floatText(x,y,s,size,col,L=0,vy=-60){texts.push({x,y,s,size,col,L,t:0,life:.9,vy});}

function shoot(o){
  const {from,to,dur,size,T,kind='bullet',arc=0,onHit,block=true,L=0}=o;
  const cp={x:(from.x+to.x)/2+rand(-arc,arc)*.4,y:Math.min(from.y,to.y)-arc*rand(.4,1)};
  let t=0;const trail=[];let p=from,ang=0;
  fx.push({block,L,upd(dt){
      t+=dt/dur;const np=bez(from,cp,to,Math.min(t,1));ang=Math.atan2(np.y-p.y,np.x-p.x);p=np;trail.push(p);if(trail.length>(kind==='spark'?6:12))trail.shift();
      if(kind!=='spark'&&Math.random()<.9)spark(p.x,p.y,{vx:rand(-30,30),vy:rand(-30,30),life:.3,max:.3,size:size*.5,color:T.c1,L});
      if(t>=1){onHit&&onHit(to);return false;}return true;},
    draw(){
      ctx.lineCap='round';
      for(let i=1;i<trail.length;i++){const a=i/trail.length;ctx.strokeStyle=T.glow;ctx.globalAlpha=a*.8;ctx.lineWidth=size*a*1.6;ctx.beginPath();ctx.moveTo(trail[i-1].x,trail[i-1].y);ctx.lineTo(trail[i].x,trail[i].y);ctx.stroke();}
      ctx.globalAlpha=1;
      glowCircle(p.x,p.y,size*2.6,T.glow,.9);
      if(kind==='blade'){ctx.save();ctx.translate(p.x,p.y);ctx.rotate(ang+time*20);ctx.fillStyle=T.hot;ctx.beginPath();ctx.arc(0,0,size*1.3,0,Math.PI*1.2);ctx.arc(size*.35,0,size*1.05,Math.PI*1.2,0,true);ctx.fill();ctx.restore();}
      else{ctx.fillStyle=T.hot;ctx.beginPath();ctx.arc(p.x,p.y,size*.8,0,7);ctx.fill();}
    }});
}
function lightning(a,b,w,T,life=.22){
  let t=0;let pts=[];const gen=()=>{pts=[a];const n=10;for(let i=1;i<n;i++){const k=i/n;pts.push({x:a.x+(b.x-a.x)*k+rand(-1,1)*w*4+rand(-14,14),y:a.y+(b.y-a.y)*k+rand(-6,6)});}pts.push(b);};gen();
  fx.push({upd(dt){t+=dt/life;if(Math.random()<.5)gen();return t<1;},draw(){
    ctx.lineJoin='round';ctx.lineCap='round';
    for(const [lw,col,al] of [[w*3.5,T.glow,.35],[w*1.6,T.c1,.8],[w*.6,'#fff',1]]){ctx.globalAlpha=al*(1-t);ctx.strokeStyle=col;ctx.lineWidth=lw;ctx.beginPath();ctx.moveTo(pts[0].x,pts[0].y);for(const p of pts)ctx.lineTo(p.x,p.y);ctx.stroke();}
    ctx.globalAlpha=1;}});
}
function tornado(x,y,w,h,life,dmg,T){
  let t=0,tick=0;const ticks=Math.max(3,Math.round(life/.12));const per=dmg/ticks;let done=0;
  fx.push({block:true,upd(dt){t+=dt;tick-=dt;
      if(tick<=0&&done<ticks){tick=life/ticks;done++;const yy=y-rand(.15,.85)*h;hitMon(per,x+rand(-w*.3,w*.3),yy,false);}
      for(let i=0;i<3;i++){const a=rand(0,6.28),hh=rand(0,h);spark(x+Math.cos(a)*w*(.3+hh/h*.7),y-hh,{vx:-Math.sin(a)*160,vy:-rand(40,160),life:.45,max:.45,size:rand(2,4+w/40),color:pick([T.hot,T.c1,T.glow])});}
      addShake(2+w/40);
      return t<life;},
    draw(){const fade=Math.min(1,t*4,(life-t)*3);ctx.globalAlpha=fade;
      const nR=14;for(let i=0;i<nR;i++){const k=i/(nR-1);const rw=w*(.25+k*.75)*(1+Math.sin(time*9+i)*.08);const yy=y-k*h;const off=Math.sin(time*6+k*4)*w*.12;
        ctx.strokeStyle=i%2?T.glow:T.c1;ctx.lineWidth=2+w/30;ctx.globalAlpha=fade*(.35+.5*k);ctx.beginPath();ctx.ellipse(x+off,yy,rw,rw*.22,0,time*8+i,time*8+i+4.4);ctx.stroke();}
      ctx.globalAlpha=1;}});
}
function blackHole(x,y,R,life,dmg,T){
  let t=0;
  fx.push({block:true,upd(dt){t+=dt;
      for(let i=0;i<3;i++){const a=rand(0,6.28),d=R*rand(1.6,3);spark(x+Math.cos(a)*d,y+Math.sin(a)*d,{vx:-Math.cos(a)*d*2.2,vy:-Math.sin(a)*d*2.2,life:.4,max:.4,size:rand(2,4),color:pick([T.c1,T.glow,'#fff']),drag:1});}
      addShake(1.5+R/30);
      if(t>=life){explode(x,y,6+R/12,T);ring(x,y,R*3.5,T.hot,10,.6);doFlash(.5,T.glow);addShake(10+R/6);noise(.6,.4,900);hitMon(dmg,x,y,true);return false;}return true;},
    draw(){const k=Math.min(1,t/(life*.6));const r=R*k*(1+Math.sin(time*30)*.05);
      glowCircle(x,y,r*2.4,T.glow,.8);ctx.fillStyle='#08000f';ctx.beginPath();ctx.arc(x,y,r,0,7);ctx.fill();
      ctx.strokeStyle=T.c1;ctx.lineWidth=2+R/20;ctx.beginPath();ctx.arc(x,y,r*1.08,time*5,time*5+4);ctx.stroke();}});
}

// ---------- combat ----------
const dmgFor=n=>Math.round(12*n*(1+(n-2)*0.3));
const odCount=n=>n>=10?Math.floor(n/10):0;

function applyElem(e,x,y){const S=mon.st;
  if(e==='burn')S.burn=Math.min(99,S.burn+1);

  else if(e==='shock')S.shock=Math.min(200,S.shock+1);
  else if(e==='dark')S.dark=Math.min(120,S.dark+1);
  else if(e==='weak'){if(!S.weak){S.weak=true;floatText(x,y-28,'공격력 -20%',14,'#8fd8ff');}}
  else if(e==='ice'&&!S.frozen&&Math.random()<.03){S.frozen=true;const I=SKILLS.ice;
    floatText(monX,groundY-monH()-34,'빙결!',26,'#bff4ff');burst(monX,groundY-monH()*.5,30,260,[I.hot,I.c1,I.glow],4);ring(monX,groundY-monH()*.5,monW,I.glow,6,.5);blip(1600,.3,'triangle',.1,2400);}
}
function hitMon(d,x,y,big){

  floatText(x+rand(-10,10),y,String(d),clamp(14+Math.sqrt(d)*1.6,14,60),big?'#ffe14a':'#fff');
  if(mon.hp>0&&curElem)applyElem(curElem,x,y);
  if(mon.hp<=0){mon.hp=0;mon.alive=false;mon.dying=1;stats.kills++;updateStat();
    const c={x:monX,y:groundY-monH()*.5};burst(c.x,c.y,80,420,['#ff4a3a','#ffb070','#fff','#8b2a2a'],6);ring(c.x,c.y,monW,'#ffd27a',12,.7);doFlash(.45,'#fff');addShake(14);noise(.8,.5,700);
    floatText(c.x,c.y-monH()*.6,'처치!',40,'#ff5a4a',0,-40);
    rollDrops(mon.boss).forEach((it,i)=>dropFx(it,c.x,c.y-monH()*.3,.35+i*.25));

      const img=mon.boss?bossImg:monImg,cx=monX+mon.knock,cw=monW,chh=monH();let t=0;mon.dying=0;
      fx.push({upd(dt){t+=dt;return t<.7;},draw(){ctx.globalCompositeOperation='source-over';ctx.globalAlpha=Math.max(0,1-t/.7);
        if(img.complete)ctx.drawImage(img,cx-cw/2,groundY-chh+t*40,cw,chh);ctx.globalAlpha=1;ctx.globalCompositeOperation='lighter';}});
      spawnMonster();mon.enter=.6;}}
}
function muzzleFlash(T,tier){const m=muzzle();core(m.x,m.y,12+tier*6,T.hot,.12);burst(m.x,m.y,4+tier*2,160,[T.hot,T.c1],2+tier*.5);heroCast=Math.max(heroCast,.18);}
function showBanner(text,sub,col,tier){banner={text,sub,col,tier,t:0};}

function slash(x,y,r,rot,T,thick,life=.3,sweep=2.6){
  let t=0;const a0=-sweep/2;
  for(let i=0;i<8;i++){const a=a0+sweep*i/7;spark(x+Math.cos(rot)*Math.cos(a)*r-Math.sin(rot)*Math.sin(a)*r*.35,y+Math.sin(rot)*Math.cos(a)*r+Math.cos(rot)*Math.sin(a)*r*.35,{vx:rand(-90,90),vy:rand(-90,90),life:.35,max:.35,size:thick*.35,color:pick([T.hot,T.c1])});}
  fx.push({upd(dt){t+=dt/life;return t<1;},draw(){
    const p=Math.min(1,t/.3),fade=t<.3?1:1-(t-.3)/.7;
    ctx.lineCap='round';
    for(const [w,col,al] of [[thick*2.4,T.glow,.35],[thick,T.c1,.9],[thick*.38,'#fff',1]]){
      ctx.globalAlpha=al*fade;ctx.strokeStyle=col;ctx.lineWidth=w*(.5+.5*fade);
      ctx.beginPath();ctx.ellipse(x,y,r*(1+t*.15),r*.35,rot,a0,a0+sweep*p);ctx.stroke();}
    ctx.globalAlpha=1;}});
}
function lineSlash(x,y,len,rot,T,thick,life=.45){
  let t=0;fx.push({upd(dt){t+=dt/life;return t<1;},draw(){
    const p=Math.min(1,t/.2),fade=t<.25?1:1-(t-.25)/.75,dx=Math.cos(rot)*len,dy=Math.sin(rot)*len;
    for(const [w,col,al] of [[thick*3,T.glow,.4],[thick,T.c1,.9],[thick*.35,'#fff',1]]){
      ctx.globalAlpha=al*fade;ctx.strokeStyle=col;ctx.lineWidth=w*fade+1;ctx.lineCap='round';
      ctx.beginPath();ctx.moveTo(x-dx*p,y-dy*p);ctx.lineTo(x+dx*p,y+dy*p);ctx.stroke();}
    ctx.globalAlpha=1;}});
}
function firePillar(x,w,h,life){

    for(let i=0;i<6;i++){const xx=x+rand(-w,w)*(1-Math.random()*.5);spark(xx,groundY-rand(0,20),{vx:rand(-20,20),vy:-rand(250,600)*(h/200),life:rand(.3,.6),max:.6,size:rand(4,9)*(w/40),color:pick([FIRE.hot,FIRE.c1,FIRE.glow,'#ff2a10']),g:-80,drag:.97});}

const shieldFor=n=>Math.round(15*n*(1+(n-2)*.15)*hero.max/BASE_HP);
function cast(type,n){
  const T=TYPES[type],tier=tierOf(n),total=Math.round(dmgFor(n)*atkMul());
  stats.count++;stats.sum+=n;stats.best=Math.max(stats.best,n);attacksLeft--;

    const K=Math.max(.45,monH()/130),p=monPoint(),r=(26+tier*12+i*2)*K,th=(5+tier*2.5)*K;
    slash(p.x,p.y,r,rand(-1,1)+(i%2?Math.PI:0),fire?FIRE:T,th);
    if(fire){burst(p.x,p.y,8+tier*5,140+tier*40,[FIRE.hot,FIRE.c1,FIRE.glow],3+tier,0,-200);core(p.x,p.y,14+tier*7,FIRE.hot,.2);}
    else burst(p.x,p.y,5+tier*3,180+tier*40,[T.hot,T.c1],2+tier*.6);
    if(el==='shock')lightning({x:p.x+rand(-25,25),y:p.y-70},p,1.2+tier*.4,T,.12);
    else if(el==='poison')burst(p.x,p.y,6+tier*2,90,[T.c1,T.glow,'#4a8a10'],3,0,260);
    else if(el==='dark')burst(p.x,p.y,6+tier*2,60,[T.c2,T.glow,'#2a0a4a'],5,0,-80);
    else if(el==='ice')burst(p.x,p.y,6+tier*2,200,['#ffffff',T.c1],2.5);
    else if(el==='weak')ring(p.x,p.y,18+tier*6,T.c1,2,.3);
    addShake(2+tier*1.2);noise(.07,.12+tier*.03,fire?1500:5000);blip(fire?300:900,.05,'square',.04,fire?120:400);
    hitMon(share,p.x,p.y-10,false);

  let tEnd=t0+hits*gap;

  if(tier===3){
    if(!fire){
      later(tEnd+.08,()=>{const p=c();slash(p.x,p.y,monW*.7,.7,T,16,.45,2.4);slash(p.x,p.y,monW*.7,-.7,T,16,.45,2.4);
        burst(p.x,p.y,50,420,[T.hot,T.c1,T.glow],5);doFlash(.4,'#e8f6ff');addShake(14);noise(.4,.4,5000);hitMon(total*.5,p.x,p.y,true);});
      tEnd+=.35;
    }else{
      later(tEnd+.04,()=>{liftHero(-spriteH*.45,.14);moveHero(dashTo()+monW*.1,.14,type);});
      later(tEnd+.2,()=>liftHero(0,.08));
      later(tEnd+.28,()=>{const p=c();lineSlash(p.x,p.y,monH()*.6,Math.PI/2,FIRE,18,.5);explode(p.x,groundY-10,10,FIRE);firePillar(p.x,40,180,.6);
        doFlash(.45,'#ff9a40');addShake(16);noise(.8,.5,900);hitMon(total*.5,p.x,p.y,true);});
      tEnd+=.6;
    }
  }else if(tier>=4){
    const od=odCount(n),each=total*.5/od,step=fire?.6:.5;
    for(let j=0;j<od;j++){const t1=tEnd+.15+j*step,pw=1+j*.25;
      later(t1-.05,()=>{floatText(W/2,battleTop+150+j*4,`OVERDRIVE ${od>1?(j+1)+'/'+od:''}`,22+j*4,fire?'#ffb050':'#9fdcff',0,-30);blip(200+j*80,.3,'sawtooth',.1,900+j*200);});
      if(!fire){
        later(t1,()=>{const p=c(),R=monW*.75*pw;
          slash(p.x,p.y,R,.7,T,16*pw,.45,2.4);slash(p.x,p.y,R,-.7,T,16*pw,.45,2.4);
          later(.1,()=>{lineSlash(p.x,p.y,W*pw,rand(-.3,.3),T,10+6*j,.55);ring(p.x,p.y,W*.6*pw,T.hot,12,.6);});
          burst(p.x,p.y,60+j*20,460+j*80,[T.hot,T.c1,T.glow],5+j);doFlash(.5,'#ffffff');addShake(18+j*4);noise(.6,.5,4000);
          hitMon(each,p.x,p.y-monH()*.3,true);});
      }else{
        later(t1,()=>{liftHero(-spriteH*(1+j*.3),.14);moveHero(dashTo()+monW*.1,.14,type);});
        later(t1+.17,()=>liftHero(0,.08));
        later(t1+.25,()=>{const p=c();lineSlash(p.x,p.y,monH()*.7*pw,Math.PI/2,FIRE,18*pw,.5);
          explode(p.x,groundY-10,10+j*3,FIRE);firePillar(p.x,(40+j*12)*Math.max(1,monW/60),200+j*60,.6);
          for(let q=0;q<2+j;q++)later(.1+q*.08,()=>{const z=monPoint();explode(z.x,z.y,7,FIRE);});
          doFlash(.5,'#ff9a40');addShake(18+j*4);noise(.9,.55,900);hitMon(each,p.x,p.y-monH()*.3,true);});
      }
    }
    tEnd+=.15+od*step+.2;
  }
  later(tEnd+.12,()=>moveHero(0,.22,type));
}
function shieldPath(s){ctx.beginPath();ctx.moveTo(0,-s);ctx.lineTo(s*.8,-s*.68);ctx.lineTo(s*.78,s*.1);ctx.quadraticCurveTo(s*.55,s*.72,0,s);ctx.quadraticCurveTo(-s*.55,s*.72,-s*.78,s*.1);ctx.lineTo(-s*.8,-s*.68);ctx.closePath();}
function shieldSkill(n,tier,T=SKILLS.shield){
  const val=shieldFor(n);hero.shield=Math.min(hero.max,hero.shield+val);
  const x=heroX,y=groundY-spriteH*.48,S=spriteH*(.17+tier*.025),life=.9+tier*.1;
  floatText(heroX,groundY-spriteH-30,'🛡 +'+val,20+tier*4,'#b8ffcf');
  blip(660,.3,'triangle',.12,990);later(.1,()=>blip(990,.4,'triangle',.1,1320));if(tier>=3)noise(.6,.2,6000);
  const layers=tier>=4?3:tier>=3?2:1;
  for(let L=0;L<layers;L++){let t=-L*.12;
    fx.push({upd(dt){t+=dt;
        if(t>0&&t<.05)burst(x,y,10+tier*8,120+tier*50,[T.hot,T.c1,'#ffffff'],3+tier);
        return t<life;},
      draw(){if(t<0)return;const k=t/life;let sc,a;
        if(k<.14){const q=k/.14;sc=.3+q*.8;a=q*.75;}
        else if(k<.26){sc=1.1-(k-.14)*.8;a=.75;}
        else{const q=(k-.26)/.74;sc=1+q*1.6;a=.75*(1-q)*(1-q);}
        sc*=1+L*.25;
        ctx.save();ctx.globalCompositeOperation='source-over';ctx.translate(x,y);ctx.scale(sc,sc);ctx.globalAlpha=a*(L?.5:1);
        glowCircle(0,0,S*1.8,T.glow,.55);
        shieldPath(S);const g=ctx.createLinearGradient(-S,-S,S,S);g.addColorStop(0,'#ffffff');g.addColorStop(.5,'#c8d0d8');g.addColorStop(1,'#7a8490');
        ctx.fillStyle=g;ctx.fill();ctx.lineWidth=S*.1;ctx.strokeStyle='#1a2a22';ctx.stroke();
        ctx.lineWidth=S*.05;ctx.strokeStyle=T.glow;shieldPath(S*.82);ctx.stroke();
        ctx.strokeStyle='rgba(60,70,80,.6)';ctx.lineWidth=S*.06;ctx.beginPath();ctx.moveTo(0,-S*.85);ctx.lineTo(0,S*.85);ctx.stroke();
        if(k>.12&&k<.32){const sh=((k-.12)/.2)*2.4-1.2;ctx.save();shieldPath(S);ctx.clip();ctx.globalCompositeOperation='lighter';ctx.fillStyle='rgba(255,255,255,.7)';ctx.beginPath();ctx.moveTo(sh*S-S*.2,-S);ctx.lineTo(sh*S+S*.1,-S);ctx.lineTo(sh*S-S*.3,S);ctx.lineTo(sh*S-S*.6,S);ctx.fill();ctx.restore();}
        ctx.restore();ctx.globalAlpha=1;ctx.globalCompositeOperation='lighter';}});
  }
  ring(heroX,groundY-spriteH*.45,spriteH*(.45+tier*.15),T.glow,3+tier,.5);
  if(tier>=4){doFlash(.35,'#9dffb8');ring(heroX,groundY-spriteH*.45,W*.8,T.hot,10,.8);}
}

function popOne(i){
  const k=chain[i],o=grid[k.r][k.c],T=TYPES[o.t];o.dead=true;o.pop=0.0001;
  const x=ocx(k.c),y=ocy(k.r),p=Math.min(i+1,12);
  spGauge=Math.min(SP_MAX,spGauge+1);prGauge=Math.min(PR_MAX,prGauge+1);updateSp();
  burst(x,y,6+p*4,60+p*30,[T.hot,T.c1,T.glow],2+p*.45,1);
  ring(x,y,cell*(.45+p*.16),T.glow,2+p*.7,.3+p*.02,1);
  core(x,y,cell*(.35+p*.08),T.hot,.2,1);
  floatText(x,y-cell*.3,(i+1)+'',12+p*2.4,i>=9?'#ffe14a':'#fff',1,-70);
  sfxPop(i);
  if(p>=7)addShake(1+p*.4);
  if(i+1===10){doFlash(.25,T.glow);ring(bx+bw/2,by+bh/2,bw*.7,T.hot,10,.5,1);}
  // energy to hero
  const H0={x:heroX,y:groundY-spriteH*.45};
  shoot({from:{x,y},to:H0,dur:.35+rand(0,.1),size:2.5+p*.3,T,kind:'spark',arc:80,block:false,L:1,onHit:()=>{heroCharge=Math.min(1,heroCharge+.12);heroChargeCol=T.glow;}});
}
function collapse(){
  for(let c=0;c<COLS;c++){
    const keep=[];for(let r=ROWS-1;r>=0;r--){const o=grid[r][c];if(!o.dead)keep.push({o,r});}
    let r=ROWS-1;
    for(const k of keep){k.o.off+=(k.r-r)*cell;grid[r][c]=k.o;r--;}
    const removed=ROWS-keep.length;
    while(r>=0){const o=newOrb();o.off=-removed*cell-cell*.6;grid[r][c]=o;r--;}
  }
}

const SAVE_KEY='orbBattleSave_v1';
const SLOTS=[{n:'검'},{n:'갑주'},{n:'신발'},{n:'반지'},{n:'목걸이'},{n:'부적'}];
const GRADES=[{n:'일반',c:'#c8c8c8'},{n:'레어',c:'#4aa8ff'},{n:'유니크',c:'#c36bff'}];
const NAMES=[['낡은 검','기사의 검','혈월검'],['가죽 갑주','강철 갑주','용린 갑주'],['가죽 신발','강철 장화','질풍의 장화'],
  ['구리 반지','은 반지','마력의 반지'],['나무 목걸이','은 목걸이','성자의 목걸이'],['종이 부적','봉인 부적','천명 부적']];
const GMUL=[1,1.6,2.4],ACC_RANGE=[[1,3],[3,6],[6,9]];
const MAX_STAGE=10,BASE_HP=600,BASE_ATK=20;
let save={bag:[],eq:[null,null,null,null,null,null],cleared:0,uid:1,subHalf:1,orbs:['slash','fire','shield'],loadout:['slash','fire','shield']};
let mode='stage';
const rIdx=()=>mode==='inf'?((mon.lvl-1)%10)+1:mon.lvl;
const stEff=()=>mode==='inf'?1+Math.floor((mon.lvl-1)/10):stage;
const rLabel=()=>mode==='inf'?`무한 R${mon.lvl}`:`${stage}-${mon.lvl}`;
let scene='lobby',stage=1,selStage=1,loot=[],stageOver=false;
let cur={atk:BASE_ATK,hp:BASE_HP,def:0,ob:[0,0,0]};
function loadSave(){let old=false;try{const s=JSON.parse(localStorage.getItem(SAVE_KEY)||'null');if(s&&Array.isArray(s.bag)){old=!s.subHalf;save=Object.assign(save,s);}}catch(e){}
  if(!Array.isArray(save.orbs))save.orbs=['slash','fire','shield'];if(!Array.isArray(save.loadout)||save.loadout.length!==3)save.loadout=['slash','fire','shield'];
  for(const [st,id] of Object.entries(UNLOCK_AT))if(save.cleared>=+st&&!save.orbs.includes(id))save.orbs.push(id);
  let ch=false;for(const it of [...save.bag,...save.eq])if(it&&!it.subs){it.subs=rollSubs(it.grade,it.stage);ch=true;}if(old){for(const it of [...save.bag,...save.eq])if(it&&it.subs)it.subs.forEach(sb=>sb.v=Math.max(1,Math.round(sb.v/2)));save.subHalf=1;ch=true;}
  if(ch)writeSave();}
function writeSave(){try{localStorage.setItem(SAVE_KEY,JSON.stringify(save));}catch(e){}}
function makeItem(slot,grade,st){
  const it={id:save.uid++,slot,grade,stage:st},m=GMUL[grade]*rand(.85,1.15);
  if(slot===0)it.val=Math.round((5+st*5)*m);
  else if(slot===1)it.val=Math.round((40+st*40)*m);
  else if(slot===2)it.val=Math.round((4+st*4)*m);
  else{const [a,b]=ACC_RANGE[grade];it.orb=(Math.random()*3)|0;it.val=a+Math.floor(Math.random()*(b-a+1));}
  it.subs=rollSubs(grade,st);
  return it;
}
// 보조 옵션: 6종 중 서로 다른 3줄
const SUB_DEF=[
  {k:'atk',n:'공격력',pct:false,base:2,per:2},
  {k:'def',n:'방어력',pct:false,base:2,per:2},
  {k:'hp', n:'체력',  pct:false,base:15,per:15},
  {k:'atkP',n:'공격력',pct:true},{k:'defP',n:'방어력',pct:true},{k:'hpP',n:'체력',pct:true}];
const SUB_PCT=[[1,2],[2,4],[3,6]];
function rollSubs(grade,st){
  const idx=[0,1,2,3,4,5].sort(()=>Math.random()-.5).slice(0,3);
  return idx.map(i=>{const d=SUB_DEF[i];let v;
    if(d.pct){const [a,b]=SUB_PCT[grade];v=a+Math.floor(Math.random()*(b-a+1));}
    else v=Math.max(1,Math.round((d.base+d.per*st)*GMUL[grade]*rand(.15,.4)));
    return{k:d.k,v};});
}
function subText(sb){const d=SUB_DEF.find(x=>x.k===sb.k);return `${d.n} +${sb.v}${d.pct?'%':''}`;}
const itemName=it=>NAMES[it.slot][it.grade];
function itemOpt(it){
  if(it.slot===0)return `공격력 +${it.val}`;if(it.slot===1)return `체력 +${it.val}`;if(it.slot===2)return `방어력 +${it.val}`;
  return `${it.orb+1}번 칸(${TYPES[it.orb].name}) 구슬 등장 +${it.val}%`;
}
function getStats(){
  const s={atk:BASE_ATK,hp:BASE_HP,def:0,ob:[0,0,0]},p={atkP:0,defP:0,hpP:0};
  for(const it of save.eq){if(!it)continue;
    if(it.slot===0)s.atk+=it.val;else if(it.slot===1)s.hp+=it.val;else if(it.slot===2)s.def+=it.val;else s.ob[it.orb]+=it.val;
    for(const sb of it.subs||[]){if(sb.k in p)p[sb.k]+=sb.v;else s[sb.k]+=sb.v;}}
  s.flat={atk:s.atk,hp:s.hp,def:s.def};s.pct=p;

  return s;
}

// ---------- update ----------
function update(dt){
  time+=dt;
  for(let i=timers.length-1;i>=0;i--){const tm=timers[i];if(tm&&(tm.t-=dt)<=0){timers.splice(i,1);tm.f();}}
  if(state==='pop'){
    popTimer-=dt;
    if(popTimer<=0&&popIdx<popN){popOne(popIdx);popIdx++;popTimer=Math.max(.05,.12-popIdx*.008);}
    if(popIdx>=popN&&popTimer<=0){cast(popType,popN);chain=[];later(.18,()=>{collapse();});state='settle';}
  }
  // orbs
  let moving=false;
  for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){const o=grid[r]&&grid[r][c];if(!o)continue;
    if(o.pop>0){o.pop+=dt/.25;if(o.pop>1)o.pop=1;}
    if(o.off<0){moving=true;o.vy+=3000*dt;o.off+=o.vy*dt;if(o.off>=0){o.off=0;o.vy=0;}}}
  if(state==='settle'){
    const busy=timers.length>0||fx.some(f=>f.block)||grid.some(row=>row.some(o=>o.dead));
    if(!moving&&!busy){boardMax=largestGroup().length;updateStat();
      if(boardMax<2){fillBoard();return;}
      if(attacksLeft<=0&&mon.alive)enemyAttack();else{if(attacksLeft<=0)attacksLeft=ATK_EVERY;state='idle';}}
  }
  for(let i=parts.length-1;i>=0;i--){const p=parts[i];p.life-=dt;if(p.life<=0){parts.splice(i,1);continue;}p.vy+=p.g*dt;const dr=Math.pow(p.drag,dt*60);p.vx*=dr;p.vy*=dr;p.x+=p.vx*dt;p.y+=p.vy*dt;}
  for(let i=fx.length-1;i>=0;i--){if(!fx[i].upd(dt))fx.splice(i,1);}
  for(let i=texts.length-1;i>=0;i--){const t=texts[i];t.t+=dt;t.y+=t.vy*dt;t.vy*=.95;if(t.t>t.life)texts.splice(i,1);}
  shake*=Math.pow(.0015,dt);if(shake<.2)shake=0;
  flash.a=Math.max(0,flash.a-dt*2.2);
  if(banner){banner.t+=dt;if(banner.t>1.6)banner=null;}
  heroCast=Math.max(0,heroCast-dt);heroCharge=Math.max(0,heroCharge-dt*.15);
  mon.flash=Math.max(0,mon.flash-dt);mon.knock*=Math.pow(.004,dt);
  if(mon.enter>0)mon.enter=Math.max(0,mon.enter-dt*3.5);
  if(mon.dying>0)mon.dying=Math.max(0,mon.dying-dt*1.2);
  if(hintT>0)hintT-=dt;
  priest.cast=Math.max(0,priest.cast-dt*1.2);hero.flash=Math.max(0,hero.flash-dt);hero.knock*=Math.pow(.01,dt);hero.swing=Math.max(0,hero.swing-dt);
  const ease=q=>1-Math.pow(1-q,3);
  if(hero.tw){const w=hero.tw;w.t+=dt;const q=Math.min(1,w.t/w.dur);const prev=hero.off;hero.off=w.from+(w.to-w.from)*ease(q);
    if(Math.abs(hero.off-prev)>2){hero.ghostT-=dt;if(hero.ghostT<=0){hero.ghostT=.025;ghosts.push({x:heroX+hero.off,y:hero.lift,a:.6,t:hero.ghostCol});}}
    if(q>=1)hero.tw=null;}
  if(hero.lw){const w=hero.lw;w.t+=dt;const q=Math.min(1,w.t/w.dur);hero.lift=w.from+(w.to-w.from)*ease(q);if(q>=1)hero.lw=null;}
  for(let i=ghosts.length-1;i>=0;i--){ghosts[i].a-=dt*2.5;if(ghosts[i].a<=0)ghosts.splice(i,1);}
  if(state==='enemy')mon.atkT+=dt;
  for(const row of grid)for(const o of row)if(o.wig>0)o.wig=Math.max(0,o.wig-dt);
}

// ---------- draw ----------
function drawBG(){
  ctx.fillStyle='#3a7a2a';ctx.fillRect(-30,-30,W+60,H+60);
  if(mapImg.complete&&mapImg.naturalWidth)ctx.drawImage(mapImg,(W-mapDW)/2,mapY,mapDW,mapDH);
  const g=ctx.createLinearGradient(0,0,0,battleTop+40);g.addColorStop(0,'rgba(0,0,0,.45)');g.addColorStop(1,'rgba(0,0,0,0)');ctx.fillStyle=g;ctx.fillRect(-30,-30,W+60,battleTop+70);
}
function drawPriest(){
  const P=priestPos(),h=spriteH*.95,w=h*225/300,bob=Math.sin(time*2.4+1)*1.5-(priest.cast>0?Math.sin(priest.cast*Math.PI)*8:0);
  ctx.fillStyle='rgba(0,0,0,.3)';ctx.beginPath();ctx.ellipse(P.x,groundY,w*.35,4,0,0,7);ctx.fill();
  if(priest.cast>0){ctx.globalCompositeOperation='lighter';glowCircle(P.x,groundY-h*.5,h*1.2,'#ff7ac0',priest.cast*.8);ctx.globalCompositeOperation='source-over';}
  if(priestImg.complete)ctx.drawImage(priestImg,P.x-w/2,groundY-h+bob,w,h);
}
function drawHero(){
  const bob=Math.sin(time*2.4)*2,hx=heroX+hero.off+hero.knock,top=groundY-spriteH+bob+hero.lift;
  ctx.fillStyle='rgba(0,0,0,.35)';ctx.beginPath();ctx.ellipse(hx,groundY,heroW*.32*(1+hero.lift/spriteH*.5),7,0,0,7);ctx.fill();
  if(heroCharge>0.01){ctx.globalCompositeOperation='lighter';glowCircle(hx,groundY-spriteH*.45,spriteH*(.4+heroCharge*.4),heroChargeCol,heroCharge*.7);ctx.globalCompositeOperation='source-over';}
  if(hero.shield>0){const G=SKILLS.shield;ctx.globalCompositeOperation='lighter';ctx.globalAlpha=.25+.1*Math.sin(time*4);ctx.strokeStyle=G.glow;ctx.lineWidth=3;
    ctx.beginPath();ctx.ellipse(hx,groundY-spriteH*.48+hero.lift,heroW*.62,spriteH*.58,0,0,7);ctx.stroke();ctx.globalAlpha=1;ctx.globalCompositeOperation='source-over';}
  for(const g of ghosts){const im=heroTint[g.t];if(!im)continue;ctx.globalAlpha=g.a*.6;ctx.drawImage(im,g.x-heroW/2,groundY-spriteH+g.y,heroW,spriteH);}
  ctx.globalAlpha=1;
  ctx.save();ctx.translate(hx,groundY+hero.lift);if(hero.swing>0)ctx.rotate(Math.sin(hero.swing/.1*Math.PI)*.18);
  if(heroImg.complete)ctx.drawImage(heroImg,-heroW/2,-spriteH+bob,heroW,spriteH-bob);
  if(hero.flash>0&&heroRed){ctx.globalAlpha=hero.flash/.18*.7;ctx.drawImage(heroRed,-heroW/2,-spriteH+bob,heroW,spriteH-bob);ctx.globalAlpha=1;}
  ctx.restore();
  if(scene==='lobby')return;
  // hp bar
  const bw2=Math.max(90,Math.min(heroW*.9,150)),bx3=heroX-bw2/2,hy=Math.max(battleTop+4,groundY-spriteH-18);
  ctx.fillStyle='rgba(0,0,0,.7)';ctx.fillRect(bx3-2,hy-2,bw2+4,12);ctx.fillStyle='#0d2a14';ctx.fillRect(bx3,hy,bw2,8);
  ctx.fillStyle=hero.hp/hero.max>.3?'#3ad06a':'#e8c43a';ctx.fillRect(bx3,hy,bw2*hero.hp/hero.max,8);
  if(hero.shield>0){ctx.fillStyle='rgba(220,255,230,.85)';const sw=bw2*Math.min(1,hero.shield/hero.max);ctx.fillRect(bx3,hy+5,sw,3);}
  ctx.font='800 11px system-ui,sans-serif';ctx.textAlign='center';ctx.lineWidth=3;ctx.strokeStyle='rgba(0,0,0,.8)';
  const lbl=`HP ${hero.hp}/${hero.max}`+(hero.shield>0?`  🛡${hero.shield}`:'');ctx.strokeText(lbl,heroX,hy-6);ctx.fillStyle='#e8ffe8';ctx.fillText(lbl,heroX,hy-6);
}
function drawMon(){
  if(!mon.alive&&mon.dying<=0)return;
  const mh=monH(),mw=monW,br=Math.sin(time*2)*.015;
  const lunge=state==='enemy'?-Math.sin(clamp(mon.atkT/.9,0,1)*Math.PI)*(monX-heroX)*.5:0;
  const x=monX+mon.knock+mon.enter*W*.5+lunge,a=mon.alive?1:mon.dying;
  ctx.globalAlpha=a;
  ctx.fillStyle='rgba(0,0,0,.45)';ctx.beginPath();ctx.ellipse(x,groundY,mw*.38,9,0,0,7);ctx.fill();
  const h=mh*(1+br),y=groundY-h+(mon.alive?0:(1-mon.dying)*30);
  const mi=mon.boss?bossImg:monImg,mwh=mon.boss?bossWhite:monWhite;
  if(mi.complete)ctx.drawImage(mi,x-mw/2,y,mw,h);
  if(mon.flash>0&&mwh){ctx.globalAlpha=a*mon.flash/.1*.85;ctx.drawImage(mwh,x-mw/2,y,mw,h);}
  const ice=mon.boss?bossIce:monIce;if(mon.alive&&mon.st.frozen&&ice){ctx.globalAlpha=.5+.1*Math.sin(time*5);ctx.drawImage(ice,x-mw/2,y,mw,h);}
  ctx.globalAlpha=1;
  if(mon.alive){ // hp bar
    const bw2=Math.max(100,Math.min(mw*.9,170)),hx=monX-bw2/2+mon.enter*W*.5,hy=Math.max(battleTop+4,groundY-mh-26);
    ctx.fillStyle='rgba(0,0,0,.7)';ctx.fillRect(hx-2,hy-2,bw2+4,12);
    ctx.fillStyle='#4a0d0d';ctx.fillRect(hx,hy,bw2,8);
    ctx.fillStyle='#e8343a';ctx.fillRect(hx,hy,bw2*mon.hp/mon.max,8);
    ctx.font='800 11px system-ui,sans-serif';ctx.textAlign='center';ctx.lineWidth=3;ctx.strokeStyle='rgba(0,0,0,.8)';ctx.strokeText(`${mon.boss?'BOSS 미노타우로스':'고블린'} ${rLabel()}  ${mon.hp}/${mon.max}`,hx+bw2/2,hy-6);ctx.fillStyle='#ffe9d8';
    ctx.fillText(`${mon.boss?'BOSS 미노타우로스':'고블린'} ${rLabel()}  ${mon.hp}/${mon.max}`,hx+bw2/2,hy-6);
    const warn=attacksLeft<=1;ctx.font='800 12px system-ui,sans-serif';
    ctx.fillStyle=warn?`rgba(255,${80+80*Math.sin(time*10)},80,1)`:'#ffb08a';
    {const S=mon.st,tags=[];if(S.frozen)tags.push(['❄빙결','#bff4ff']);if(S.weak)tags.push(['💧약화','#8fd8ff']);
      if(S.burn)tags.push(['🔥'+S.burn,'#ffb070']);if(S.poison)tags.push(['☠'+S.poison,'#c8ff7a']);if(S.shock)tags.push(['⚡'+S.shock,'#ffe86a']);if(S.dark)tags.push(['🌑'+S.dark,'#d8b0ff']);
      if(tags.length){ctx.font='800 11px system-ui,sans-serif';const ws=tags.map(t=>ctx.measureText(t[0]).width+8),tot=ws.reduce((a,b)=>a+b,0);let xx=hx+bw2/2-tot/2;
        tags.forEach((t,i)=>{ctx.textAlign='left';ctx.strokeText(t[0],xx,hy-38);ctx.fillStyle=t[1];ctx.fillText(t[0],xx,hy-38);xx+=ws[i];});ctx.textAlign='center';
        ctx.font='800 12px system-ui,sans-serif';ctx.fillStyle=attacksLeft<=1?`rgba(255,${80+80*Math.sin(time*10)},80,1)`:'#ffb08a';}}
    ctx.strokeText(attacksLeft<=0?'⚔ 공격 준비!':`⚔ 공격까지 ${attacksLeft}턴`,hx+bw2/2,hy-22);ctx.fillText(attacksLeft<=0?'⚔ 공격 준비!':`⚔ 공격까지 ${attacksLeft}턴`,hx+bw2/2,hy-22);
  }
}
function drawParts(L){
  ctx.globalCompositeOperation='lighter';
  for(const p of parts){if(p.L!==L)continue;const a=p.life/p.max;ctx.globalAlpha=a;ctx.fillStyle=p.color;ctx.beginPath();ctx.arc(p.x,p.y,p.size*(.4+a*.6),0,7);ctx.fill();}
  ctx.globalAlpha=1;
  for(const f of fx)if((f.L||0)===L)f.draw();
  ctx.globalCompositeOperation='source-over';
}
function drawTexts(L){
  ctx.textAlign='center';ctx.lineJoin='round';
  for(const t of texts){if(t.L!==L)continue;const k=t.t/t.life,pop=k<.12?1+(1-k/.12)*.6:1;
    ctx.globalAlpha=k>.7?(1-k)/.3:1;ctx.font=`900 ${t.size*pop}px system-ui,sans-serif`;
    ctx.strokeStyle='rgba(20,0,0,.9)';ctx.lineWidth=Math.max(3,t.size*.16);ctx.strokeText(t.s,t.x,t.y);ctx.fillStyle=t.col;ctx.fillText(t.s,t.x,t.y);}
  ctx.globalAlpha=1;
}
function drawBanner(){
  if(!banner)return;const b=banner,k=b.t/1.6,s=k<.1?.5+k/.1*.5+(.1-k)*3:1;
  ctx.globalAlpha=k>.75?(1-k)/.25:1;ctx.textAlign='center';
  const y=battleTop+48;ctx.save();ctx.translate(W/2,y);ctx.scale(s,s);
  ctx.font=`900 ${18+b.tier*4}px system-ui,sans-serif`;ctx.lineWidth=5;ctx.strokeStyle='#1a0006';ctx.strokeText(b.text,0,0);ctx.fillStyle='#fff';ctx.fillText(b.text,0,0);
  if(b.sub){ctx.font=`900 ${14+b.tier*4}px system-ui,sans-serif`;ctx.strokeText(b.sub,0,24+b.tier*3);ctx.fillStyle=b.col;ctx.fillText(b.sub,0,24+b.tier*3);}
  ctx.restore();ctx.globalAlpha=1;
}
function drawBoard(){
  // frame
  const pad=7;
  ctx.fillStyle='rgba(30,20,12,.82)';ctx.strokeStyle='#6a4a2a';ctx.lineWidth=3;
  ctx.beginPath();ctx.roundRect?ctx.roundRect(bx-pad,by-pad,bw+pad*2,bh+pad*2,12):ctx.rect(bx-pad,by-pad,bw+pad*2,bh+pad*2);ctx.fill();ctx.stroke();
  ctx.save();ctx.beginPath();ctx.rect(bx-pad,by-pad,bw+pad*2,bh+pad*2);ctx.clip();
  for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){if((r+c)%2===0){ctx.fillStyle='rgba(255,255,255,.025)';ctx.fillRect(bx+c*cell,by+r*cell,cell,cell);}}
  const sel=new Set(chain.map(k=>k.r*COLS+k.c)),hint=hintT>0?new Set(hintPath.map(k=>k.r*COLS+k.c)):null;
  const S=cell*1.4;
  for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){const o=grid[r][c];if(!o)continue;
    let sc=.92,a=1;const x=ocx(c)+(o.wig>0?Math.sin(o.wig*60)*4:0),y=ocy(r)+o.off;
    if(o.dead){if(o.pop>=1)continue;sc=.92+o.pop*.8;a=1-o.pop;}
    const isSel=sel.has(r*COLS+c);
    if(isSel){sc=1.08+Math.sin(time*14)*.04;ctx.globalCompositeOperation='lighter';glowCircle(x,y,cell*.7,TYPES[o.t].glow,.6);ctx.globalCompositeOperation='source-over';}
    if(hint&&hint.has(r*COLS+c)){ctx.strokeStyle='rgba(255,240,160,'+(.5+.5*Math.sin(time*10))+')';ctx.lineWidth=2.5;ctx.beginPath();ctx.arc(x,y,cell*.46,0,7);ctx.stroke();}
    ctx.globalAlpha=a;const s=S*sc*.68;if(orbImg[o.t].complete)ctx.drawImage(orbImg[o.t],x-s/2,y-s/2,s,s);ctx.globalAlpha=1;
  }
  ctx.restore();
}
function frame(){
  ctx.setTransform(DPR,0,0,DPR,0,0);ctx.imageSmoothingEnabled=false;
  ctx.fillStyle='#07040b';ctx.fillRect(0,0,W,H);
  ctx.save();
  if(shake>0)ctx.translate(rand(-shake,shake),rand(-shake,shake));
  drawBG();drawPriest();drawHero();drawMon();drawParts(0);drawTexts(0);drawBanner();
  ctx.restore();
  if(scene==='battle')drawBoard();drawParts(1);drawTexts(1);
  if(flash.a>0){ctx.globalAlpha=flash.a;ctx.fillStyle=flash.c;ctx.globalCompositeOperation='lighter';ctx.fillRect(0,0,W,H);ctx.globalCompositeOperation='source-over';ctx.globalAlpha=1;}
}
let last=performance.now();
function loop(now){const dt=Math.min(.05,(now-last)/1000);last=now;update(dt);frame();requestAnimationFrame(loop);}
window.addEventListener('resize',()=>{layout();});
document.getElementById('prImg').src=PRIEST_SRC;
document.getElementById('bagHero').src=HERO_SRC;
loadSave();applyLoadout();layout();goLobby();updateStat();updateSp();
requestAnimationFrame(loop);
</script>
</body>
